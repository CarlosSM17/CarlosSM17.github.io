 y devolver (\u003ccode\u003ereturn\u003c/code\u003e).","Usar el valor que devuelve una función en cuentas, variables y condiciones.","Descomponer un programa en funciones pequeñas."],"teoria":[{"tipo":"texto","html":"Hasta ahora tus funciones \u003cb\u003ehacían\u003c/b\u003e algo (mostraban texto). Con \u003ccode\u003ereturn\u003c/code\u003e, una función también puede \u003cb\u003eresponder\u003c/b\u003e: calcula un valor y lo entrega a quien la llamó."},{"tipo":"animacion","titulo":"Una función es como una máquina","animacion":"funcion"},{"tipo":"bloques","codigo":"def doble(n):\n    return n * 2\nresultado = doble(4) + 1\nprint(resultado)","alto":170,"nota":"\u003ccode\u003edoble(4)\u003c/code\u003e se reemplaza por lo que devuelve (8). Por eso se puede sumar, guardar o comparar."},{"tipo":"titulo","texto":"print vs return"},{"tipo":"analogia","icono":"📣","titulo":"Decirlo en voz alta o entregarlo por escrito","html":"\u003ccode\u003eprint\u003c/code\u003e es decir el resultado en voz alta: todos lo oyen, pero nadie lo puede guardar. \u003ccode\u003ereturn\u003c/code\u003e es entregarlo en un papel a quien preguntó: lo puede guardar en una variable, usarlo en una cuenta o mostrarlo después."},{"tipo":"codigo","codigo":"def doble_print(n):\n    print(n * 2)\n\ndef doble_return(n):\n    return n * 2\n\nx = doble_return(5) + 1\nprint(x)\ny = doble_print(5)\nprint(y)","nota":"La función con print no devuelve nada: por eso \u003ccode\u003ey\u003c/code\u003e vale \u003ccode\u003eNone\u003c/code\u003e."},{"tipo":"texto","html":"Cuando Python llega a un \u003ccode\u003ereturn\u003c/code\u003e, la función \u003cb\u003etermina en ese momento\u003c/b\u003e, aunque haya más líneas después."},{"tipo":"titulo","texto":"Descomposición"},{"tipo":"texto","html":"Descomponer es dividir un problema grande en partes pequeñas con nombre. Un quiz, por ejemplo: una función que hace \u003ci\u003euna\u003c/i\u003e pregunta y devuelve 1 o 0 puntos, otra que elige el mensaje final, y un programa principal corto que las usa."},{"tipo":"comparacion","titulo":"De Scratch a Python","filas":[{"scratch":"(los bloques propios de Scratch no devuelven valores)","python":"def area(b, h):\n    return b * h","nota":"En Python las funciones pueden devolver un valor, como los bloques redondos de Scratch (operadores)."}]}],"fichas":[{"titulo":"Devolver un valor","codigo":"def doble(n):\n    return n * 2\n\nx = doble(7)"},{"titulo":"Devolver True o False","codigo":"def es_par(n):\n    return n % 2 == 0\n\nif es_par(10):\n    print(\"Par\")"},{"titulo":"Varios return","codigo":"def mayor(a, b):\n    if a \u003e b:\n        return a\n    return b"}],"glosario":[{"en":"return","es":"devolver, regresar","def":"Termina la función y entrega un valor a quien la llamó."},{"en":"return value","es":"valor devuelto","def":"El resultado que entrega una función."},{"en":"None","es":"nada, ninguno","def":"Valor que devuelve una función que no tiene return."},{"en":"decomposition","es":"descomposición","def":"Dividir un problema en partes más pequeñas."}],"ejemplo":{"titulo":"Áreas de rectángulos","descripcion":"Una función que calcula y devuelve un área.","codigo":"def area_rectangulo(base, altura):\n    return base * altura\n\na1 = area_rectangulo(3, 4)\na2 = area_rectangulo(5, 2)\nprint(\"Área total:\", a1 + a2)","prediccion":{"pregunta":"¿Qué número muestra el programa?","opciones":["22","12","10","14"],"correcta":0,"explicacion":"area_rectangulo(3, 4) devuelve 12 y area_rectangulo(5, 2) devuelve 10: 12 + 10 = 22."},"investigar":["Con 👣 Paso a paso, observa qué valor recibe \u003ccode\u003ea1\u003c/code\u003e cuando termina la función.","¿Qué pasa si cambias \u003ccode\u003ereturn\u003c/code\u003e por \u003ccode\u003eprint\u003c/code\u003e?","¿Puedes escribir \u003ccode\u003eprint(area_rectangulo(2, 2))\u003c/code\u003e directamente?"],"modificar":"Agrega una función \u003ccode\u003eperimetro_rectangulo(base, altura)\u003c/code\u003e que devuelva el perímetro y úsala."},"microretos":[{"id":"s14-m1","titulo":"El doble","resumen":"Tu primer return.","enunciado":"Completa la función \u003ccode\u003edoble(n)\u003c/code\u003e para que \u003cb\u003edevuelva\u003c/b\u003e el doble de n. El programa debe mostrar \u003ccode\u003e14\u003c/code\u003e.","inicio":"def doble(n):\n    ___\n\nprint(doble(7))","requiere":["return"],"prohibe":[],"pruebas":[{"exacto":"14"}],"solucion":"def doble(n):\n    return n * 2\n\nprint(doble(7))","pistas":["Usa \u003ccode\u003ereturn\u003c/code\u003e, no print.","Después de return va el valor que se entrega.","La línea es \u003ccode\u003ereturn n * 2\u003c/code\u003e."]},{"id":"s14-m2","titulo":"¿Es par?","resumen":"Devolver True o False.","enunciado":"Completa \u003ccode\u003ees_par(n)\u003c/code\u003e para que devuelva \u003ccode\u003eTrue\u003c/code\u003e si n es par. El programa pide un número y muestra \u003ccode\u003ePar\u003c/code\u003e o \u003ccode\u003eImpar\u003c/code\u003e.","inicio":"def es_par(n):\n    return ___\n\nnumero = int(input(\"Número: \"))\nif es_par(numero):\n    print(\"Par\")\nelse:\n    print(\"Impar\")","requiere":["return","%"],"pruebas":[{"nombre":"8","entradas":["8"],"contiene":["Par"],"no_contiene":["Impar"]},{"nombre":"3","entradas":["3"],"contiene":["Impar"]}],"solucion":"def es_par(n):\n    return n % 2 == 0\n\nnumero = int(input(\"Número: \"))\nif es_par(numero):\n    print(\"Par\")\nelse:\n    print(\"Impar\")","pistas":["Una comparación ya es True o False: se puede devolver directamente.","Un número es par si el residuo entre 2 es 0.","Escribe \u003ccode\u003ereturn n % 2 == 0\u003c/code\u003e."]},{"id":"s14-m3","titulo":"El mayor de dos","resumen":"Varios return.","enunciado":"Escribe \u003ccode\u003emayor(a, b)\u003c/code\u003e que devuelva el número más grande. Pide dos números y muestra \u003ccode\u003eEl mayor es 9\u003c/code\u003e.","inicio":"def mayor(a, b):\n    # Si a es más grande, devuelve a; si no, devuelve b\n    ___\n\nx = int(input(\"Primer número: \"))\ny = int(input(\"Segundo número: \"))\nprint(\"El mayor es\", mayor(x, y))","requiere":["def","return*2"],"prohibe":["max"],"pruebas":[{"nombre":"4 y 9","entradas":["4","9"],"contiene":["El mayor es 9"]},{"nombre":"12 y 5","entradas":["12","5"],"contiene":["El mayor es 12"]}],"solucion":"def mayor(a, b):\n    if a \u003e b:\n        return a\n    return b\n\nx = int(input(\"Primer número: \"))\ny = int(input(\"Segundo número: \"))\nprint(\"El mayor es\", mayor(x, y))","pistas":["Usa un if dentro de la función, con un return en cada caso.","Si \u003ccode\u003ea \u0026gt; b\u003c/code\u003e, devuelve a; después del if, devuelve b.","Son tres líneas: \u003ccode\u003eif a \u0026gt; b:\u003c/code\u003e, \u003ccode\u003ereturn a\u003c/code\u003e (con sangría) y \u003ccode\u003ereturn b\u003c/code\u003e."]}],"reto":{"id":"s14-reto","titulo":"Rehacer el quiz con funciones","historia":"El quiz de la Sesión 7 tenía el mismo código repetido. ¡Hora de mejorarlo!","enunciado":"Escribe dos funciones:\u003cul\u003e\u003cli\u003e\u003ccode\u003epreguntar(pregunta, correcta)\u003c/code\u003e: pide la respuesta (en minúsculas con \u003ccode\u003e.lower()\u003c/code\u003e), muestra \u003ccode\u003eCorrecto\u003c/code\u003e o \u003ccode\u003eIncorrecto\u003c/code\u003e y \u003cb\u003edevuelve\u003c/b\u003e 1 si acertó o 0 si no.\u003c/li\u003e\u003cli\u003e\u003ccode\u003emensaje_final(puntaje)\u003c/code\u003e: devuelve \u003ccode\u003e¡Excelente!\u003c/code\u003e si el puntaje es 3, \u003ccode\u003eBien\u003c/code\u003e si es 2 y \u003ccode\u003eSigue practicando\u003c/code\u003e si es menor.\u003c/li\u003e\u003c/ul\u003eCon ellas haz estas 3 preguntas: \u003ci\u003e¿Cuántas patas tiene una araña?\u003c/i\u003e (8), \u003ci\u003e¿De qué color es el cielo despejado?\u003c/i\u003e (azul), \u003ci\u003e¿Cuánto es 9 x 7?\u003c/i\u003e (63). Al final muestra \u003ccode\u003ePuntaje: 2 de 3\u003c/code\u003e y el mensaje.","requiere":["def*2","return*2"],"pruebas":[{"nombre":"Todas bien","entradas":["8","azul","63"],"contiene":["Correcto","Correcto","Correcto","Puntaje: 3 de 3","Excelente"]},{"nombre":"Solo la primera","entradas":["8","rojo","60"],"contiene":["Correcto","Incorrecto","Incorrecto","Puntaje: 1 de 3","Sigue practicando"]},{"nombre":"Con mayúsculas","entradas":["7","AZUL","63"],"contiene":["Incorrecto","Correcto","Correcto","Puntaje: 2 de 3","Bien"]}],"pistas":["Dos funciones con \u003ccode\u003ereturn\u003c/code\u003e; el programa principal suma lo que devuelve \u003ccode\u003epreguntar\u003c/code\u003e.","\u003ccode\u003epuntaje = 0\u003c/code\u003e, luego \u003ccode\u003epuntaje = puntaje + preguntar(\"¿Cuántas patas…? \", \"8\")\u003c/code\u003e para cada pregunta, y al final dos print.","Dentro de preguntar: \u003ccode\u003er = input(pregunta).lower()\u003c/code\u003e; si \u003ccode\u003er == correcta\u003c/code\u003e muestra «Correcto» y \u003ccode\u003ereturn 1\u003c/code\u003e; si no, «Incorrecto» y \u003ccode\u003ereturn 0\u003c/code\u003e."],"niveles":{"explorador":{"descripcion":"Las funciones ya están casi listas. Completa las partes marcadas con ___.","inicio":"def preguntar(pregunta, correcta):\n    r = input(pregunta).lower()\n    if r == correcta:\n        print(\"Correcto\")\n        return ___\n    print(\"Incorrecto\")\n    return ___\n\ndef mensaje_final(puntaje):\n    if puntaje == 3:\n        return \"¡Excelente!\"\n    elif puntaje == 2:\n        return \"Bien\"\n    return \"Sigue practicando\"\n\npuntaje = 0\npuntaje = puntaje + preguntar(\"¿Cuántas patas tiene una araña? \", \"8\")\npuntaje = puntaje + preguntar(\"¿De qué color es el cielo despejado? \", \"azul\")\npuntaje = puntaje + preguntar(\"¿Cuánto es 9 x 7? \", ___)\nprint(\"Puntaje:\", puntaje, \"de 3\")\nprint(mensaje_final(___))","solucion":"def preguntar(pregunta, correcta):\n    r = input(pregunta).lower()\n    if r == correcta:\n        print(\"Correcto\")\n        return 1\n    print(\"Incorrecto\")\n    return 0\n\ndef mensaje_final(puntaje):\n    if puntaje == 3:\n        return \"¡Excelente!\"\n    elif puntaje == 2:\n        return \"Bien\"\n    return \"Sigue practicando\"\n\npuntaje = 0\npuntaje = puntaje + preguntar(\"¿Cuántas patas tiene una araña? \", \"8\")\npuntaje = puntaje + preguntar(\"¿De qué color es el cielo despejado? \", \"azul\")\npuntaje = puntaje + preguntar(\"¿Cuánto es 9 x 7? \", \"63\")\nprint(\"Puntaje:\", puntaje, \"de 3\")\nprint(mensaje_final(puntaje))"},"programador":{"inicio":"","solucion":"def preguntar(pregunta, correcta):\n    r = input(pregunta).lower()\n    if r == correcta:\n        print(\"Correcto\")\n        return 1\n    print(\"Incorrecto\")\n    return 0\n\n\ndef mensaje_final(puntaje):\n    if puntaje == 3:\n        return \"¡Excelente!\"\n    elif puntaje == 2:\n        return \"Bien\"\n    return \"Sigue practicando\"\n\n\npuntaje = 0\npuntaje += preguntar(\"¿Cuántas patas tiene una araña? \", \"8\")\npuntaje += preguntar(\"¿De qué color es el cielo despejado? \", \"azul\")\npuntaje += preguntar(\"¿Cuánto es 9 x 7? \", \"63\")\nprint(\"Puntaje:\", puntaje, \"de 3\")\nprint(mensaje_final(puntaje))"},"maestro":{"enunciado":"guarda las preguntas en una lista y las respuestas en otra, y recórrelas con un \u003ccode\u003efor\u003c/code\u003e para no repetir la llamada a \u003ccode\u003epreguntar\u003c/code\u003e. El total (3) también debe salir de \u003ccode\u003elen()\u003c/code\u003e.","inicio":"","requiere":["lista*2","for","len"],"solucion":"def preguntar(pregunta, correcta):\n    r = input(pregunta).lower()\n    if r == correcta:\n        print(\"Correcto\")\n        return 1\n    print(\"Incorrecto\")\n    return 0\n\ndef mensaje_final(puntaje):\n    if puntaje == 3:\n        return \"¡Excelente!\"\n    elif puntaje == 2:\n        return \"Bien\"\n    return \"Sigue practicando\"\n\npreguntas = [\"¿Cuántas patas tiene una araña? \", \"¿De qué color es el cielo despejado? \", \"¿Cuánto es 9 x 7? \"]\nrespuestas = [\"8\", \"azul\", \"63\"]\npuntaje = 0\nfor i in range(len(preguntas)):\n    puntaje += preguntar(preguntas[i], respuestas[i])\nprint(\"Puntaje:\", puntaje, \"de\", len(preguntas))\nprint(mensaje_final(puntaje))"}}},"extra":{"id":"s14-extra","titulo":"Calculadora con funciones","historia":"Una calculadora donde cada operación es una función.","enunciado":"Escribe las funciones \u003ccode\u003esumar(a, b)\u003c/code\u003e, \u003ccode\u003erestar(a, b)\u003c/code\u003e, \u003ccode\u003emultiplicar(a, b)\u003c/code\u003e y \u003ccode\u003edividir(a, b)\u003c/code\u003e, cada una con \u003ccode\u003ereturn\u003c/code\u003e. Pide dos números y una operación (\u003ccode\u003e+ - * /\u003c/code\u003e) y muestra \u003ccode\u003eResultado: 12\u003c/code\u003e. Si dividen entre cero, muestra \u003ccode\u003eNo se puede dividir entre cero\u003c/code\u003e.","inicio":"","requiere":["def*4","return*4","elif"],"pruebas":[{"nombre":"8 + 4","entradas":["8","4","+"],"contiene":["Resultado: 12"]},{"nombre":"8 * 4","entradas":["8","4","*"],"contiene":["Resultado: 32"]},{"nombre":"9 / 3","entradas":["9","3","/"],"contiene":["Resultado: 3.0"]},{"nombre":"5 / 0","entradas":["5","0","/"],"contiene":["No se puede dividir entre cero"]}],"solucion":"def sumar(a, b):\n    return a + b\n\ndef restar(a, b):\n    return a - b\n\ndef multiplicar(a, b):\n    return a * b\n\ndef dividir(a, b):\n    return a / b\n\nx = int(input(\"Primer número: \"))\ny = int(input(\"Segundo número: \"))\nop = input(\"Operación (+ - * /): \")\nif op == \"+\":\n    print(\"Resultado:\", sumar(x, y))\nelif op == \"-\":\n    print(\"Resultado:\", restar(x, y))\nelif op == \"*\":\n    print(\"Resultado:\", multiplicar(x, y))\nelif op == \"/\":\n    if y == 0:\n        print(\"No se puede dividir entre cero\")\n    else:\n        print(\"Resultado:\", dividir(x, y))\nelse:\n    print(\"Operación desconocida\")"},"puente":[{"pregunta":"¿Qué línea de Python corresponde al bloque \u003ccode\u003ereturn\u003c/code\u003e?","bloques":"def area(b, h):\n    return b * h","altoBloques":130,"codigoOpciones":true,"opciones":["return b * h","print(b * h)","return(b, h)","area = b * h"],"correcta":0,"explicacion":"return entrega el resultado de la cuenta."},{"pregunta":"¿Qué valor guarda \u003ccode\u003ex\u003c/code\u003e si la función no tiene \u003ccode\u003ereturn\u003c/code\u003e?","codigo":"def hola():\n    print(\"Hola\")\n\nx = hola()","opciones":["None","\"Hola\"","0","Error"],"correcta":0,"explicacion":"Sin return, la función devuelve None (nada)."}],"autoevaluacion":[{"pregunta":"¿Qué diferencia hay entre \u003ccode\u003eprint\u003c/code\u003e y \u003ccode\u003ereturn\u003c/code\u003e dentro de una función?","respuesta":"print muestra el valor en la pantalla; return lo entrega a quien llamó la función para que lo use (guardarlo, sumarlo, compararlo)."},{"pregunta":"¿Qué pasa con las líneas que están después de un \u003ccode\u003ereturn\u003c/code\u003e que se ejecuta?","respuesta":"No se ejecutan: return termina la función en ese momento."},{"pregunta":"¿Por qué la versión con funciones del quiz es mejor?","respuesta":"No repite código; si quieres cambiar cómo se revisa una respuesta, lo cambias en un solo lugar; y el programa principal se lee como una lista de pasos."}],"ticket":{"pregunta":"¿Qué número se muestra?","codigo":"def f(n):\n    return n + 1\n\nprint(f(f(2)))","opciones":["4","3","2","5"],"correcta":0,"explicacion":"f(2) devuelve 3, y f(3) devuelve 4."},"plan":{"activacion":"«¿Qué imprime?»: una función con print y otra con return usadas en una suma. Discute por qué una da None.","ejemplo":"Escribe «Áreas de rectángulos» y ejecútalo paso a paso. Muestra la animación de la máquina (función).","practica":"Micro-retos (doble, es par, mayor de dos) en parejas.","reto":"Rehacer el quiz con funciones. Compara en voz alta cuántas líneas tenía el quiz de la Sesión 7 y cuántas tiene ahora.","cierre":"Ticket de salida. Insignia «Arquitecto de funciones» para quien superó los retos de las sesiones 13 y 14. Anuncia el proyecto final."}},{"numero":15,"unidad":7,"titulo":"Proyecto final: diseño y programación","python":["integra todo el curso"],"modo":4,"historiaIcono":"🚀","historia":"Llegó el momento: vas a diseñar y programar tu propio proyecto en Python, de principio a fin. En la Sesión 0 jugaste uno; ahora tú serás quien lo cree.","objetivos":["Diseñar un programa propio: elegir la idea, planear sus partes y escribirlo en Python.","Integrar \u003ccode\u003einput()\u003c/code\u003e, decisiones con \u003ccode\u003eelif\u003c/code\u003e, bucles, listas y funciones.","Probar el programa con distintos datos y corregir errores.","Preparar la presentación del proyecto."],"teoria":[{"tipo":"titulo","texto":"Modo 4: Libre"},{"tipo":"texto","html":"Ahora escribes Python \u003cb\u003esin apoyo\u003c/b\u003e. Si quieres, el panel «🧩 Bloques» tiene un \u003cb\u003eborrador\u003c/b\u003e para pensar con bloques y pasar el código al editor."},{"tipo":"titulo","texto":"Requisitos mínimos (5)"},{"tipo":"texto","html":"\u003col\u003e\u003cli\u003ePedir datos con \u003ccode\u003einput()\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eUna decisión con \u003ccode\u003eelif\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eUn bucle (\u003ccode\u003efor\u003c/code\u003e o \u003ccode\u003ewhile\u003c/code\u003e).\u003c/li\u003e\u003cli\u003eUna lista.\u003c/li\u003e\u003cli\u003eDos funciones propias (\u003ccode\u003edef\u003c/code\u003e).\u003c/li\u003e\u003c/ol\u003eLa lista de cotejo del taller se marca sola mientras programas. Además, el proyecto debe ejecutarse completo sin errores."},{"tipo":"titulo","texto":"Cómo planear tu proyecto"},{"tipo":"texto","html":"\u003col\u003e\u003cli\u003e\u003cb\u003eIdea\u003c/b\u003e: elige una opción y escribe en una frase qué hará tu programa.\u003c/li\u003e\u003cli\u003e\u003cb\u003eDescomposición\u003c/b\u003e: divide el programa en partes. Cada parte puede ser una función.\u003c/li\u003e\u003cli\u003e\u003cb\u003ePseudocódigo\u003c/b\u003e: escribe en tu cuaderno los pasos en español.\u003c/li\u003e\u003cli\u003e\u003cb\u003ePrograma poco a poco\u003c/b\u003e: escribe una parte, ejecútala, corrígela y sigue. ¡No escribas todo de golpe!\u003c/li\u003e\u003cli\u003e\u003cb\u003ePrueba\u003c/b\u003e: juega tu programa con respuestas raras para ver si falla.\u003c/li\u003e\u003c/ol\u003e"},{"tipo":"analogia","icono":"🏗️","titulo":"Como construir con LEGO","html":"No se arma un castillo de un jalón: primero una torre, luego la muralla, luego la puerta. Cada función es una pieza que pruebas por separado antes de juntarla con las demás."},{"tipo":"titulo","texto":"¿Cómo se evalúa?"},{"tipo":"texto","html":"El proyecto vale 30 % y se evalúa con una rúbrica de cuatro criterios: \u003cb\u003eFuncionamiento\u003c/b\u003e, \u003cb\u003eUso de conceptos\u003c/b\u003e, \u003cb\u003eLegibilidad\u003c/b\u003e (nombres claros, comentarios, funciones bien nombradas) y \u003cb\u003eExplicación\u003c/b\u003e (en la presentación de la Sesión 16)."}],"fichas":[{"titulo":"Esqueleto de un proyecto","codigo":"import random\n\n# Datos\nopciones = [\"a\", \"b\"]\n\n# Funciones\ndef mostrar_menu():\n    print(\"1. Jugar\")\n    print(\"2. Salir\")\n\n# Programa principal\nseguir = True\nwhile seguir:\n    mostrar_menu()\n    op = input(\"Opción: \")\n    if op == \"1\":\n        print(\"¡A jugar!\")\n    elif op == \"2\":\n        seguir = False\n    else:\n        print(\"Opción no válida\")"},{"titulo":"Validar una opción","codigo":"r = input(\"¿si o no? \").lower()\nwhile r not in [\"si\", \"no\"]:\n    r = input(\"Escribe si o no: \").lower()"}],"glosario":[{"en":"pseudocode","es":"pseudocódigo","def":"Los pasos de un programa escritos en español, antes de programarlos."},{"en":"debug","es":"depurar","def":"Encontrar y corregir errores."},{"en":"test","es":"probar","def":"Ejecutar el programa con distintos datos para ver si funciona."},{"en":"menu","es":"menú","def":"Lista de opciones para que el usuario elija."}],"reto":{"id":"s15-proyecto","tipo":"proyecto","nombrePaso":"Proyecto final","titulo":"Proyecto final","historia":"Tu proyecto se presentará frente al grupo en la Sesión 16.","enunciado":"Elige una de las cuatro opciones (o propón otra a tu docente). Cada opción trae un esqueleto con comentarios para que no empieces en blanco. Puedes cambiarlo todo.","requiere":["input","elif","for|while","lista","def*2"],"rubrica":{"niveles":["Inicial (1)","En desarrollo (2)","Logrado (3)","Destacado (4)"],"criterios":[{"nombre":"Funcionamiento","descriptores":["No se ejecuta","Se ejecuta, con errores frecuentes","Funciona en los casos normales","Funciona y maneja entradas inesperadas"]},{"nombre":"Uso de conceptos","descriptores":["Cumple 1 o 2 requisitos","Cumple 3 o 4","Cumple los 5","Cumple los 5 y combina conceptos de forma original"]},{"nombre":"Legibilidad","descriptores":["Nombres sin significado, sin comentarios","Algunos nombres claros","Nombres claros y comentarios útiles","Organizado en funciones bien nombradas"]},{"nombre":"Explicación","descriptores":["No logra explicar su código","Explica partes con ayuda","Explica cómo funciona su programa","Explica sus decisiones y cómo lo mejoraría"]}]},"opciones":[{"id":"ppt","icono":"✊","titulo":"Piedra, papel o tijera","resumen":"Contra la computadora, con marcador, al mejor de 5.","descripcion":"Juego contra la computadora \u003cb\u003eal mejor de 5\u003c/b\u003e: gana quien llegue primero a 3 victorias. Lleva el marcador, valida que la jugada exista y anuncia al ganador. Ideas extra: agregar «lagarto» y «Spock», mostrar estadísticas al final.","inicio":"import random\n\nopciones = [\"piedra\", \"papel\", \"tijera\"]\n\n# Función que pide la jugada y la valida\ndef pedir_jugada():\n    jugada = input(\"Piedra, papel o tijera: \").lower()\n    # Mientras la jugada no esté en la lista, vuelve a pedirla\n    return jugada\n\n# Función que devuelve \"tu\", \"compu\" o \"empate\"\ndef ganador_ronda(tu, compu):\n    pass\n\n# Programa principal: repite mientras nadie tenga 3 victorias\npuntos_tu = 0\npuntos_compu = 0\n","solucion":"import random\n\nopciones = [\"piedra\", \"papel\", \"tijera\"]\n\ndef pedir_jugada():\n    jugada = input(\"Piedra, papel o tijera: \").lower()\n    while jugada not in opciones:\n        jugada = input(\"No válida. Piedra, papel o tijera: \").lower()\n    return jugada\n\ndef ganador_ronda(tu, compu):\n    if tu == compu:\n        return \"empate\"\n    elif (tu == \"piedra\" and compu == \"tijera\") or (tu == \"papel\" and compu == \"piedra\") or (tu == \"tijera\" and compu == \"papel\"):\n        return \"tu\"\n    else:\n        return \"compu\"\n\npuntos_tu = 0\npuntos_compu = 0\nwhile puntos_tu \u003c 3 and puntos_compu \u003c 3:\n    tu = pedir_jugada()\n    compu = random.choice(opciones)\n    print(\"La computadora eligió\", compu)\n    resultado = ganador_ronda(tu, compu)\n    if resultado == \"tu\":\n        puntos_tu += 1\n        print(\"¡Ganas la ronda!\")\n    elif resultado == \"compu\":\n        puntos_compu += 1\n        print(\"La computadora gana la ronda\")\n    else:\n        print(\"Empate\")\n    print(\"Marcador:\", puntos_tu, \"-\", puntos_compu)\nif puntos_tu == 3:\n    print(\"¡Ganaste el juego!\")\nelse:\n    print(\"Ganó la computadora\")","entradasPrueba":["piedra","lagarto","papel","tijera","piedra"],"azarPrueba":["tijera","piedra","papel","tijera"]},{"id":"aventura","icono":"🗺️","titulo":"Aventura de texto","resumen":"Una historia con decisiones y varios finales.","descripcion":"Una historia en la que quien juega decide qué hacer y llega a distintos finales. Usa una lista para el inventario (objetos que encuentra) y funciones para cada escena. Ideas extra: puntos de vida, objetos que abren caminos nuevos.","inicio":"inventario = []\n\n# Cada escena puede ser una función\ndef escena_bosque():\n    print(\"Estás en un bosque oscuro. Hay un camino a la izquierda y otro a la derecha.\")\n    eleccion = input(\"¿izquierda o derecha? \").lower()\n    # Usa if / elif / else para decidir qué pasa\n\ndef escena_cueva():\n    pass\n\n# Programa principal\nprint(\"=== La aventura comienza ===\")\nescena_bosque()\n","solucion":"inventario = []\n\ndef pedir(opciones):\n    eleccion = input(\"Elige (\" + \" / \".join(opciones) + \"): \").lower()\n    while eleccion not in opciones:\n        eleccion = input(\"Esa opción no existe. Elige otra vez: \").lower()\n    return eleccion\n\ndef escena_cueva():\n    print(\"Entras a una cueva. Brilla algo en el fondo.\")\n    eleccion = pedir([\"tomar\", \"salir\"])\n    if eleccion == \"tomar\":\n        inventario.append(\"llave dorada\")\n        print(\"¡Encontraste una llave dorada!\")\n    else:\n        print(\"Sales de la cueva con cuidado.\")\n\ndef escena_puerta():\n    print(\"Llegas a una puerta enorme.\")\n    if \"llave dorada\" in inventario:\n        print(\"Usas la llave dorada. ¡Encontraste el tesoro! FINAL FELIZ\")\n    else:\n        print(\"La puerta está cerrada. Regresas a casa. FINAL ABIERTO\")\n\nprint(\"=== La aventura comienza ===\")\nprint(\"Estás en un bosque. Hay un camino a la izquierda y otro a la derecha.\")\ncamino = pedir([\"izquierda\", \"derecha\", \"quedarme\"])\nif camino == \"izquierda\":\n    escena_cueva()\n    escena_puerta()\nelif camino == \"derecha\":\n    escena_puerta()\nelse:\n    print(\"Te quedas a dormir bajo un árbol. FINAL TRANQUILO\")\nprint(\"Inventario final:\", inventario)","entradasPrueba":["izquierda","tomar"]},{"id":"quiz","icono":"❓","titulo":"Quiz temático","resumen":"Banco de preguntas en listas.","descripcion":"Un quiz sobre el tema que elijas, con las preguntas y respuestas guardadas en \u003cb\u003elistas\u003c/b\u003e y recorridas con un bucle. Ideas extra: preguntas en orden aleatorio, varias oportunidades por pregunta, récord de puntaje.","inicio":"preguntas = [\"¿Pregunta 1? \", \"¿Pregunta 2? \", \"¿Pregunta 3? \"]\nrespuestas = [\"r1\", \"r2\", \"r3\"]\n\n# Función que hace una pregunta y devuelve 1 si acierta o 0 si no\ndef preguntar(pregunta, correcta):\n    pass\n\n# Función que devuelve un mensaje según el puntaje\ndef mensaje_final(puntaje, total):\n    pass\n\n# Programa principal: recorre las preguntas con un for\npuntaje = 0\n","solucion":"preguntas = [\"¿Cuál es el planeta más grande? \", \"¿Cuántos continentes hay? \", \"¿Qué animal es el más grande del mundo? \", \"¿Cuál es el océano más grande? \"]\nrespuestas = [\"jupiter\", \"5\", \"ballena azul\", \"pacifico\"]\n\ndef preguntar(pregunta, correcta):\n    r = input(pregunta).lower()\n    if r == correcta:\n        print(\"¡Correcto!\")\n        return 1\n    print(\"Incorrecto. La respuesta era\", correcta)\n    return 0\n\ndef mensaje_final(puntaje, total):\n    if puntaje == total:\n        return \"¡Perfecto!\"\n    elif puntaje \u003e= total / 2:\n        return \"¡Bien hecho!\"\n    else:\n        return \"¡A estudiar un poco más!\"\n\npuntaje = 0\nfor i in range(len(preguntas)):\n    puntaje += preguntar(preguntas[i], respuestas[i])\nprint(\"Puntaje:\", puntaje, \"de\", len(preguntas))\nprint(mensaje_final(puntaje, len(preguntas)))","entradasPrueba":["jupiter","7","ballena azul","pacifico"]},{"id":"mascota","icono":"🐶","titulo":"Mascota virtual","resumen":"Una mascota que come, juega y duerme.","descripcion":"Una mascota con niveles de hambre, energía y felicidad. Un menú permite darle de comer, jugar o dormir, y cada acción cambia sus niveles. Ideas extra: la mascota se enferma si el hambre llega a 10, una lista de juguetes favoritos.","inicio":"nombre = input(\"¿Cómo se llama tu mascota? \")\nhambre = 5\nenergia = 5\nfelicidad = 5\njuguetes = [\"pelota\", \"cuerda\", \"hueso\"]\n\n# Función que muestra cómo está la mascota\ndef mostrar_estado():\n    pass\n\n# Funciones para cada acción: comer, jugar, dormir\n\n# Programa principal: un menú que se repite hasta que elijan salir\n","solucion":"import random\n\nnombre = input(\"¿Cómo se llama tu mascota? \")\nhambre = 5\nenergia = 5\nfelicidad = 5\njuguetes = [\"pelota\", \"cuerda\", \"hueso\"]\n\ndef mostrar_estado():\n    print(nombre, \"→ hambre:\", hambre, \"energía:\", energia, \"felicidad:\", felicidad)\n\ndef limitar(valor):\n    if valor \u003c 0:\n        return 0\n    elif valor \u003e 10:\n        return 10\n    return valor\n\nseguir = True\nwhile seguir:\n    mostrar_estado()\n    opcion = input(\"¿Qué hacemos? (comer / jugar / dormir / salir) \").lower()\n    if opcion == \"comer\":\n        hambre = limitar(hambre - 3)\n        print(nombre, \"comió muy rico.\")\n    elif opcion == \"jugar\":\n        juguete = random.choice(juguetes)\n        felicidad = limitar(felicidad + 2)\n        energia = limitar(energia - 2)\n        hambre = limitar(hambre + 1)\n        print(nombre, \"jugó con la\", juguete)\n    elif opcion == \"dormir\":\n        energia = 10\n        print(nombre, \"durmió una siesta.\")\n    elif opcion == \"salir\":\n        seguir = False\n    else:\n        print(\"No entendí esa opción.\")\nprint(\"¡Adiós,\", nombre + \"!\")","entradasPrueba":["Firulais","comer","jugar","volar","dormir","salir"],"azarPrueba":["pelota"]}]},"ticket":{"pregunta":"¿Cuál de estos \u003cb\u003eno\u003c/b\u003e es uno de los 5 requisitos mínimos del proyecto?","opciones":["Usar random","Usar input()","Usar una lista","Tener dos funciones propias"],"correcta":0,"explicacion":"random es opcional. Los requisitos son input(), una decisión con elif, un bucle, una lista y dos funciones."},"plan":{"activacion":"Recuerda la Sesión 0: juega otra vez «Piedra, papel o tijera» y pregunta qué conceptos del curso reconocen ahora en el código.","ejemplo":"Muestra cómo planear: idea en una frase, descomposición en funciones y pseudocódigo, usando una de las opciones como ejemplo.","practica":"Cada alumno elige opción y escribe en su cuaderno la idea, las partes y el pseudocódigo. Validación rápida del docente.","reto":"Programación del proyecto en modo 4 (el borrador en bloques está disponible). La lista de cotejo se marca sola.","cierre":"Cada alumno descarga su .py y anota qué le falta. Ticket de salida.","minutos":{"ejemplo":5,"practica":10,"reto":35,"cierre":5},"notas":"Si el proyecto requiere más tiempo, puede continuarse en casa o en una sesión adicional. La rúbrica está en el Panel docente."}},{"numero":16,"unidad":7,"titulo":"Presentación de proyectos","subtitulo":"Demostración, coevaluación y prueba final","python":[],"modo":4,"historiaIcono":"🎉","historia":"¡Es día de presentaciones! Cada quien mostrará su proyecto al grupo, evaluará el de alguien más y hará la prueba final para ver cuánto avanzó desde la Sesión 0.","objetivos":["Presentar tu proyecto y explicar cómo funciona tu código.","Evaluar con la rúbrica el proyecto de un compañero o compañera, con respeto y con sugerencias útiles.","Responder la prueba final y comparar con tu prueba diagnóstica."],"teoria":[{"tipo":"titulo","texto":"Cómo presentar tu proyecto (3 minutos)"},{"tipo":"texto","html":"\u003col\u003e\u003cli\u003e\u003cb\u003e¿Qué hace?\u003c/b\u003e Explica en una frase la idea de tu programa.\u003c/li\u003e\u003cli\u003e\u003cb\u003eDemostración\u003c/b\u003e: ejecútalo y juega una partida frente al grupo.\u003c/li\u003e\u003cli\u003e\u003cb\u003eUna parte del código\u003c/b\u003e: elige una función y explica qué hace, línea por línea. Puedes abrir el panel 🧩 Bloques para mostrar cómo se ve en bloques.\u003c/li\u003e\u003cli\u003e\u003cb\u003e¿Qué aprendiste y qué mejorarías?\u003c/b\u003e Menciona algo que te costó trabajo y una idea para la siguiente versión.\u003c/li\u003e\u003c/ol\u003e"},{"tipo":"analogia","icono":"🎤","titulo":"Como una feria de ciencias","html":"En una feria no basta con traer el experimento: hay que explicar qué hiciste y por qué. Tu código es tu experimento."},{"tipo":"titulo","texto":"Cómo coevaluar"},{"tipo":"texto","html":"Usa la rúbrica para evaluar con justicia: elige el nivel que mejor describe lo que viste, no el que te cae mejor. Escribe algo que te haya gustado y una sugerencia concreta (por ejemplo: «agregar <script>
/* =========================================================================
 * 00-base.js — Espacio de nombres, utilidades DOM, almacenamiento seguro,
 * ventanas modales, avisos, descarga y copia con alternativas.
 * Todo lo de la plataforma vive dentro del objeto global PB.
 * ========================================================================= */
'use strict';

const PB = window.PB = window.PB || {};

PB.util = (() => {
  /** Crea un elemento: el('div', {class: 'x', onclick: fn}, hijo1, 'texto', ...) */
  function el(tag, attrs, ...hijos) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(e.dataset, v);
        else if (v === true) e.setAttribute(k, '');
        else e.setAttribute(k, v);
      }
    }
    agregar(e, hijos);
    return e;
  }

  function agregar(padre, hijos) {
    for (const h of hijos.flat(Infinity)) {
      if (h === null || h === undefined || h === false) continue;
      padre.appendChild(h instanceof Node ? h : document.createTextNode(String(h)));
    }
    return padre;
  }

  function vaciar(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /** Quita acentos, pasa a minúsculas y compacta espacios: para comparar salidas. */
  function normalizar(s) {
    return String(s ?? '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[¡¿]/g, '')
      .toLowerCase()
      .replace(/[ \t]+/g, ' ')
      .split('\n').map(l => l.trim()).join('\n')
      .replace(/\n{2,}/g, '\n')
      .trim();
  }

  function debounce(fn, ms) {
    let t = null;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function fechaCorta(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) { return iso.slice(0, 10); }
  }

  function hoyISO() { return new Date().toISOString(); }

  function clonar(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  /** Distancia de edición, para sugerir nombres parecidos en NameError. */
  function distancia(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  function slug(s) {
    return normalizar(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'alumno';
  }

  return { el, agregar, vaciar, esc, normalizar, debounce, fechaCorta, hoyISO, clonar, distancia, slug };
})();

/* ---------- Almacenamiento: localStorage con respaldo en memoria ----------
 * Dentro del iframe de Google Sites, Safari puede bloquear o borrar el
 * almacenamiento. Nunca dejamos que eso rompa la plataforma.            */
PB.almacen = (() => {
  const memoria = {};
  let disponible = false;
  try {
    const k = '__pb_prueba__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    disponible = true;
  } catch (e) { disponible = false; }

  function leer(clave, porDefecto) {
    try {
      const v = disponible ? window.localStorage.getItem(clave) : memoria[clave];
      if (v === null || v === undefined) return porDefecto;
      return JSON.parse(v);
    } catch (e) { return porDefecto; }
  }

  function escribir(clave, valor) {
    const txt = JSON.stringify(valor);
    memoria[clave] = txt;
    if (!disponible) return false;
    try { window.localStorage.setItem(clave, txt); return true; } catch (e) { return false; }
  }

/* ---------- Ventanas modales, avisos y diálogos propios ----------
 * window.prompt/alert pueden estar bloqueados en el iframe de Google Sites,
 * por eso usamos diálogos dentro de la página.                         */
PB.ui = (() => {
  const { el } = PB.util;
  let pila = [];

  function modal({ titulo, contenido, botones = [{ texto: 'Cerrar', tipo: 'primario' }], ancho, alCerrar, clase }) {
    return new Promise(resolve => {
      const fondo = el('div', { class: 'modal-fondo' });
      const caja = el('div', { class: 'modal' + (clase ? ' ' + clase : ''), role: 'dialog', 'aria-modal': 'true' });
      if (ancho) caja.style.maxWidth = ancho;
      const cerrar = (valor) => {
        fondo.remove();
        pila = pila.filter(p => p !== fondo);
        document.removeEventListener('keydown', teclas);
        if (alCerrar) alCerrar(valor);
        resolve(valor);
      };
      const teclas = (ev) => {
        if (pila[pila.length - 1] !== fondo) return;
        if (ev.key === 'Escape') cerrar(null);
      };
      if (titulo) caja.appendChild(el('h2', { class: 'modal-titulo' }, titulo));
      const cuerpo = el('div', { class: 'modal-cuerpo' });
      if (typeof contenido === 'function') contenido(cuerpo, cerrar);
      else if (contenido instanceof Node) cuerpo.appendChild(contenido);
      else if (contenido) cuerpo.innerHTML = contenido;
      caja.appendChild(cuerpo);
      if (botones && botones.length) {
        const pie = el('div', { class: 'modal-pie' });
        for (const b of botones) {
          pie.appendChild(el('button', {
            class: 'btn ' + (b.tipo === 'primario' ? 'btn-primario' : b.tipo === 'peligro' ? 'btn-peligro' : 'btn-secundario'),
            onclick: () => {
              if (b.accion) {
                const r = b.accion(cuerpo);
                if (r === false) return;
                cerrar(r === undefined ? (b.valor ?? b.texto) : r);
              } else cerrar(b.valor ?? b.texto);
            }
          }, b.texto));
        }
        caja.appendChild(pie);
      }
      fondo.appendChild(caja);
      fondo.addEventListener('mousedown', ev => { if (ev.target === fondo) cerrar(null); });
      document.body.appendChild(fondo);
      pila.push(fondo);
      document.addEventListener('keydown', teclas);
      const foco = caja.querySelector('input, textarea, select') || caja.querySelector('.modal-pie .btn-primario');
      if (foco) setTimeout(() => foco.focus(), 30);
    });
  }

  function alerta(mensaje, titulo) {
    return modal({ titulo: titulo || 'Aviso', contenido: el('p', {}, mensaje), botones: [{ texto: 'Entendido', tipo: 'primario' }] });
  }

  function confirmar(mensaje, titulo, textoSi = 'Sí', textoNo = 'Cancelar', peligro = false) {
    return modal({
      titulo: titulo || 'Confirmar',
      contenido: el('p', {}, mensaje),
      botones: [{ texto: textoNo, valor: false }, { texto: textoSi, valor: true, tipo: peligro ? 'peligro' : 'primario' }]
    }).then(v => v === true);
  }

  /** Pide un texto. validar(texto) devuelve un mensaje de error o null. */
  function pedirTexto(mensaje, porDefecto = '', { titulo, validar, placeholder } = {}) {
    let entrada, error;
    return modal({
      titulo: titulo || 'Escribe',
      contenido: (c) => {
        c.appendChild(el('label', { class: 'campo-etiqueta' }, mensaje));
        entrada = el('input', {
          type: 'text', class: 'campo', value: porDefecto, placeholder: placeholder || '',
          autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', autocomplete: 'off'
        });
        error = el('p', { class: 'campo-error' });
        entrada.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') { ev.preventDefault(); c.parentNode.querySelector('.modal-pie .btn-primario').click(); }
        });
        c.appendChild(entrada);
        c.appendChild(error);
      },
      botones: [
        { texto: 'Cancelar', valor: null },
        {
          texto: 'Aceptar', tipo: 'primario', accion: () => {
            const v = PB.util.quitarComillasTipograficas(entrada.value.trim());
            const msg = validar ? validar(v) : null;
            if (msg) { error.textContent = msg; entrada.focus(); return false; }
            return v;
          }
        }
      ]
    });
  }

  let contAvisos = null;
  function aviso(mensaje, tipo = 'info', ms = 3200) {
    if (!contAvisos) {
      contAvisos = el('div', { class: 'avisos', 'aria-live': 'polite' });
      document.body.appendChild(contAvisos);
    }
    const t = el('div', { class: 'aviso aviso-' + tipo }, mensaje);
    contAvisos.appendChild(t);
    setTimeout(() => t.classList.add('saliendo'), ms);
    setTimeout(() => t.remove(), ms + 400);
  }

  return { modal, alerta, confirmar, pedirTexto, aviso };
})();

/* ---------- Descargar y copiar, con alternativas ----------
 * El iframe de Google Sites puede bloquear descargas o el portapapeles;
 * en ese caso mostramos el texto para copiarlo a mano. */
PB.archivos = (() => {
  const { el } = PB.util;

  function mostrarParaCopiar(texto, titulo, nota) {
    return PB.ui.modal({
      titulo: titulo || 'Copia este texto',
      ancho: '720px',
      contenido: (c) => {
        if (nota) c.appendChild(el('p', { class: 'nota' }, nota));
        const ta = el('textarea', { class: 'campo campo-codigo', rows: '14', readonly: true, spellcheck: 'false' });
        ta.value = texto;
        c.appendChild(ta);
        setTimeout(() => { ta.focus(); ta.select(); }, 60);
      },
      botones: [{ texto: 'Cerrar', tipo: 'primario' }]
    });
  }

  function descargar(nombre, contenido, tipo = 'text/plain') {
    try {
      const blob = new Blob([contenido], { type: tipo + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: nombre, style: { display: 'none' } });
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
      PB.ui.aviso('Descarga iniciada: ' + nombre, 'exito');
      // Si el navegador bloqueó la descarga no hay forma de saberlo con certeza:
      // ofrecemos siempre la opción de ver el texto.
      return true;
    } catch (e) {
      mostrarParaCopiar(contenido, nombre, 'Tu navegador no permitió descargar el archivo. Copia el texto y guárdalo con el nombre «' + nombre + '».');
      return false;
    }
  }

  async function copiar(texto, titulo) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
        PB.ui.aviso('Copiado al portapapeles', 'exito');
        return true;
      }
    } catch (e) { /* probamos el método antiguo */ }
    try {
      const ta = el('textarea', { style: { position: 'fixed', left: '-9999px', top: '0' } });
      ta.value = texto;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (ok) { PB.ui.aviso('Copiado al portapapeles', 'exito'); return true; }
    } catch (e) { /* mostramos el texto */ }
    mostrarParaCopiar(texto, titulo || 'Copia este texto', 'No se pudo copiar automáticamente. Selecciona el texto y cópialo.');
    return false;
  }

  function leerArchivo(aceptar = '.json,application/json,text/plain', multiple = false) {
    return new Promise(resolve => {
      const inp = el('input', { type: 'file', accept: aceptar, style: { display: 'none' } });
      if (multiple) inp.multiple = true;
      inp.addEventListener('change', async () => {
        const archivos = Array.from(inp.files || []);
        const textos = [];
        for (const f of archivos) {
          textos.push({ nombre: f.name, texto: await f.text() });
        }
        inp.remove();
        resolve(multiple ? textos : (textos[0] || null));
      });
      document.body.appendChild(inp);
      inp.click();
    });
  }

  return { descargar, copiar, mostrarParaCopiar, leerArchivo };
})();

'use strict';

PB.py = (() => {
  const PALABRAS_CLAVE = new Set(['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class',

    'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']);

    'sum', 'abs', 'round', 'sorted', 'list', 'type', 'enumerate', 'zip', 'reversed', 'chr', 'ord', 'any', 'all', 'pow',
    'divmod', 'isinstance', 'dict', 'set', 'tuple', 'help', 'map', 'filter', 'open']);

  const OPERADORES = ['**=', '//=', '>>=', '<<=', '!=', '%=', '&=', '**', '*=', '+=', '-=', '->', '//', '/=', ':=',
    '<<', '<=', '==', '>=', '>>', '@=', '^=', '|=', '%', '&', '(', ')', '*', '+', ',', '-', '.', '/', ':', ';', '<',
    '=', '>', '@', '[', ']', '^', '{', '|', '}', '~'];

        while (!es('DEDENT') && !es('EOF')) {
          if (es('NEWLINE')) { avanzar(); continue; }
          if (es('INDENT')) throw errorEn(ver(), 'Sangría inesperada: esta línea tiene más espacios que la anterior sin que haya dos puntos antes.', 'IndentationError');
          sentencia(cuerpo);
        }
        if (es('DEDENT')) avanzar();
        validarSecuencia(cuerpo);
        return cuerpo;
      }
      // Cuerpo en la misma línea: if x: print(x)
      const cuerpo = [];
      sentenciasSimples(cuerpo);
      return cuerpo;
    }

    function validarSecuencia(cuerpo) {
      let previo = null;
      for (const s of cuerpo) {
        if (s.t === 'Comment') continue;
        if (s.t === 'Elif' && !(previo && (previo.t === 'If' || previo.t === 'Elif'))) {
          throw new ErrorPython('SyntaxError', '«elif» debe ir justo después de un «if» o de otro «elif», con la misma sangría.', s.linea, 0);
        }
        if (s.t === 'Else' && !(previo && ['If', 'Elif', 'While', 'For'].includes(previo.t)) && !(previo && previo.t === 'RawBlock' && /^(try|except|finally)\b/.test(previo.cabecera))) {
          throw new ErrorPython('SyntaxError', '«else» debe ir justo después de un «if» o «elif», con la misma sangría.', s.linea, 0);
        }
        previo = s;
      }
    }

    function esperarDosPuntos(cabecera) {
      if (esOp(':')) { avanzar(); return; }
      const t = ver();
      if (t.tipo === 'NEWLINE' || t.tipo === 'EOF') {
        throw new ErrorPython('SyntaxError', `Falta «:» (dos puntos) al final de la línea del «${cabecera}».`, cabecera_linea, 0);
      }
      if (t.tipo === 'OP' && t.valor === '=') {
        throw errorEn(t, 'En una condición se compara con «==» (dos signos). Un solo «=» sirve para guardar un valor en una variable.');
      }
      throw errorEn(t, `No esperaba «${t.valor}» aquí. ¿Falta «:» al final de la línea del «${cabecera}»?`);
    }
    let cabecera_linea = 0;

    function sentencia(cuerpo) {
      const t = ver();
      cabecera_linea = t.linea;
      if (t.tipo === 'COMMENT') {
        avanzar();
        cuerpo.push({ t: 'Comment', texto: t.valor.replace(/^#\s?/, ''), linea: t.linea });
        return;
      }
      if (t.tipo === 'NAME') {
        switch (t.valor) {
          case 'if': case 'elif': case 'while': {
            avanzar();
            const ini = p;
            const cond = expresionORaw([':']);
            if (cond === null) throw errorEn(ver(), `Falta la condición después de «${t.valor}».`);
            const c = comentarioFinal(ini, p + 1);
            esperarDosPuntos(t.valor);
            if (t.valor === 'while') profBucle++;
            const cuerpoInt = bloque();
            if (t.valor === 'while') profBucle--;
            if (c) cuerpoInt.unshift(c);
            cuerpo.push({ t: { if: 'If', elif: 'Elif', while: 'While' }[t.valor], cond, cuerpo: cuerpoInt, linea: t.linea });
            return;
          }
          case 'else': {
            avanzar();
            const c = comentarioFinal(p - 1, p + 1);
            esperarDosPuntos('else');
            const cuerpoInt = bloque();
            if (c) cuerpoInt.unshift(c);
            cuerpo.push({ t: 'Else', cuerpo: cuerpoInt, linea: t.linea });
            return;
          }
          case 'for': {
            avanzar();
            const ini = ver();
            if (es('NAME') && !PALABRAS_CLAVE.has(ver().valor) && esClave('in', 1)) {
              const variable = avanzar().valor;
              avanzar(); // in
              const iter = expresionORaw([':']);
              if (iter === null) throw errorEn(ver(), 'Falta lo que se va a recorrer después de «in».');
              const c = comentarioFinal(p, p + 1);
              esperarDosPuntos('for');
              profBucle++;
              const cuerpoInt = bloque();
              profBucle--;
              if (c) cuerpoInt.unshift(c);
              cuerpo.push({ t: 'For', variable, iter, cuerpo: cuerpoInt, linea: t.linea });
              return;
            }
            // for a, b in ... → bloque de Python libre
            p--;
            bloqueLibre(cuerpo, ini, true);
            return;
          }
          case 'def': {
            avanzar();
            if (!es('NAME') || PALABRAS_CLAVE.has(ver().valor)) throw errorEn(ver(), 'Después de «def» va el nombre de la función, por ejemplo: def saludar():');
            const nombre = avanzar().valor;
            if (!esOp('(')) throw errorEn(ver(), `Después del nombre «${nombre}» van paréntesis: def ${nombre}():`);
            const abre = avanzar();
            let prof = 1;
            const ini = p;
            while (prof > 0) {
              const x = avanzar();
              if (x.tipo === 'EOF') throw errorEn(abre, 'Falta cerrar el paréntesis de la función.');
              if (x.tipo === 'OP' && '([{'.includes(x.valor)) prof++;
              if (x.tipo === 'OP' && ')]}'.includes(x.valor)) prof--;
            }
            const cierra = toks[p - 1];
            const params = src.slice(abre.fin, cierra.ini).trim().replace(/\s+/g, ' ');
            if (esOp('->')) { avanzar(); expresionORaw([':']); }
            const c = comentarioFinal(ini, p + 1);
            esperarDosPuntos('def');
            profFuncion++;
            const bucles = profBucle; profBucle = 0;
            const cuerpoInt = bloque();
            profFuncion--; profBucle = bucles;
            if (c) cuerpoInt.unshift(c);
            cuerpo.push({ t: 'Def', nombre, params, cuerpo: cuerpoInt, linea: t.linea });
            return;
          }
          case 'try': case 'except': case 'finally': case 'with': case 'class': case 'async':
            bloqueLibre(cuerpo, t, false);
            return;
        }
      }
      if (t.tipo === 'OP' && t.valor === '@') { bloqueLibreLinea(cuerpo); return; }
      sentenciasSimples(cuerpo);
    }

    function bloqueLibre(cuerpo, t0, esFor) {
      // Cabecera: todo hasta los dos puntos de nivel 0
      const ini = ver();
      let prof = 0, k = p;
      for (;;) {
        const x = toks[k];
        if (x.tipo === 'NEWLINE' || x.tipo === 'EOF') {
          throw new ErrorPython('SyntaxError', `Falta «:» (dos puntos) al final de la línea del «${ini.valor}».`, ini.linea, 0);
        }
        if (x.tipo === 'OP' && '([{'.includes(x.valor)) prof++;
        if (x.tipo === 'OP' && ')]}'.includes(x.valor)) prof--;
        if (x.tipo === 'OP' && x.valor === ':' && prof === 0) break;
        k++;
      }
      const cabecera = texto(ini, toks[k - 1]);
      p = k + 1;
      if (esFor) profBucle++;
      const cuerpoInt = bloque();
      if (esFor) profBucle--;
      cuerpo.push({ t: 'RawBlock', cabecera, cuerpo: cuerpoInt, linea: ini.linea });
    }

    function bloqueLibreLinea(cuerpo) {
      const ini = ver();
      while (!es('NEWLINE') && !es('EOF')) avanzar();
      cuerpo.push({ t: 'Raw', texto: texto(ini, toks[p - 1]), linea: ini.linea });
      if (es('NEWLINE')) avanzar();
    }

    function sentenciasSimples(cuerpo) {
      for (;;) {
        const ini = p;
        const s = sentenciaSimple();
        cuerpo.push(s);
        const c = comentarioFinal(ini, p + 1);
        if (esOp(';')) {
          avanzar();
          if (c) cuerpo.push(c);
          if (es('NEWLINE') || es('EOF')) break;
          continue;
        }
        if (es('NEWLINE')) { avanzar(); if (c) cuerpo.push(c); break; }
        if (es('EOF') || es('DEDENT')) { if (c) cuerpo.push(c); break; }
        const t = ver();
        if (t.tipo === 'OP' && t.valor === ':') {
          throw errorEn(t, 'Sobran los dos puntos «:». Solo van al final de if, elif, else, for, while y def.');
        }
        throw errorEn(t, `No esperaba «${t.valor || t.tipo}» aquí. ¿Falta una coma, un operador o un paréntesis?`);
      }
    }

    function sentenciaSimple() {
      const t = ver();
      if (t.tipo === 'NAME') {
        switch (t.valor) {
          case 'pass': avanzar(); return { t: 'Pass', linea: t.linea };
          case 'break':
            avanzar();
            if (profBucle === 0) throw errorEn(t, '«break» solo puede usarse dentro de un bucle for o while.');
            return { t: 'Break', linea: t.linea };
          case 'continue':
            avanzar();
            if (profBucle === 0) throw errorEn(t, '«continue» solo puede usarse dentro de un bucle for o while.');
            return { t: 'Continue', linea: t.linea };
          case 'return': {
            avanzar();
            if (profFuncion === 0) throw errorEn(t, '«return» solo puede usarse dentro de una función (def).');
            if (es('NEWLINE') || es('EOF') || esOp(';') || es('DEDENT')) return { t: 'Return', valor: null, linea: t.linea };
            return { t: 'Return', valor: expresionORaw([';']), linea: t.linea };
          }
          case 'import': {
            if (es('NAME', undefined, 1) && (es('NEWLINE', undefined, 2) || es('EOF', undefined, 2) || esOp(';', 2))) {
              avanzar();
              const m = avanzar().valor;
              return { t: 'Import', modulo: m, linea: t.linea };
            }
            return lineaLibre();
          }
          case 'from': case 'global': case 'nonlocal': case 'del': case 'assert': case 'raise': case 'yield':
            return lineaLibre();
          case 'print':
            if (es('STRING', undefined, 1) || (es('NAME', undefined, 1) && !PALABRAS_CLAVE.has(ver(1).valor))) {
              throw errorEn(t, 'En Python 3, print necesita paréntesis: print("hola").');
            }
            break;
          case 'else': case 'elif':
            throw errorEn(t, `«${t.valor}» no puede ir aquí: debe empezar su propia línea, justo después del bloque del if.`);
          case 'if': case 'for': case 'while': case 'def':
            throw errorEn(t, `«${t.valor}» debe empezar su propia línea.`);
        }
      }
      if (t.tipo === 'OP' && t.valor === '=') throw errorEn(t, 'Falta el nombre de la variable antes de «=».');

      const ini = p;
      const objetivo = expresionORaw(['=', ...ASIGNACION_AUMENTADA, ';']);
      if (objetivo === null) throw errorEn(ver(), `No esperaba «${ver().valor || ver().tipo}» aquí.`);
      if (esOp('=')) {
        const igual = avanzar();
        if (es('NEWLINE') || es('EOF')) throw errorEn(igual, 'Falta el valor después de «=».');
        if (objetivo.t !== 'Name' && objetivo.t !== 'Subscript') {
          if (objetivo.t === 'Call') throw errorEn(igual, 'No se puede guardar un valor en una llamada a función. A la izquierda de «=» va el nombre de una variable.');
          if (objetivo.t === 'Num' || objetivo.t === 'Str') throw errorEn(igual, 'A la izquierda de «=» va el nombre de una variable, no un valor. Ejemplo: edad = 12');
          p = ini;
          return lineaLibre();
        }
        const ini2 = p;
        const valor = expresionORaw([';', '=']);
        if (esOp('=')) { p = ini; return lineaLibre(); }       // a = b = 0
        if (valor === null) { p = ini2; return lineaLibre(); }
        if (objetivo.t === 'Name') return { t: 'Assign', nombre: objetivo.id, valor, linea: t.linea };
        return { t: 'SetItem', obj: objetivo.obj, indice: objetivo.indice, valor, linea: t.linea };
      }
      if (es('OP') && ASIGNACION_AUMENTADA.has(ver().valor)) {
        const op = avanzar().valor;
        const valor = expresionORaw([';']);
        if (objetivo.t === 'Name' && ['+=', '-=', '*=', '/='].includes(op) && valor) {
          return { t: 'AugAssign', nombre: objetivo.id, op, valor, linea: t.linea };
        }
        p = ini;
        return lineaLibre();
      }
      return { t: 'Expr', valor: objetivo, linea: t.linea };
    }

    function lineaLibre() {
      const ini = ver();
      let prof = 0;
      while (!es('EOF')) {
        const x = ver();
        if (prof === 0 && (x.tipo === 'NEWLINE' || (x.tipo === 'OP' && x.valor === ';'))) break;
        if (x.tipo === 'OP' && '([{'.includes(x.valor)) prof++;
        if (x.tipo === 'OP' && ')]}'.includes(x.valor)) prof--;
        avanzar();
      }
      return { t: 'Raw', texto: texto(ini, toks[p - 1]), linea: ini.linea };
    }

    /* ---- Expresiones ---- */
    // Intenta analizar una expresión; si usa algo que no tiene bloque
    // (rebanadas, lambda, diccionarios...), la guarda como Python libre.
    function expresionORaw(paradas) {
      const ini = p;
      const t0 = ver();
      if (t0.tipo === 'NEWLINE' || t0.tipo === 'EOF' || (t0.tipo === 'OP' && paradas.includes(t0.valor))) return null;
      try {
        const e = expresion();
        const t = ver();
        if (t.tipo === 'NEWLINE' || t.tipo === 'EOF' || t.tipo === 'DEDENT' || (t.tipo === 'OP' && (paradas.includes(t.valor) || t.valor === ')' || t.valor === ']' || t.valor === ','))) return e;
        if (t.tipo === 'OP' && (t.valor === '=' || t.valor === ':') && !paradas.includes(t.valor)) return e;
      } catch (err) {
        if (!(err instanceof NoSoportado)) throw err;
      }
      p = ini;
      return escanearLibre(paradas);
    }

    function escanearLibre(paradas) {
      const ini = ver();
      let prof = 0;
      let prev = null;
      while (!es('EOF')) {
        const x = ver();
        if (prof === 0) {
          if (x.tipo === 'NEWLINE' || x.tipo === 'DEDENT') break;
          if (x.tipo === 'OP' && (paradas.includes(x.valor) || x.valor === ')' || x.valor === ']' || x.valor === ',')) break;
        }
        if (x.tipo === 'OP' && '([{'.includes(x.valor)) prof++;
        if (x.tipo === 'OP' && ')]}'.includes(x.valor)) prof--;
        if (prev && pegados(prev, x)) {
          throw errorEn(x, `Falta un operador o una coma entre «${prev.valor}» y «${x.valor}».`);
        }
        prev = x;
        avanzar();
      }
      if (p === toks.indexOf(ini)) return null;
      return { t: 'RawExpr', texto: texto(ini, toks[p - 1]) };
    }

    function pegados(a, b) {
      const atomo = x => (x.tipo === 'NAME' && !PALABRAS_CLAVE.has(x.valor)) || x.tipo === 'NUMBER' || x.tipo === 'STRING' || x.tipo === 'HUECO';
      const literal = x => x.tipo === 'NUMBER' || x.tipo === 'STRING';
      if (!atomo(a) || !atomo(b)) return false;
      if (a.tipo === 'STRING' && b.tipo === 'STRING') return false;
      return literal(a) || literal(b) || (a.tipo === 'NAME' && b.tipo === 'NAME');
    }

    function expresion() {
      if (esClave('lambda')) throw new NoSoportado();
      const e = oLogico();
      if (esClave('if')) throw new NoSoportado();          // a if c else b
      if (esOp(':=')) throw new NoSoportado();
      return e;
    }
    function oLogico() {
      let e = yLogico();
      while (esClave('or')) { avanzar(); e = { t: 'BoolOp', op: 'or', a: e, b: yLogico() }; }
      return e;
    }
    function yLogico() {
      let e = noLogico();
      while (esClave('and')) { avanzar(); e = { t: 'BoolOp', op: 'and', a: e, b: noLogico() }; }
      return e;
    }
    function noLogico() {
      if (esClave('not')) { avanzar(); return { t: 'Not', v: noLogico() }; }
      return comparacion();
    }
    const COMPARADORES = ['==', '!=', '<', '<=', '>', '>='];
    function comparacion() {
      const a = aritmetica();
      let op = null;
      if (es('OP') && COMPARADORES.includes(ver().valor)) op = avanzar().valor;
      else if (esClave('in')) { avanzar(); op = 'in'; }
      else if (esClave('not') && esClave('in', 1)) { avanzar(); avanzar(); op = 'not in'; }
      else if (esClave('is')) throw new NoSoportado();
      else if (esOp('=') && false) op = null;
      if (!op) return a;
      const b = aritmetica();
      if ((es('OP') && COMPARADORES.includes(ver().valor)) || esClave('in') || esClave('is') || (esClave('not') && esClave('in', 1))) {
        throw new NoSoportado();                         // 0 < x < 10
      }
      if (op === 'in' || op === 'not in') return { t: 'In', op, a, b };
      return { t: 'Compare', op, a, b };
    }
    function aritmetica() {
      let e = termino();
      while (esOp('+') || esOp('-')) { const op = avanzar().valor; e = { t: 'BinOp', op, a: e, b: termino() }; }
      return e;
    }
    function termino() {
      let e = factor();
      while (esOp('*') || esOp('/') || esOp('//') || esOp('%') || esOp('@')) {
        const op = avanzar().valor;
        if (op === '@') throw new NoSoportado();
        e = { t: 'BinOp', op, a: e, b: factor() };
      }
      return e;
    }
    function factor() {
      if (esOp('-')) {
        avanzar();
        const v = factor();
        if (v.t === 'Num' && !v.texto.startsWith('-')) return { t: 'Num', texto: '-' + v.texto };
        return { t: 'Neg', v };
      }
      if (esOp('+') || esOp('~')) throw new NoSoportado();
      return potencia();
    }
    function potencia() {
      const base = primario();
      if (esOp('**')) { avanzar(); return { t: 'BinOp', op: '**', a: base, b: factor() }; }
      return base;
    }
    function primario() {
      let e = atomo();
      for (;;) {
        if (esOp('(')) {
          const abre = avanzar();
          const { args, kwargs } = argumentos();
          if (!esOp(')')) throw errorEn(abre, 'Falta cerrar el paréntesis «)».');
          avanzar();
          e = { t: 'Call', func: e, args, kwargs };
        } else if (esOp('[')) {
          avanzar();
          if (esOp(':') || esOp(']')) throw new NoSoportado();
          const indice = expresion();
          if (!esOp(']')) throw new NoSoportado();       // rebanadas a[1:3]
          avanzar();
          e = { t: 'Subscript', obj: e, indice };
        } else if (esOp('.')) {
          avanzar();
          if (!es('NAME')) throw errorEn(ver(), 'Después del punto «.» va el nombre de un método, por ejemplo: texto.upper()');
          e = { t: 'Attribute', obj: e, attr: avanzar().valor };
        } else break;
      }
      return e;
    }
    function argumentos() {
      const args = [], kwargs = [];
      while (!esOp(')')) {
        if (es('EOF') || es('NEWLINE')) throw new NoSoportado();
        if (esOp('*') || esOp('**')) throw new NoSoportado();
        if (es('NAME') && esOp('=', 1)) {
          const nombre = avanzar().valor; avanzar();
          kwargs.push({ nombre, valor: expresion() });
        } else {
          if (kwargs.length) throw new NoSoportado();
          const a = expresion();
          if (esClave('for')) throw new NoSoportado();
          args.push(a);
        }
        if (esOp(',')) { avanzar(); continue; }
        if (!esOp(')')) {
          const t = ver();
          if (t.tipo === 'NEWLINE' || t.tipo === 'EOF') throw new NoSoportado();
          throw errorEn(t, `Falta una coma «,» o cerrar el paréntesis antes de «${t.valor}».`);
        }
      }
      return { args, kwargs };
    }
    function atomo() {
      const t = ver();
      if (t.tipo === 'NAME') {
        if (t.valor === 'True' || t.valor === 'False') { avanzar(); return { t: 'Bool', v: t.valor }; }
        if (t.valor === 'None') { avanzar(); return { t: 'None' }; }
        if (PALABRAS_CLAVE.has(t.valor)) {
          if (t.valor === 'lambda' || t.valor === 'yield' || t.valor === 'await') throw new NoSoportado();
          throw errorEn(t, `«${t.valor}» es una palabra reservada de Python y no puede usarse aquí.`);
        }
        avanzar();
        if (t.valor === '___') return { t: 'Blank' };
        return { t: 'Name', id: t.valor };
      }
      if (t.tipo === 'NUMBER') { avanzar(); return { t: 'Num', texto: t.valor }; }
      if (t.tipo === 'HUECO') { avanzar(); return { t: 'Hueco', texto: t.valor }; }
      if (t.tipo === 'STRING') {
        avanzar();
        if (es('STRING') || t.triple || t.prefijo.includes('b') || t.prefijo.includes('r')) {
          while (es('STRING')) avanzar();
          throw new NoSoportado();
        }
        let interior = t.interior;
        if (t.comilla === "'") interior = cambiarAComillaDoble(interior);
        if (interior === null) throw new NoSoportado();
        if (t.prefijo.includes('f')) {
          if (t.comilla === "'" && t.interior.includes('"')) throw new NoSoportado();
          return { t: 'FStr', texto: interior };
        }
        return { t: 'Str', texto: interior };
      }
      if (t.tipo === 'OP' && t.valor === '(') {
        avanzar();
        if (esOp(')')) throw new NoSoportado();          // tupla vacía
        const e = expresion();
        if (esOp(',') || esClave('for')) throw new NoSoportado();
        if (!esOp(')')) throw new NoSoportado();
        avanzar();
        return e;
      }
      if (t.tipo === 'OP' && t.valor === '[') {
        avanzar();
        const items = [];
        while (!esOp(']')) {
          if (es('EOF') || es('NEWLINE')) throw new NoSoportado();
          items.push(expresion());
          if (esClave('for')) throw new NoSoportado();
          if (esOp(',')) { avanzar(); continue; }
          if (!esOp(']')) throw new NoSoportado();
        }
        avanzar();
        return { t: 'List', items };
      }
      if (t.tipo === 'OP' && t.valor === '{') throw new NoSoportado();
      if (t.tipo === 'OP' && t.valor === '...') throw new NoSoportado();
      if (t.tipo === 'INDENT') throw errorEn(t, 'Sangría inesperada.', 'IndentationError');
      throw new NoSoportado();
    }

    const cuerpo = archivo();
    return cuerpo;
  }

  /** Convierte el interior de una cadena con comilla simple al de comilla doble. */
  function cambiarAComillaDoble(interior) {
    let r = '';
    for (let k = 0; k < interior.length; k++) {
      const ch = interior[k];
      if (ch === '\\') {
        const sig = interior[k + 1];
        if (sig === "'") { r += "'"; k++; continue; }
        r += ch + (sig ?? ''); k++; continue;
      }
      if (ch === '"') { r += '\\"'; continue; }
      r += ch;
    }
    return r;
  }

  /** Revisa la sintaxis. Devuelve null o {tipo, mensaje, linea, col}. */
  function revisarSintaxis(codigo) {
    try {
      analizar(codigo);
      return null;
    } catch (e) {
      if (e instanceof ErrorPython) return { tipo: e.tipo, mensaje: e.mensaje, linea: e.linea, col: e.col };
      return null;
    }
  }

  /* ------------------------------------------------------------------ *

      const t = toks[k], ant = toks[k - 1], sig = toks[k + 1];
      if (t.tipo === 'COMMENT') { r.comentarios++; continue; }
      if (t.tipo === 'STRING') { r.cadenas++; if (t.prefijo && t.prefijo.includes('f')) r.fstrings++; continue; }

          else r.llamadas[t.valor] = (r.llamadas[t.valor] || 0) + 1;
        }
        if (!esMetodo) r.nombres[t.valor] = (r.nombres[t.valor] || 0) + 1;
        continue;
      }
      if (t.tipo === 'OP') {
        r.operadores[t.valor] = (r.operadores[t.valor] || 0) + 1;
        if (t.valor === '[') {
          const subindice = ant && ((ant.tipo === 'NAME' && !PALABRAS_CLAVE.has(ant.valor)) || ant.tipo === 'STRING' ||

      else if (m[2]) clase = /^[rRbBuUfF]*[fF]/.test(m[2]) ? 'tk-fstr' : 'tk-str';
      else if (m[3]) clase = 'tk-hueco';
      else if (m[4]) clase = 'tk-num';
      else if (m[5]) {
        const w = m[5];
        if (w === 'True' || w === 'False' || w === 'None') clase = 'tk-cte';
        else if (PALABRAS_CLAVE.has(w)) clase = 'tk-kw';
        else if (w === '___') clase = 'tk-hueco';
        else if (FUNCIONES_INTEGRADAS.has(w)) clase = 'tk-fn';

      inputsInline: true, previousStatement: null, nextStatement: null, colour: COLOR.listas,
      tooltip: 'append: agrega al final de la lista. remove: quita la primera vez que aparece ese valor.'
    },
    {
      type: 'py_func1', message0: '%1 ( %2 )',
      args0: [{ type: 'field_dropdown', name: 'FUNC', options: [['max', 'max'], ['min', 'min'], ['sum', 'sum'], ['sorted', 'sorted'], ['abs', 'abs']] }, { type: 'input_value', name: 'X' }],
      inputsInline: true, output: null, colour: COLOR.listas,
      tooltip: 'max: el mayor · min: el menor · sum: la suma · sorted: ordenada · abs: valor absoluto.'
    },
    /* ---- Azar ---- */
    {
      type: 'py_import', message0: 'import %1', args0: [{ type: 'field_dropdown', name: 'MODULO', options: [['random', 'random'], ['math', 'math'], ['time', 'time']] }],
      previousStatement: null, nextStatement: null, colour: COLOR.azar, tooltip: 'Trae un módulo de Python. Va al inicio del programa.'
    },
    {
      type: 'py_randint', message0: 'random.randint( %1 , %2 )', args0: [{ type: 'input_value', name: 'A' }, { type: 'input_value', name: 'B' }],
      inputsInline: true, output: null, colour: COLOR.azar, tooltip: 'Un número entero al azar entre A y B (incluidos). Necesita import random.'
    },
    {
      type: 'py_choice', message0: 'random.choice( %1 )', args0: [{ type: 'input_value', name: 'X' }],
      inputsInline: true, output: null, colour: COLOR.azar, tooltip: 'Un elemento al azar de una lista. Necesita import random.'
    },
    /* ---- Funciones ---- */
    {
      type: 'py_def', message0: 'def %1 ( %2 ) :',
      args0: [{ type: 'field_input', name: 'NOMBRE', text: 'saludar' }, { type: 'field_input', name: 'PARAMS', text: '' }],
      message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
      previousStatement: null, nextStatement: null, colour: COLOR.funciones,
      tooltip: 'Define una función nueva. Entre paréntesis van sus parámetros, separados por comas.'
    },
    {
      type: 'py_return', message0: 'return %1', args0: [{ type: 'input_value', name: 'VALOR' }],
      inputsInline: true, previousStatement: null, colour: COLOR.funciones, tooltip: 'Termina la función y devuelve un valor.'
    },
    {
      type: 'py_kwarg', message0: '%1 = %2', args0: [{ type: 'field_input', name: 'NOMBRE', text: 'end' }, { type: 'input_value', name: 'VALOR' }],
      inputsInline: true, output: null, colour: COLOR.salida, tooltip: 'Argumento con nombre, por ejemplo end="" en print.'
    },
    /* ---- Python libre ---- */
    {
      type: 'py_expr_stmt', message0: '%1', args0: [{ type: 'input_value', name: 'VALOR' }],
      inputsInline: true, previousStatement: null, nextStatement: null, colour: COLOR.libre, tooltip: 'Ejecuta una expresión como instrucción.'
    },
    {
      type: 'py_raw_stmt', message0: '%1', args0: [{ type: 'field_input', name: 'CODIGO', text: '' }],
      previousStatement: null, nextStatement: null, colour: COLOR.libre, tooltip: 'Una línea de Python escrita a mano.'
    },
    {
      type: 'py_raw_expr', message0: '%1', args0: [{ type: 'field_input', name: 'CODIGO', text: '' }],
      output: null, colour: COLOR.libre, tooltip: 'Una expresión de Python escrita a mano.'
    },
    {
      type: 'py_raw_block', message0: '%1 :', args0: [{ type: 'field_input', name: 'CABECERA', text: 'try' }],
      message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
      previousStatement: null, nextStatement: null, colour: COLOR.libre, tooltip: 'Un bloque de Python escrito a mano.'
    },
    {
      type: 'py_hueco', message0: '✎ %1', args0: [{ type: 'field_input', name: 'CODIGO', text: '' }],
      output: null, colour: COLOR.hueco,
      tooltip: 'Hueco: escribe aquí la expresión en Python (también puedes escribirla en el panel de Python).'
    }
  ];

  function registrar() {
    if (registrar.hecho) return;
    registrar.hecho = true;
    Blockly.defineBlocksWithJsonArray(definiciones);

    // Validadores y avisos que no caben en JSON
    const conValidador = (tipo, campo, fn) => {
      const init = Blockly.Blocks[tipo].init;
      Blockly.Blocks[tipo].init = function () {
        init.call(this);
        this.getField(campo).setValidator(fn);
      };
    };
    conValidador('py_number', 'NUM', validarNumero);
    conValidador('py_def', 'NOMBRE', validarNombre);
    conValidador('py_def', 'PARAMS', validarParametros);
    conValidador('py_kwarg', 'NOMBRE', validarNombre);
    for (const t of ['py_string', 'py_fstring', 'py_comment']) conValidador(t, 'TEXTO', comillas);
    for (const t of ['py_raw_stmt', 'py_raw_expr', 'py_hueco']) conValidador(t, 'CODIGO', comillas);
    conValidador('py_raw_block', 'CABECERA', comillas);

    const avisar = (tipo, fn) => { Blockly.Blocks[tipo].onchange = conAviso(fn); };
    avisar('py_elif', function () {
      const a = bloqueAnterior(this);
      return a && (a.type === 'py_if' || a.type === 'py_elif') ? null : 'elif debe ir justo debajo de un bloque if o de otro elif.';
    });
    avisar('py_else', function () {
      const a = bloqueAnterior(this);
      return a && ['py_if', 'py_elif', 'py_for', 'py_while', 'py_raw_block'].includes(a.type) ? null : 'else debe ir justo debajo de un bloque if o elif.';
    });
    avisar('py_break', function () { return dentroDe(this, ['py_for', 'py_while']) ? null : 'break solo funciona dentro de un bucle for o while.'; });
    avisar('py_continue', function () { return dentroDe(this, ['py_for', 'py_while']) ? null : 'continue solo funciona dentro de un bucle for o while.'; });
    avisar('py_return', function () { return dentroDe(this, ['py_def']) ? null : 'return solo funciona dentro de una función (def).'; });

    // Bloques variádicos
    definirVariadico('py_print', { etiqueta: 'print(', cierre: ')', min: 0, max: 8, inicio: 1, color: COLOR.salida, salida: false, tooltip: 'Muestra en pantalla. Con + agregas más piezas separadas por comas.' });
    definirVariadico('py_list', { etiqueta: '[', cierre: ']', min: 0, max: 12, inicio: 3, color: COLOR.listas, salida: true, tooltip: 'Una lista: varios valores en orden, separados por comas.' });
    definirVariadico('py_range', { etiqueta: 'range(', cierre: ')', min: 1, max: 3, inicio: 1, color: COLOR.control, salida: true, tooltip: 'range(5) → 0,1,2,3,4 · range(1, 6) → 1…5 · range(0, 10, 2) → de 2 en 2.' });
    definirVariadico('py_call', { cierre: ')', min: 0, max: 8, inicio: 0, color: COLOR.funciones, salida: true, campoNombre: true, tooltip: 'Usa (llama) una función y obtén lo que devuelve.' });
    definirVariadico('py_call_stmt', { cierre: ')', min: 0, max: 8, inicio: 0, color: COLOR.funciones, salida: false, campoNombre: true, tooltip: 'Usa (llama) una función.' });
    definirVariadico('py_method_call', { cierre: ')', min: 0, max: 8, inicio: 0, color: COLOR.libre, salida: true, campoObjeto: true, tooltip: 'Llama un método de un objeto.' });
    for (const t of ['py_call', 'py_call_stmt', 'py_method_call']) {
      const init = Blockly.Blocks[t].init;
      Blockly.Blocks[t].init = function () { init.call(this); this.getField('NOMBRE').setValidator(validarNombre); };
    }

    // Los huecos se dibujan punteados desde la hoja de estilos (por su color).
  }

  return { registrar, COLOR, validarNumero };
})();
