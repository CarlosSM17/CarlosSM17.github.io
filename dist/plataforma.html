<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plataforma de retos para pasar de los bloques de Scratch a Python, con Blockly.">
<title>De Bloques a Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* =========================================================================
 * Estilos de la plataforma «De Bloques a Python»
 * Pensados para iPad (botones grandes, campos de 16 px para que Safari no
 * haga zoom) y para proyectar en el salón.
 * ========================================================================= */
:root {
  color-scheme: light;
  --fondo: #F3F5FA;
  --superficie: #FFFFFF;
  --superficie-2: #F8F9FC;
  --superficie-3: #EEF1F8;
  --borde: #DFE3EE;
  --borde-fuerte: #C9CFDF;
  --texto: #1E2240;
  --texto-suave: #575D7E;
  --texto-tenue: #8A90AA;
  --primario: #4F46E5;
  --primario-oscuro: #3B33C4;
  --primario-suave: #EEEFFF;
  --exito: #15803D;
  --exito-claro: #22A55A;
  --exito-suave: #E7F6EC;
  --error: #C62828;
  --error-suave: #FDECEC;
  --aviso: #B45309;
  --aviso-suave: #FFF5E0;
  --amarillo: #FFAB19;
  --resalte: #FFF2B8;
  --seleccion: #E6E8FF;
  --consola: #1D2033;
  --consola-texto: #E7E9F5;
  --radio: 14px;
  --radio-chico: 9px;
  --sombra: 0 1px 2px rgba(22, 26, 60, .06), 0 6px 18px rgba(22, 26, 60, .07);
  --sombra-alta: 0 10px 40px rgba(22, 26, 60, .22);
  --fuente: "Nunito", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --fuente-codigo: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --cabeza: 56px;
}

* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
html.texto-grande { font-size: 18px; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--fuente);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#app { min-height: 100%; }
a { color: var(--primario); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 800; }
p { margin: 0 0 .75em; }
code, pre, .codigo { font-family: var(--fuente-codigo); font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.panel-python, .editor, .consola, .anim-codigo { font-feature-settings: "liga" 0, "calt" 0; }
button { font-family: inherit; }
input, textarea { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid rgba(79, 70, 229, .45); outline-offset: 2px; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: 40px; padding: 8px 16px; border-radius: 11px; border: 1px solid transparent;
  font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .15s, transform .08s, box-shadow .15s; -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primario { background: var(--primario); color: #fff; box-shadow: 0 2px 0 var(--primario-oscuro); }
.btn-primario:hover:not(:disabled) { background: var(--primario-oscuro); }
.btn-secundario, .btn-suave { background: var(--superficie); color: var(--texto); border-color: var(--borde-fuerte); }
.btn-suave:hover:not(:disabled), .btn-secundario:hover:not(:disabled) { background: var(--superficie-3); }
.btn-ejecutar { background: var(--exito-claro); color: #fff; box-shadow: 0 2px 0 #17803f; }
.btn-ejecutar:hover:not(:disabled) { background: #1c9450; }
.btn-detener, .btn-peligro { background: var(--error); color: #fff; }
.btn-chico { min-height: 34px; padding: 5px 11px; font-size: .88rem; border-radius: 9px; }
.btn-icono {
  display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0;
  border-radius: 10px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto);
  font-size: 1.05rem; font-weight: 800; cursor: pointer; text-decoration: none;
}
.btn-icono:hover { background: var(--superficie-3); }

/* ---------- Campos ---------- */
.campo {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--borde-fuerte);
  background: #fff; color: var(--texto); font: inherit; font-size: 16px; margin-bottom: 8px;
}
.campo:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px rgba(79, 70, 229, .18); }
.campo-codigo { font-family: var(--fuente-codigo); font-size: 14px; }
.campo-etiqueta { display: block; font-weight: 700; font-size: .9rem; margin: 6px 0 4px; color: var(--texto-suave); }
.campo-error { color: var(--error); font-weight: 700; min-height: 1.2em; margin: 0; }
.nota { color: var(--texto-suave); font-size: .9rem; }
.centro { text-align: center; }

/* ---------- Cabecera de la aplicación ---------- */
.app-cabeza {
  position: sticky; top: 0; z-index: 50; height: var(--cabeza);
  display: flex; align-items: center; gap: 12px; padding: 0 14px;
  background: var(--superficie); border-bottom: 1px solid var(--borde);
}
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--texto); min-width: 0; }
.logo { position: relative; width: 36px; height: 36px; flex: none; }
.logo-bloque { position: absolute; inset: 4px 0 0 0; background: var(--amarillo); border-radius: 8px 8px 8px 8px; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); }
.logo-bloque::before { content: ""; position: absolute; top: -4px; left: 8px; width: 12px; height: 6px; background: var(--amarillo); border-radius: 3px 3px 0 0; }
.logo-texto { position: absolute; inset: 4px 0 0 0; display: grid; place-items: center; font-family: var(--fuente-codigo); font-weight: 800; color: #3d2a00; font-size: 15px; }
.marca-texto { font-weight: 800; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-nav { display: flex; gap: 4px; margin-left: auto; }
.app-nav a {
  display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 10px; text-decoration: none;
  color: var(--texto-suave); font-weight: 700; font-size: .93rem;
}
.app-nav a:hover { background: var(--superficie-3); }
.app-nav a.activo { background: var(--primario-suave); color: var(--primario); }
.app-nav a.nav-docente-activo { color: var(--aviso); }
.app-herramientas { display: flex; align-items: center; gap: 6px; }
.alumno-chip {
  border: 1px solid var(--borde); background: var(--superficie-2); border-radius: 999px; padding: 6px 12px;
  font-weight: 700; font-size: .88rem; cursor: pointer; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texto);
}
@media (max-width: 900px) {
  .nav-texto { display: none; }
  .marca-texto { max-width: 32vw; }
}
@media (max-width: 560px) {
  .marca-texto, .alumno-chip { display: none; }
  .app-cabeza { gap: 6px; padding: 0 8px; }
  .app-nav a { padding: 7px 8px; }
}
@media (max-width: 440px) {
  .app-herramientas .btn-icono { display: none; }
}

/* ---------- Vista principal ---------- */
.vista { max-width: 1120px; margin: 0 auto; padding: 22px 16px 56px; }
.vista.con-taller { max-width: none; padding: 0; height: calc(100vh - var(--cabeza)); height: calc(100dvh - var(--cabeza)); overflow: hidden; overflow: clip; }
.taller, .taller-cuerpo, .taller-lateral, .lateral-inf { overflow: hidden; overflow: clip; }
.consola-linea input { max-width: calc(100% - 90px); }
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px; margin-bottom: 16px; box-shadow: var(--sombra); }
.tarjeta.peligro { border-color: #f3c3c3; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.fila-campos { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
.fila-campos .campo { margin: 0; }
@media (max-width: 640px) { .fila-campos { grid-template-columns: 1fr; } }
.tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); vertical-align: top; }
th { background: var(--superficie-2); font-weight: 800; color: var(--texto-suave); font-size: .85rem; }
.aviso-almacen { background: var(--aviso-suave); color: var(--aviso); border-radius: 10px; padding: 10px 14px; font-weight: 700; margin: 10px 0; }

/* ---------- Chips y estrellas ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 800; background: var(--superficie-3); color: var(--texto-suave); white-space: nowrap; }
.chip-modo.modo-1 { background: #F0E9FF; color: #6B3FD6; }
.chip-modo.modo-2 { background: #E8F7EC; color: #237A3B; }
.chip-modo.modo-3 { background: #E6F0FF; color: #2459B8; }
.chip-modo.modo-4 { background: #FFF0E0; color: #A44E00; }
.chip-codigo { font-family: var(--fuente-codigo); font-weight: 600; background: #fff; border: 1px solid var(--borde); color: var(--texto); }
.chip-explorador { background: #E5F6EF; color: #0E7A50; margin-left: 6px; }
.chip-programador { background: #E7ECFF; color: #3644B5; margin-left: 6px; }
.chip-maestro { background: #FFF0D9; color: #9A5A00; margin-left: 6px; }
.estrellas { color: #D7DBE6; letter-spacing: 1px; font-size: 1rem; white-space: nowrap; }
.estrellas .llena { color: #F5B301; }

/* ---------- Inicio ---------- */
.inicio-cabeza {
  display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
  background: linear-gradient(135deg, #4F46E5 0%, #7C4DFF 60%, #9966FF 100%); color: #fff;
  border-radius: 20px; padding: 26px; margin-bottom: 18px; box-shadow: var(--sombra);
}
.inicio-cabeza .nota { color: rgba(255, 255, 255, .85); margin: 6px 0 0; }
.lema { font-size: 1.05rem; opacity: .92; }
.barra-progreso { height: 12px; background: rgba(255, 255, 255, .28); border-radius: 999px; overflow: hidden; max-width: 420px; }
.barra-relleno { height: 100%; background: #FFD84D; border-radius: 999px; transition: width .6s ease; }
.insignias-fila { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.insignia-item { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 86px; text-align: center; font-size: .75rem; font-weight: 700; line-height: 1.2; }
.insignia.bloqueada { opacity: .75; }
.insignia.ganada svg { filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .2)); }
.inicio-cabeza .insignia-item { color: #fff; }
@media (max-width: 820px) {
  .inicio-cabeza { grid-template-columns: 1fr; }
  .insignias-fila { justify-content: flex-start; }
}
.continuar {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-bottom: 18px; text-decoration: none; color: var(--texto);
  background: var(--superficie); border: 2px solid var(--primario); border-radius: var(--radio); box-shadow: var(--sombra);
}
.continuar small { display: block; color: var(--texto-suave); font-weight: 700; }
.continuar-icono { width: 42px; height: 42px; border-radius: 50%; background: var(--primario); color: #fff; display: grid; place-items: center; font-size: 1.1rem; flex: none; }
.unidad { margin-bottom: 26px; }
.unidad-cabeza { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.unidad-cabeza h2 { margin: 0; }
.unidad-cabeza .nota { margin-left: auto; }
.unidad-icono { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.4rem; background: var(--color-unidad); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); }
.unidad-num { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-tenue); }
.rejilla-sesiones { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tarjeta-sesion {
  position: relative; display: flex; gap: 12px; padding: 14px; text-decoration: none; color: var(--texto);
  background: var(--superficie); border: 1px solid var(--borde); border-left: 6px solid var(--color-unidad);
  border-radius: var(--radio); box-shadow: var(--sombra); transition: transform .12s, box-shadow .12s;
}
.tarjeta-sesion:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(22, 26, 60, .12); }
.ts-num { flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--superficie-3); display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; }
.ts-cuerpo { min-width: 0; flex: 1; }
.ts-titulo { font-weight: 800; line-height: 1.25; }
.ts-reto { color: var(--texto-suave); font-size: .88rem; margin: 3px 0 8px; }
.ts-pie { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ts-pasos { display: inline-flex; gap: 3px; margin-left: auto; }
.ts-pasos i { width: 7px; height: 7px; border-radius: 50%; background: var(--borde-fuerte); }
.ts-pasos i.visto { background: var(--exito-claro); }
.ts-hecho { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--exito-claro); color: #fff; display: grid; place-items: center; font-weight: 800; box-shadow: var(--sombra); }
.pie-inicio { margin-top: 20px; }

/* ---------- Sesión ---------- */
.sesion-cabeza { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.sesion-titulos { flex: 1; min-width: 0; }
.sesion-unidad { font-weight: 800; font-size: .85rem; color: var(--color-unidad); filter: brightness(.8); text-transform: uppercase; letter-spacing: .05em; }
.sesion-cabeza h1 { margin: 2px 0 8px; }
.sesion-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sesion-navegacion { display: flex; gap: 6px; flex: none; }
@media (max-width: 640px) { .sesion-navegacion { display: none; } }
.pasos {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 14px;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin;
}
.paso {
  display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 12px; white-space: nowrap;
  text-decoration: none; color: var(--texto-suave); font-weight: 700; font-size: .9rem;
  background: var(--superficie); border: 1px solid var(--borde);
}
.paso-num { width: 22px; height: 22px; border-radius: 50%; background: var(--superficie-3); display: grid; place-items: center; font-size: .78rem; font-weight: 800; }
.paso.visto .paso-num { background: var(--exito-claro); color: #fff; }
.paso.activo { background: var(--primario); color: #fff; border-color: var(--primario); }
.paso.activo .paso-num { background: #fff; color: var(--primario); }
.sesion-contenido { background: var(--superficie); border: 1px solid var(--borde); border-radius: 18px; padding: 22px; box-shadow: var(--sombra); }
@media (max-width: 640px) { .sesion-contenido { padding: 16px; } }
.siguiente-paso { display: flex; justify-content: flex-end; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--borde); }
.intro-paso { color: var(--texto-suave); }

.historia-grande { display: flex; gap: 14px; align-items: flex-start; background: #FFF8E6; border: 1px solid #F6E1A6; border-radius: var(--radio); padding: 16px; margin-bottom: 16px; font-size: 1.05rem; }
.historia-grande p { margin: 0; }
.historia-icono { font-size: 2rem; line-height: 1; }
.historia { font-style: italic; color: var(--texto-suave); }
.objetivos { background: var(--primario-suave); border-radius: var(--radio); padding: 14px 18px; margin-bottom: 16px; }
.objetivos ul { margin: 0; padding-left: 1.2em; }
.teoria-texto { margin-bottom: 12px; }
.teoria-texto ul, .teoria-texto ol { padding-left: 1.3em; }
.teoria-titulo { margin-top: 22px; }
.analogia { display: flex; gap: 14px; background: #EEF8FF; border: 1px solid #CBE6FF; border-radius: var(--radio); padding: 14px 16px; margin: 14px 0; }
.analogia-icono { font-size: 1.9rem; line-height: 1; }
.fichas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.ficha, .ficha-mini { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 12px; padding: 12px; }
.ficha-titulo { font-weight: 800; margin-bottom: 6px; }
.ficha .codigo, .ficha-mini .codigo { margin: 0 0 6px; }
.tabla-comparacion td { vertical-align: middle; }
.tabla-comparacion .codigo { margin: 0; }
.teoria-bloques, .teoria-animacion { margin: 16px 0; }
.bloques-y-python { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
.bloques-y-python .codigo { margin: 0; }
@media (max-width: 700px) { .bloques-y-python { grid-template-columns: 1fr; } }
.bloques-lectura { position: relative; border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; background: #F8F9FC; }

/* ---------- Código con resaltado ---------- */
.codigo {
  background: #FBFBFE; border: 1px solid var(--borde); border-radius: 10px; padding: 10px 14px; margin: 8px 0;
  font-size: 15px; line-height: 1.6; overflow-x: auto; white-space: pre; tab-size: 4; color: #1E2240;
}
.codigo.con-numeros .cn { display: inline-block; width: 2em; margin-right: .8em; color: var(--texto-tenue); text-align: right; user-select: none; }
.codigo.salida { background: var(--consola); color: var(--consola-texto); border-color: var(--consola); }
.codigo.en-opcion { margin: 0; background: transparent; border: 0; padding: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.opcion { min-width: 0; }
.tarjeta .insignias-fila { justify-content: flex-start; }
.tk-kw { color: #9C27B0; font-weight: 700; }
.tk-fn { color: #0B5FCC; }
.tk-def { color: #0B5FCC; font-weight: 700; }
.tk-str, .tk-fstr { color: #18803A; }
.tk-num, .tk-cte { color: #B25000; }
.tk-com { color: #858BA5; font-style: italic; }
.tk-op { color: #B0365A; }
.tk-hueco { background: #FFF1A8; border: 1px dashed #C99A00; border-radius: 4px; color: #6B5200; }
.codigo.salida .tk-kw, .codigo.salida .tk-fn, .codigo.salida .tk-str, .codigo.salida .tk-num, .codigo.salida .tk-op, .codigo.salida .tk-com, .codigo.salida .tk-cte, .codigo.salida .tk-def, .codigo.salida .tk-fstr { color: inherit; font-weight: inherit; font-style: inherit; }
.codigo-probable { margin: 12px 0; }
.codigo-probable .codigo { margin-bottom: 6px; }
.codigo-acciones { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mini-consola { margin-top: 8px; height: 150px; border-radius: 10px; overflow: hidden; }

/* ---------- Preguntas ---------- */
.pregunta { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; margin: 12px 0; }
.pregunta-texto { font-weight: 700; margin-bottom: 8px; }
.opciones { display: grid; gap: 8px; margin-top: 10px; }
.opciones-codigo { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.opcion {
  display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; min-height: 48px; padding: 10px 12px;
  border-radius: 12px; border: 2px solid var(--borde); background: #fff; color: var(--texto); font: inherit; cursor: pointer;
}
.opcion:hover:not(:disabled) { border-color: var(--primario); }
.opcion-letra { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--superficie-3); display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.opcion.elegida { border-color: var(--primario); }
.opcion.correcta { border-color: var(--exito-claro); background: var(--exito-suave); }
.opcion.correcta .opcion-letra { background: var(--exito-claro); color: #fff; }
.opcion.incorrecta { border-color: var(--error); background: var(--error-suave); }
.opcion.incorrecta .opcion-letra { background: var(--error); color: #fff; }
.opcion:disabled { cursor: default; opacity: 1; }
.retro { margin-top: 10px; padding: 10px 14px; border-radius: 10px; }
.retro-ok { background: var(--exito-suave); color: #135f30; }
.retro-no { background: var(--error-suave); color: #8f1d1d; }
.docente-nota { margin-top: 8px; color: var(--aviso); font-weight: 700; }
.caja-prediccion { margin-bottom: 14px; }
.primm { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 6px 0 14px; counter-reset: primm; }
.primm li { padding: 5px 12px; border-radius: 999px; background: var(--superficie-3); color: var(--texto-tenue); font-size: .88rem; }
.primm li.activo { background: var(--primario-suave); color: var(--primario); }
.investigar, .modificar { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px 18px; margin-top: 16px; }
.modificar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.modificar p { margin: 0; }

/* ---------- Visor de ejemplos ---------- */
.visor { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; margin: 14px 0; }
.visor-izq { position: relative; min-height: 360px; border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; display: flex; background: #F8F9FC; }
.visor-izq .blockly-div { position: absolute; inset: 0; }
.visor-izq .editor { border-radius: 12px; }
.visor-der { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.visor-der .panel-python-cont { border: 1px solid var(--borde); border-radius: 12px; max-height: 220px; overflow: auto; background: #fff; }
.visor-controles { display: flex; gap: 8px; flex-wrap: wrap; }
.visor-abajo { display: flex; flex-direction: column; gap: 8px; }
.visor-abajo .consola { height: 170px; border-radius: 12px; }
.visor-abajo .variables { display: none; max-height: 190px; overflow: auto; border: 1px solid var(--borde); border-radius: 12px; }
.visor.paso-activo .visor-abajo .variables { display: block; }
@media (max-width: 820px) { .visor { grid-template-columns: 1fr; } .visor-izq { min-height: 300px; } }

/* ---------- Micro-retos, niveles, proyectos, extra ---------- */
.lista-micro { display: grid; gap: 10px; }
.tarjeta-micro {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--borde); border-radius: var(--radio);
  text-decoration: none; color: var(--texto); background: #fff; box-shadow: var(--sombra);
}
.tarjeta-micro:hover { border-color: var(--primario); }
.tm-num { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; background: var(--primario-suave); color: var(--primario); }
.tarjeta-micro.hecho .tm-num { background: var(--exito-claro); color: #fff; }
.tm-cuerpo { flex: 1; display: flex; flex-direction: column; }
.tm-ir { font-weight: 800; color: var(--primario); white-space: nowrap; }
.niveles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
.tarjeta-nivel {
  display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--radio); text-decoration: none; color: var(--texto);
  background: #fff; border: 2px solid var(--borde); box-shadow: var(--sombra); transition: transform .12s;
}
.tarjeta-nivel:hover { transform: translateY(-2px); }
.tarjeta-nivel .btn { margin-top: auto; align-self: flex-start; }
.tarjeta-nivel.nivel-explorador { border-top: 6px solid #2BB673; }
.tarjeta-nivel.nivel-programador { border-top: 6px solid var(--primario); }
.tarjeta-nivel.nivel-maestro { border-top: 6px solid #F59E0B; }
.tarjeta-nivel.hecho { background: #FAFFFB; }
.tn-cabeza { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tn-ok { color: var(--exito); font-weight: 800; font-size: .85rem; margin-left: auto; }
.opciones-proyecto { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 14px 0; }
.tarjeta-proyecto { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--radio); background: #fff; border: 2px solid var(--borde); text-decoration: none; color: var(--texto); box-shadow: var(--sombra); }
.tarjeta-proyecto:hover { border-color: var(--primario); }
.tarjeta-proyecto .btn { margin-top: auto; align-self: flex-start; }
.tp-icono { font-size: 2rem; }
.tarjeta-extra { display: flex; gap: 16px; align-items: flex-start; padding: 18px; border-radius: var(--radio); background: linear-gradient(135deg, #FFF8E1, #FFF); border: 2px solid #F6D57A; }
.te-icono { font-size: 2.4rem; }
.tarea { margin: 8px 0 12px; }
.tarea-nivel { padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; }
.tarea-nivel.nivel-maestro { background: #FFF4DE; }
.tarea-nivel.nivel-explorador { background: #E9F8F0; }
.tarea-nivel.nivel-programador { background: var(--primario-suave); }
.requisitos-caja { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
.requisitos { list-style: none; padding: 0; margin: 6px 0 0; }
.requisitos li { padding: 3px 0 3px 28px; position: relative; }
.requisitos li::before { content: "○"; position: absolute; left: 4px; color: var(--texto-tenue); font-weight: 800; }
.requisitos li.ok::before { content: "✓"; color: var(--exito); }
.requisitos li.no::before { content: "✗"; color: var(--error); }
.requisitos li.ok { color: var(--exito); }
.requisitos.grande li { font-size: 1.02rem; padding-top: 6px; padding-bottom: 6px; }
.ejemplo-ejecucion .codigo { margin-top: 4px; }

/* ---------- Cierre, pruebas, coevaluación ---------- */
.autoeval { border: 1px solid var(--borde); border-radius: 12px; padding: 10px 14px; margin: 8px 0; background: var(--superficie-2); }
.autoeval summary { cursor: pointer; font-weight: 700; }
.autoeval-resp { margin-top: 8px; color: var(--texto-suave); }
.ticket { border: 2px dashed var(--primario); border-radius: var(--radio); padding: 4px 14px 14px; background: #FBFBFF; }
.ticket-comentario { margin-top: 8px; }
.resumen-sesion { margin-top: 24px; padding: 18px; border-radius: var(--radio); background: var(--superficie-2); border: 1px solid var(--borde); }
.resumen-sesion .insignia-item { flex-direction: row; width: auto; gap: 10px; text-align: left; font-size: .92rem; margin: 10px 0; }
.prueba-progreso { font-weight: 700; color: var(--texto-suave); margin-bottom: 8px; }
.prueba-progreso .barra-progreso { background: var(--superficie-3); max-width: none; margin-top: 6px; }
.prueba-progreso .barra-relleno { background: var(--primario); }
.resultado-prueba { text-align: center; padding: 20px; }
.puntaje-grande { font-size: 3.4rem; font-weight: 800; color: var(--primario); line-height: 1; }
.puntaje-grande small { font-size: 1.4rem; color: var(--texto-tenue); }
.comparacion-pruebas { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 14px; background: var(--superficie-2); border-radius: var(--radio); margin: 10px auto; max-width: 480px; }
.comparacion-pruebas small { display: block; color: var(--texto-suave); }
.comparacion-pruebas strong { font-size: 1.4rem; }
.comparacion-pruebas .avance { color: var(--exito); font-weight: 800; font-size: 1.2rem; }
.repaso-prueba summary { cursor: pointer; font-weight: 800; padding: 8px 0; }
.repaso-item { border-left: 4px solid var(--borde); padding: 6px 12px; margin: 10px 0; }
.repaso-item.ok { border-color: var(--exito-claro); }
.repaso-item.no { border-color: var(--error); }
.coeval-criterio { margin: 14px 0; }
.coeval-opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 6px; }
.coeval-op { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px; border-radius: 10px; border: 2px solid var(--borde); background: #fff; cursor: pointer; font: inherit; font-size: .88rem; color: var(--texto); }
.coeval-op.elegida { border-color: var(--primario); background: var(--primario-suave); }
.plan-clase, .rubrica { margin-top: 18px; border: 1px solid #F3D9A7; background: #FFFBF2; border-radius: var(--radio); padding: 12px 16px; }
.plan-clase summary, .rubrica summary { cursor: pointer; font-weight: 800; color: var(--aviso); }
.momentos li { margin: 6px 0; }
.tabla-rubrica td { font-size: .86rem; }
.tabla-cal td:last-child { text-align: right; font-weight: 800; }
.tabla-cal tr.total td { font-size: 1.1rem; border-top: 2px solid var(--borde-fuerte); }
.tabla-grupo td, .tabla-grupo th { white-space: nowrap; font-size: .85rem; }

/* ---------- Taller ---------- */
.taller { display: flex; flex-direction: column; height: 100%; background: var(--superficie-2); }
.taller-cabeza {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  padding: 8px 12px; background: var(--superficie); border-bottom: 1px solid var(--borde);
}
.taller-titulo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.taller-titulo h2 { margin: 0; font-size: 1.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.taller-etiqueta { font-size: .76rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--texto-tenue); }
.taller-controles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.controles-paso { flex-basis: 100%; display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.selector-modo { display: inline-flex; background: var(--superficie-3); border-radius: 11px; padding: 3px; gap: 2px; }
.modo-btn { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; padding: 6px 9px; border-radius: 8px; font-weight: 700; font-size: .82rem; color: var(--texto-suave); cursor: pointer; min-height: 34px; }
.modo-btn .modo-num { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #fff; font-size: .75rem; font-weight: 800; }
.modo-btn.activo { background: #fff; color: var(--primario); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.modo-btn.activo .modo-num { background: var(--primario); color: #fff; }
.modo-btn:disabled { opacity: .35; cursor: not-allowed; }
@media (max-width: 1180px) { .modo-btn .modo-nombre { display: none; } }

.taller-enunciado {
  display: none; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; padding: 12px 18px;
  max-height: 36vh; overflow-y: auto; background: var(--superficie); border-bottom: 1px solid var(--borde);
}
.taller-enunciado.abierto { display: grid; }
.taller-enunciado > *, .enunciado-principal > *, .enunciado-lado > * { min-width: 0; }
.taller-titulo > div { min-width: 0; }
.taller-enunciado .historia { margin-bottom: 6px; }
.taller-enunciado .tarea { margin: 4px 0 8px; }
.enunciado-lado { display: flex; flex-direction: column; gap: 10px; }
.modo-explicacion { background: var(--primario-suave); border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
.pistas { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.pista { background: #FFF8E1; border: 1px solid #F3DD95; border-radius: 10px; padding: 8px 12px; font-size: .92rem; width: 100%; }
.pista-num { display: block; font-weight: 800; font-size: .76rem; text-transform: uppercase; color: #9A6B00; }
.pista code { background: #fff; padding: 0 4px; border-radius: 4px; }
.fichas-taller summary { cursor: pointer; font-weight: 800; color: var(--texto-suave); }
.fichas-taller .ficha-mini { margin-top: 8px; }
@media (max-width: 820px) { .taller-enunciado { grid-template-columns: 1fr; max-height: 45vh; } }

.taller-pestanas { display: none; gap: 4px; padding: 6px 8px; background: var(--superficie); border-bottom: 1px solid var(--borde); }
.taller-pestana { flex: 1; border: 1px solid var(--borde); background: var(--superficie-2); border-radius: 9px; padding: 8px; font-weight: 700; font-size: .88rem; cursor: pointer; color: var(--texto-suave); }
.taller-pestana.activo { background: var(--primario); border-color: var(--primario); color: #fff; }

.taller-cuerpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); }
.taller-trabajo { position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: #F8F9FC; }
.taller.modo-1 .taller-trabajo .blockly-div, .taller.modo-2 .taller-trabajo .blockly-div { position: absolute; inset: 0; }
.editor-cont { flex: 1; min-height: 0; display: flex; }
.taller-lateral { display: grid; grid-template-rows: minmax(140px, 1.05fr) minmax(170px, 1fr); grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; border-left: 1px solid var(--borde); background: var(--superficie); }
.lateral-sup { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.lateral-sup > *, .lateral-inf > *, .taller-trabajo > * { min-width: 0; max-width: 100%; }
.lateral-cabeza { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; font-weight: 800; font-size: .9rem; border-bottom: 1px solid var(--borde); background: var(--superficie-2); flex-wrap: wrap; }
.lateral-cabeza .nota { font-weight: 600; font-size: .78rem; }
.panel-python-cont { flex: 1; min-height: 0; overflow: auto; }
.pista-bloques { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pista-bloques .blockly-div { position: relative; flex: 1; min-height: 120px; }
.pista-nota { margin: 6px 10px; font-size: .82rem; }
.pista-nota.aviso-error { color: var(--error); font-weight: 700; }
.pista-acciones { display: flex; gap: 6px; padding: 6px 8px; flex-wrap: wrap; }
.taller.pista-plegada .taller-lateral { grid-template-rows: auto 1fr; }
.taller.pista-plegada .pista-bloques { display: none; }
.taller.pista-plegada .btn-plegar { transform: rotate(-90deg); }
.btn-plegar { width: 30px; height: 30px; font-size: .9rem; transition: transform .2s; }
.segmentado { display: inline-flex; background: var(--superficie-3); border-radius: 9px; padding: 2px; }
.seg-btn { border: 0; background: transparent; padding: 4px 9px; border-radius: 7px; font-weight: 700; font-size: .8rem; color: var(--texto-suave); cursor: pointer; }
.seg-btn.activo { background: #fff; color: var(--primario); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.lateral-inf { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-top: 1px solid var(--borde); }
.sub-pestanas { display: flex; gap: 2px; padding: 4px 6px 0; background: var(--superficie-2); border-bottom: 1px solid var(--borde); }
.sub-pestana { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px 8px 0 0; font-weight: 700; font-size: .85rem; color: var(--texto-suave); cursor: pointer; }
.sub-pestana.activo { background: var(--superficie); color: var(--texto); box-shadow: 0 -1px 0 var(--borde) inset; }
.sub-panel { display: none; flex: 1; min-height: 0; overflow: auto; }
.sub-panel.activo { display: flex; flex-direction: column; }
.sub-consola .consola { flex: 1; border-radius: 0; }
.sub-resultados { padding: 10px 12px; }
.taller.paso-activo .sub-pestanas { display: none; }
.taller.paso-activo .sub-consola, .taller.paso-activo .sub-vars { display: flex; flex-direction: column; flex: 1 1 50%; }
.taller.paso-activo .sub-resultados { display: none; }

.taller.angosto .taller-cuerpo { grid-template-columns: minmax(0, 1fr); }
.taller.angosto .taller-pestanas { display: flex; }
.taller.angosto .taller-lateral { border-left: 0; }
.taller.angosto[data-vista="trabajo"] .taller-lateral { display: none; }
.taller.angosto[data-vista="sup"] .taller-trabajo, .taller.angosto[data-vista="sup"] .lateral-inf { display: none; }
.taller.angosto[data-vista="inf"] .taller-trabajo, .taller.angosto[data-vista="inf"] .lateral-sup { display: none; }
.taller.angosto[data-vista="sup"] .taller-lateral, .taller.angosto[data-vista="inf"] .taller-lateral { grid-template-rows: minmax(0, 1fr); }
.taller.angosto .taller-titulo h2 { font-size: 1rem; }
.taller.angosto .btn { padding: 6px 10px; font-size: .86rem; }

/* Resultados */
.resultado-ok { background: var(--exito-suave); color: #135f30; border-radius: 10px; padding: 10px 14px; font-weight: 800; margin-bottom: 8px; }
.resultado-no { background: var(--error-suave); color: #8f1d1d; border-radius: 10px; padding: 10px 14px; font-weight: 700; margin-bottom: 8px; }
.resultado-no p { font-weight: 500; margin: 4px 0 0; }
.res-item { padding: 4px 2px; font-weight: 700; font-size: .92rem; }
.res-item.ok { color: var(--exito); }
.res-item.no { color: var(--error); }
.res-prueba { border: 1px solid var(--borde); border-radius: 10px; padding: 8px 12px; margin: 8px 0; background: #fff; }
.res-prueba summary { cursor: pointer; font-weight: 700; font-size: .92rem; }
.res-prueba.ok summary { color: var(--exito); }
.res-prueba.no summary { color: var(--error); }
.res-detalle { white-space: pre-wrap; margin: 8px 0; font-size: .92rem; }
.res-salida-titulo { font-size: .8rem; font-weight: 800; color: var(--texto-tenue); text-transform: uppercase; margin-top: 6px; }
.res-prueba .codigo { max-height: 180px; overflow: auto; font-size: 13px; }

/* ---------- Editor de texto ---------- */
.editor {
  flex: 1; min-height: 0; display: flex; background: #FCFCFF; position: relative;
  font-family: var(--fuente-codigo); font-size: 16px; line-height: 24px; font-variant-ligatures: none;
}
.editor-numeros { flex: none; width: 46px; overflow: hidden; background: #F0F2F8; color: #9AA0B9; text-align: right; position: relative; border-right: 1px solid var(--borde); }
.editor-numeros-capa { padding: 10px 9px 40px 0; will-change: transform; }
.ed-num { height: 24px; font-size: 13px; }
.ed-num.error { color: var(--error); font-weight: 800; }
.ed-num.actual { color: #8a6500; font-weight: 800; }
.editor-area { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.editor-resaltado { position: absolute; top: 0; left: 0; min-width: 100%; padding: 10px 14px 40px; white-space: pre; pointer-events: none; will-change: transform; color: #1E2240; }
.ed-linea { height: 24px; white-space: pre; }
.ed-linea.actual { background: var(--resalte); }
.ed-linea.error { background: var(--error-suave); box-shadow: inset 3px 0 0 var(--error); }
.editor-texto {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; outline: none; resize: none;
  padding: 10px 14px 40px; background: transparent; color: transparent; -webkit-text-fill-color: transparent;
  caret-color: #1E2240; white-space: pre; overflow: auto; font: inherit; line-height: 24px; tab-size: 4;
  font-variant-ligatures: none; letter-spacing: 0; -webkit-overflow-scrolling: touch;
}
.editor-texto::selection { background: rgba(79, 70, 229, .25); }
.editor.solo-lectura .editor-texto { caret-color: transparent; }
.barra-simbolos { display: flex; gap: 4px; padding: 6px 8px; overflow-x: auto; background: var(--superficie); border-top: 1px solid var(--borde); flex: none; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.simbolo { flex: none; min-width: 40px; height: 40px; border-radius: 9px; border: 1px solid var(--borde-fuerte); background: #fff; font-family: var(--fuente-codigo); font-size: 17px; font-weight: 700; color: var(--texto); cursor: pointer; touch-action: manipulation; }
.simbolo:active { background: var(--primario-suave); }

/* ---------- Panel de Python ---------- */
.panel-python { font-family: var(--fuente-codigo); font-size: 15px; line-height: 1.75; padding: 6px 0; font-variant-ligatures: none; }
.pl-linea { display: flex; align-items: baseline; padding: 0 10px 0 0; cursor: pointer; white-space: pre; }
.pl-linea:hover { background: #F4F5FB; }
.pl-num { flex: none; width: 2.6em; padding-right: .9em; text-align: right; color: var(--texto-tenue); font-size: 13px; user-select: none; }
.pl-codigo { white-space: pre; }
.pl-linea.sel { background: var(--seleccion); }
.pl-linea.actual { background: var(--resalte); }
.pl-linea.error { background: var(--error-suave); box-shadow: inset 3px 0 0 var(--error); }
.pl-vacio { padding: 16px; color: var(--texto-tenue); font-family: var(--fuente); font-size: .92rem; }
.pl-hueco {
  font-family: var(--fuente-codigo); font-size: 16px; padding: 1px 6px; margin: 0 1px; min-width: 4ch;
  background: #FFF4B8; border: 2px dashed #C99A00; border-radius: 6px; color: #3d2f00; outline: none;
}
.pl-hueco:focus { border-style: solid; background: #fff; box-shadow: 0 0 0 3px rgba(201, 154, 0, .25); }

/* ---------- Consola ---------- */
.consola {
  background: var(--consola); color: var(--consola-texto); font-family: var(--fuente-codigo); font-size: 15px; line-height: 1.55;
  padding: 10px 12px; overflow: auto; min-height: 80px; height: 100%; font-variant-ligatures: none;
}
.consola-vacia { color: #8D93B5; font-family: var(--fuente); font-size: .9rem; }
.consola-linea { white-space: pre-wrap; word-break: break-word; min-height: 1.55em; display: flex; flex-wrap: wrap; align-items: center; }
.consola-usuario { color: #FFD84D; font-weight: 700; }
.consola-entrada {
  flex: 1; min-width: 120px; font-family: var(--fuente-codigo); font-size: 16px; color: #FFD84D; background: rgba(255, 255, 255, .07);
  border: 0; border-bottom: 2px solid #FFD84D; padding: 3px 6px; outline: none; border-radius: 4px 4px 0 0;
}

 if tu == \"piedra\" and compu == \"tijera\":\n        return \"tu\"\n    if tu == \"papel\" and compu == \"piedra\":\n        return \"tu\"\n    if tu == \"tijera\" and compu == \"papel\":\n        return \"tu\"\n    return \"compu\"\nprint(\"¡Piedra, papel o tijera! Jugamos 3 rondas.\")\nfor ronda in range(1, 4):\n    print(\"Ronda\", ronda)\n    tu = input(\"Elige piedra, papel o tijera: \").lower()\n    while tu not in opciones:\n        tu = input(\"No entendí. Escribe piedra, papel o tijera: \").lower()\n    compu = random.choice(opciones)\n    print(\"La computadora eligió\", compu)\n    resultado = quien_gana(tu, compu)\n    if resultado == \"tu\":\n        puntos_tu = puntos_tu + 1\n        print(\"¡Ganaste la ronda!\")\n    elif resultado == \"compu\":\n        puntos_compu = puntos_compu + 1\n        print(\"La computadora gana la ronda.\")\n    else:\n        print(\"Empate.\")\nprint(\"Marcador final:\", puntos_tu, \"a\", puntos_compu)\nif puntos_tu \u003e puntos_compu:\n    print(\"¡Ganaste el juego!\")\nelif puntos_compu \u003e puntos_tu:\n    print(\"Ganó la computadora. ¡Revancha!\")\nelse:\n    print(\"¡Empate!\")","entradasPrueba":["piedra","papel","tijera"],"azarPrueba":["tijera","tijera","papel"],"prediccion":{"pregunta":"Mira el código (aunque todavía no lo entiendas todo). ¿Qué crees que hace este programa?","opciones":["Un juego de piedra, papel o tijera contra la computadora","Una calculadora","Un dibujo de una tijera","Un chat con un amigo"],"correcta":0,"explicacion":"¡Exacto! Aunque es la primera vez que ves Python, muchas palabras se entienden: input (pedir), random (azar), print (mostrar)."},"investigar":["Busca en el código la palabra \u003ccode\u003erandom\u003c/code\u003e: ¿para qué crees que sirve?","¿Qué pasa si escribes una jugada que no existe, como «lagarto»?","¿Cuántas rondas se juegan? ¿En qué línea se decide?"],"modificar":"Cambia el número de rondas a 5. Pista: busca el bloque \u003ccode\u003erange(1, 4)\u003c/code\u003e."}, ues y en Python","codigo":"# Mi primer programa\nprint(\"¡Hola, mundo!\")\nprint(\"Me llamo Robi\")\nprint(12)","nota":"Cada bloque es una línea de Python. El comentario (la nota gris) no aparece en la pantalla."},{"tipo":"titulo","texto":"Texto con comillas, números sin comillas"},{"tipo":"texto","html":"Lo que va entre comillas se muestra \u003cb\u003etal cual\u003c/b\u003e. Prueba este programa: ¿por qué las dos últimas líneas muestran cosas distintas?"},{"tipo":"codigo","codigo":"print(\"Hola\")\nprint(\"5 + 3\")\nprint(5 + 3)","nota":"Con comillas es un texto; sin comillas Python hace la cuenta."},{"tipo":"texto","html":"En un mismo \u003ccode\u003eprint()\u003c/code\u003e puedes poner varias piezas separadas por comas. Python las muestra en un renglón, con un espacio entre ellas:"},{"tipo":"codigo","codigo":"print(\"Tengo\", 12, \"años\")"}],"fichas":[{"titulo":"Mostrar en pantalla","codigo":"print(\"Hola\")","nota":"El texto va entre comillas dobles \u003ccode\u003e\"\u003c/code\u003e."},{"titulo":"Varias piezas","codigo":"print(\"Tengo\", 12, \"años\")","nota":"Las comas separan las piezas y agregan un espacio."},{"titulo":"Comentario","codigo":"# Esto es una nota para personas","nota":"Python ignora todo lo que va después de \u003ccode\u003e#\u003c/code\u003e."},{"titulo":"Renglón vacío","codigo":"print()","nota":"Sin nada adentro, deja un renglón en blanco."}],"glosario":[{"en":"print","es":"imprimir, mostrar","def":"Muestra en la consola lo que va entre paréntesis."},{"en":"string (str)","es":"cadena de texto","def":"Un texto entre comillas, como \u003ccode\u003e\"Hola\"\u003c/code\u003e."},{"en":"comment","es":"comentario","def":"Nota para personas que empieza con \u003ccode\u003e#\u003c/code\u003e. Python no la ejecuta."},{"en":"console","es":"consola","def":"La zona donde aparecen los resultados del programa."},{"en":"sequence","es":"secuencia","def":"Instrucciones que se ejecutan una tras otra, en orden."}],"ejemplo":{"titulo":"La tarjeta de Robi","de es ____ años». Pones una \u003ccode\u003ef\u003c/code\u003e antes de las comillas y escribes el nombre de las variables entre llaves \u003ccode\u003e{ }\u003c/code\u003e; Python rellena los espacios."},{"tipo":"bloques","codigo":"nombre = \"Ana\"\nedad = 12\nprint(f\"Hola, {nombre}, tienes {edad} años\")","alto":150,"nota":"Dentro de las llaves también puedes poner cuentas o métodos: \u003ccode\u003e{edad + 1}\u003c/code\u003e, \u003ccode\u003e{nombre.upper()}\u003c/code\u003e."},{"tipo":"texto","html":"Tres formas de mostrar lo mismo:\u003cbr\u003e\u003ccode\u003eprint(\"Hola,\", nombre)\u003c/code\u003e → con comas (pone espacios)\u003cbr\u003e\u003ccode\u003eprint(\"Hola, \" + nombre)\u003c/code\u003e → con + (tú pones los espacios; solo une textos)\u003cbr\u003e\u003ccode\u003eprint(f\"Hola, {nombre}\")\u003c/code\u003e → con f-string"}],"fichas":[{"titulo":"Unir textos","codigo":"saludo = \"Hola, \" + nombre"},{"titulo":"Largo de un texto","codigo":"n = len(nombre)"},{"titulo":"Mayúsculas y minúsculas","codigo":"grito = nombre.upper()\nsuave = nombre.lower()\nbonito = nombre.title()"},{"titulo":"f-string","codigo":"print(f\"{nombre} tiene {edad} años\")","nota":"La \u003ccode\u003ef\u003c/code\u003e va antes de las comillas."}],"glosario":[{"en":"string","es":"cadena de texto","def":"Un texto entre comillas."},{"en":"concatenation","es":"concatenación","def":"Unir textos con \u003ccode\u003e+\u003c/code\u003e."},{"en":"len (length)","es":"largo, longitud","def":"Cuántos caracteres tiene un texto."},{"en":"upper / lower","es":"mayúsculas / minúsculas","def":"Métodos que cambian las letras."},{"en":"method","es":"método","def":"Acción de un valor que se escribe con punto: \u003ccode\u003etexto.upper()\u003c/code\u003e."},{"en":"f-string","es":"cadena con formato","def":"Texto que empieza con \u003ccode\u003ef\u003c/code\u003e y reemplaza lo que va entre \u003ccode\u003e{ }\u003c/code\u003e."}],"ejemplo":{"titulo":"El nombre de Valentina","descripcion":"¿Cuántas f re el tema que más le guste. Al final, el programa dirá cuántos puntos sacó quien lo jugó.","objetivos":["Integrar lo aprendido: \u003ccode\u003einput()\u003c/code\u003e, variables, comparaciones, \u003ccode\u003eif\u003c/code\u003e/\u003ccode\u003eelif\u003c/code\u003e/\u003ccode\u003eelse\u003c/code\u003e.","Usar un \u003cb\u003econtador\u003c/b\u003e de puntos que aumenta con cada respuesta correcta.","Planear un programa por partes antes de programarlo (descomposición)."],"teoria":[{"tipo":"texto","html":"Un proyecto grande se arma por partes. Antes de arrastrar bloques, piensa en los pasos (esto se llama \u003cb\u003edescomposición\u003c/b\u003e):"},{"tipo":"texto","html":"\u003col\u003e\u003cli\u003eCrear la variable \u003ccode\u003epuntaje = 0\u003c/code\u003e.\u003c/li\u003e\u003cli\u003ePara cada pregunta: pedir la respuesta con \u003ccode\u003einput()\u003c/code\u003e, compararla con la correcta y, si acierta, sumar 1 al puntaje.\u003c/li\u003e\u003cli\u003eAl final, mostrar el puntaje.\u003c/li\u003e\u003cli\u003eMostrar un mensaje según el puntaje usando \u003ccode\u003eif\u003c/code\u003e/\u003ccode\u003eelif\u003c/code\u003e/\u003ccode\u003eelse\u003c/code\u003e.\u003c/li\u003e\u003c/ol\u003e"},{"tipo":"bloques","titulo":"Una pregunta completa","codigo":"respuesta = input(\"¿Cuántas patas tiene una araña? \")\nif respuesta == \"8\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, son 8\")","alto":220,"nota":"Repite este patrón para cada pregunta. Recuerda crear \u003ccode\u003epuntaje = 0\u003c/code\u003e al principio."},{"tipo":"analogia","icono":"🧮","titulo":"El contador es como el marcador de un partido","html":"Empieza en 0 y cada gol suma 1: \u003ccode\u003epuntaje = puntaje + 1\u003c/code\u003e. Al final del partido, el marcador dice el resultado."},{"tipo":"titulo","texto":"Trucos para un mejor quiz"},{"tipo":"texto","html":"\u003cul\u003e\u003cli\u003eCon \u003ccode\u003e.lower()\u003c/code\u003e aceptas respuestas en mayúsculas o minúsculas: \u003ccode\u003einput(...).lower()\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eSi hay dos respuestas válidas, usa \u003ccode\u003eor\u003c/code\u003e: \u003ccode\u003eif r == \"cdmx\" or r == \"ciudad de méxico\":\u003c/code\u003e\u003c/li\u003e\u003cli\u003ePara el mensaje final usa rangos: \u003ccode\u003eif puntaje == 5:\u003c/code\u003e … \u003ccode\u003eelif puntaje \u003e= 3:\u003c/code\u003e … \u003ccode\u003eelse:\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e"}],"fichas":[{"titulo":"Contador de puntos","codigo":"puntaje = 0\npuntaje = puntaje + 1"},{"titulo":"Aceptar mayúsculas","codigo":"r = input(\"¿Color del cielo? \").lower()"},{"titulo":"Mensaje final","codigo":"if puntaje == 5:\n    print(\"¡Perfecto!\")\nelif puntaje \u003e= 3:\n    print(\"¡Bien!\")\nelse:\n    print(\"Sigue practicando\")"}],"glosario":[{"en":"project","es":"proyecto","def":"Programa más grande que integra varias ideas."},{"en":"decomposition","es":"descomposición","def":"Dividir un problema en partes más pequeñas."},{"en":"score","es":"puntaje, marcador","def":"Variable que cuenta los puntos."},{"en":"bug","es":"error (bicho)","def":"Un error en el programa. Arreglarlo se llama «depurar» (debug)."}],"ejemplo":{"titulo":"Un quiz de dos preguntas","descripcion":"Estudia este quiz corto: tu proyecto tendrá la misma estructura, pero con 5 preguntas.","codigo":"puntaje = 0\nrespuesta = input(\"¿Capital de México? \").lower()\nif respuesta == \"cdmx\" or respuesta == \"ciudad de méxico\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es la Ciudad de México\")\nrespuesta = input(\"¿Cuánto es 7 x 8? \")\nif respuesta == \"56\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es 56\")\nprint(\"Tu puntaje:\", puntaje, \"de 2\")","entradasPrueba":["CDMX","54"],"prediccion":{"pregunta":"Si respondes \u003cb\u003eCDMX\u003c/b\u003e (en mayúsculas) y \u003cb\u003e54\u003c/b\u003e, ¿qué puntaje se muestra?","opciones":["1","2","0","Error"],"correcta":0,"explicacion":"\u003ccode\u003e.lower()\u003c/code\u003e convierte «CDMX» en «cdmx», así que la primera es correcta. 54 no es 56: puntaje 1."},"investigar":["¿Para qué sirve el \u003ccode\u003e.lower()\u003c/code\u003e de la primera pregunta?","¿Por qué la segunda pregunta compara con \u003ccode\u003e\"56\"\u003c/code\u003e entre comillas?","¿En qué línea aumenta el puntaje?"],"modificar":"Agrega una tercera pregunta y cambia el mensaje final a «de 3»."},"microretos":[{"id":"s07-m1","titulo":"Calentamiento: una pregunta","resumen":"Una pregunta que suma puntos.","enunciado":"Completa la pregunta: si la respuesta es \u003ccode\u003eazul\u003c/code\u003e, muestra \u003ccode\u003e¡Correcto!\u003c/code\u003e y suma 1 al puntaje. Al final se muestra \u003ccode\u003ePuntaje: 1\u003c/code\u003e o \u003ccode\u003ePuntaje: 0\u003c/code\u003e.","inicio":"puntaje = 0\nrespuesta = input(\"¿De qué color es el cielo despejado? \").lower()\nif «»:\n    print(\"¡Correcto!\")\n    puntaje = «»\nelse:\n    print(\"Incorrecto\")\nprint(\"Puntaje:\", puntaje)","requiere":["acumula"],"pruebas":[{"nombre":"azul","entradas":["azul"],"contiene":["Correcto","Puntaje: 1"]},{"nombre":"AZUL","entradas":["AZUL"],"contiene":["Correcto","Puntaje: 1"]},{"nombre":"verde","entradas":["verde"],"contiene":["Incorrecto","Puntaje: 0"]}],"solucion":"puntaje = 0\nrespuesta = input(\"¿De qué color es el cielo despejado? \").lower()\nif respuesta == \"azul\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto\")\nprint(\"Puntaje:\", puntaje)","pistas":["La condición compara la respuesta con el texto correcto.","Para sumar 1: el valor actual del puntaje más 1.","Los huecos son \u003ccode\u003erespuesta == \"azul\"\u003c/code\u003e y \u003ccode\u003epuntaje + 1\u003c/code\u003e."]}],"reto":{"id":"s07-proyecto","tipo":"proyecto","nombrePaso":"Mini-proyecto","titulo":"Quiz de 5 preguntas con puntaje","historia":"Tu quiz se jugará en el concurso del grupo.","enunciado":"Elige un tema y programa un quiz de \u003cb\u003e5 preguntas\u003c/b\u003e. Cada respuesta correcta suma un punto. Al final, muestra el puntaje y un mensaje según el resultado (por ejemplo: 5 → «¡Perfecto!», 3 o 4 → «¡Bien!», menos de 3 → «Sigue practicando»).","requiere":["input*5","if*5","acumula*5","elif"],"listaCotejo":["Tiene 5 preguntas con input().","Cada pregunta revisa la respuesta con if / else.","Suma puntos con un contador (puntaje = puntaje + 1).","Muestra el puntaje final.","Muestra un mensaje final distinto según el puntaje (if / elif / else).","Funciona sin errores.","Usa nombres de variables claros."],"opciones":[{"id":"mexico","icono":"🇲🇽","titulo":"Quiz de México","resumen":"Geografía, historia y cultura de México.","descripcion":"Quiz de México: la primera pregunta ya está hecha como ejemplo. Agrega 4 preguntas más con la misma estructura y el mensaje final.","inicio":"# Quiz de México\npuntaje = 0\n# Pregunta 1\nrespuesta = input(\"¿Cuál es el río más largo de México? \").lower()\nif respuesta == \"bravo\" or respuesta == \"río bravo\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es el río Bravo\")\n# Agrega aquí las preguntas 2 a 5\n# Muestra el puntaje y un mensaje final","solucion":"puntaje = 0\nrespuesta = input(\"¿Cuál es el río más largo de México? \").lower()\nif respuesta == \"bravo\" or respuesta == \"río bravo\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es el río Bravo\")\nrespuesta = input(\"¿Cuántos estados tiene México? \")\nif respuesta == \"32\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, son 32 entidades federativas\")\nrespuesta = input(\"¿En qué año inició la Independencia? \")\nif respuesta == \"1810\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, fue en 1810\")\nrespuesta = input(\"¿Cuál es el volcán más alto de México? \").lower()\nif respuesta == \"pico de orizaba\" or respuesta == \"citlaltépetl\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es el Pico de Orizaba\")\nrespuesta = input(\"¿Qué animal aparece en la bandera? \").lower()\nif respuesta == \"águila\" or respuesta == \"aguila\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es un águila\")\nprint(\"Tu puntaje:\", puntaje, \"de 5\")\nif puntaje == 5:\n    print(\"¡Perfecto!\")\nelif puntaje \u003e= 3:\n    print(\"¡Bien!\")\nelse:\n    print(\"Sigue practicando\")","entradasPrueba":["bravo","32","1810","pico de orizaba","aguila"]},{"id":"ciencias","icono":"🔬","titulo":"Quiz de ciencias","resumen":"Planetas, cuerpo humano, animales…","descripcion":"Quiz de ciencias: la estructura ya está planeada con comentarios. Escribe las 5 preguntas, súmale puntos y agrega el mensaje final.","inicio":"# Quiz de ciencias\npuntaje = 0\n# Pregunta 1: ¿Qué planeta es el más cercano al Sol?\n# Pregunta 2: ¿Cuántos huesos tiene el cuerpo humano adulto?\n# Pregunta 3: ¿Qué gas respiramos para vivir?\n# Pregunta 4: ¿Cuál es el animal terrestre más rápido?\n# Pregunta 5: ¿A cuántos grados hierve el agua?\n# Muestra el puntaje y un mensaje final","solucion":"puntaje = 0\nr = input(\"¿Qué planeta es el más cercano al Sol? \").lower()\nif r == \"mercurio\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es Mercurio\")\nr = input(\"¿Cuántos huesos tiene el cuerpo humano adulto? \")\nif r == \"206\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, son 206\")\nr = input(\"¿Qué gas respiramos para vivir? \").lower()\nif r == \"oxígeno\" or r == \"oxigeno\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es el oxígeno\")\nr = input(\"¿Cuál es el animal terrestre más rápido? \").lower()\nif r == \"guepardo\" or r == \"chita\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, es el guepardo\")\nr = input(\"¿A cuántos grados Celsius hierve el agua? \")\nif r == \"100\":\n    print(\"¡Correcto!\")\n    puntaje = puntaje + 1\nelse:\n    print(\"Incorrecto, a 100 °C\")\nprint(\"Tu puntaje:\", puntaje, \"de 5\")\nif puntaje == 5:\n    print(\"¡Perfecto!\")\nelif puntaje \u003e= 3:\n    print(\"¡Bien!\")\nelse:\n    print(\"Sigue practicando\")","entradasPrueba":["mercurio","200","oxígeno","chita","100"]},{"id":"libre","icono":"🎮","titulo":"Tema libre","resumen":"Videojuegos, deportes, música… ¡tú eliges!","descripcion":"Tema libre: inventa tus 5 preguntas. Planea primero en tu cuaderno las preguntas y sus respuestas.","inicio":"# Mi quiz de: (escribe el tema)\npuntaje = 0\n# Pregunta 1\n# Pregunta 2\n# Pregunta 3\n# Pregunta 4\n# Pregunta 5\n# Muestra el puntaje y un mensaje final"}]},"puente":[{"pregunta":"¿Qué línea de Python corresponde al bloque naranja dentro del if?","bloques":"if respuesta == \"8\":\n    puntaje = puntaje + 1","altoBloques":130,"codigoOpciones":true,"opciones":["puntaje = puntaje + 1","puntaje + 1","puntaje == puntaje + 1","puntaje = 1"],"correcta":0,"explicacion":"El contador se actualiza guardando el valor actual más 1."}],"autoevaluacion":[{"pregunta":"¿Por qué \u003ccode\u003epuntaje = 0\u003c/code\u003e va al principio y no dentro de cada pregunta?","respuesta":"Porque si lo pones en cada pregunta, el puntaje vuelve a 0 y se pierden los puntos anteriores."},{"pregunta":"¿Cómo aceptas «Azul», «AZUL» y «azul» como correctas?","respuesta":"Convirtiendo la respuesta a minúsculas: \u003ccode\u003einput(...).lower()\u003c/code\u003e, y comparando con «azul»."}],"ticket":{"pregunta":"¿Qué número se muestra?","codigo":"puntos = 3\nrespuesta = \"b\"\nif respuesta == \"a\":\n    puntos = puntos + 1\nelse:\n    puntos = puntos - 1\nprint(puntos)","opciones":["2","4","3","b"],"correcta":0,"explicacion":"La respuesta no es «a», así que se ejecut erange()\u003c/code\u003e genera una secuencia de números:\u003cul\u003e\u003cli\u003e\u003ccode\u003erange(5)\u003c/code\u003e → 0, 1, 2, 3, 4\u003c/li\u003e\u003cli\u003e\u003ccode\u003erange(1, 6)\u003c/code\u003e → 1, 2, 3, 4, 5 \u003ci\u003e(empieza en 1, se detiene antes del 6)\u003c/i\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003erange(0, 10, 2)\u003c/code\u003e → 0, 2, 4, 6, 8 \u003ci\u003e(de 2 en 2)\u003c/i\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003erange(5, 0, -1)\u003c/code\u003e → 5, 4, 3, 2, 1 \u003ci\u003e(hacia atrás)\u003c/i\u003e\u003c/li\u003e\u003c/ul\u003e"},{"tipo":"analogia","icono":"🏃","titulo":"Vueltas a la cancha","html":"«Da 5 vueltas a la cancha» es un \u003ccode\u003efor\u003c/code\u003e: sabes de antemano cuántas vueltas darás. La variable \u003ccode\u003ei\u003c/code\u003e es como el contador de vueltas que llevas en la cabeza."},{"tipo":"bloques","codigo":"for i in range(1, 4):\n    print(\"Vuelta\", i)\nprint(\"¡Terminé!\")","alto":150,"nota":"Lo que tiene sangría se repite; «¡Terminé!» está fuera del for y se muestra una sola vez."},{"tipo":"titulo","texto":"Figuras con *"},{"tipo":"texto","html":"Un texto multiplicado por un número se repite: \u003ccode\u003e\"*\" * 3\u003c/code\u003e es \u003ccode\u003e\"***\"\u003c/code\u003e. Combinado con un for, puedes dibujar figuras:"},{"tipo":"codigo","codigo":"for i in range(1, 6):\n    print(\"*\" * i)"}],"fichas":[{"titulo":"Repetir n veces","codigo":"for i in range(5):\n    print(\"Hola\")"},{"titulo":"Contar de 1 a 10","codigo":"for i in range(1, 11):\n    print(i)"},{"titulo":"De 2 en 2","codigo":"for i in range(0, 21, 2):\n    print(i)"},{"titulo":"Sin salto de línea","codigo":"print(\"*\", end=\"\")","nota":"\u003ccode\u003eend=\"\"\u003c/code\u003e evita el cambio de renglón."}],"glosario":[{"en":"for","es":"para (cada)","def":"Bucle que repite para cada valor de una secuencia."},{"en":"range","es":"rango","def":"Genera una secuencia de números."},{"en":"iteration","es": \n    if numero \u003c secreto:\n        print(\"Más alto\")\n    elif numero \u003e secreto:\n        print(\"Más bajo\")\n    else:\n        adivinado = True\nprint(\"¡Lo lograste en\", intentos, \"intentos!\")"},"programador":{"descripcion":"Arma el juego completo con bloques. En el modo 2, la condición del \u003ccode\u003ewhile\u003c/code\u003e y los valores se escriben en Python dentro de los huecos ✎.","inicio":"","solucion":"import random\n\nsecreto = random.randint(1, 20)\nintentos = 0\nadivinado = False\n\nwhile not adivinado:\n    numero = int(input(\"Adivina un número del 1 al 20: \"))\n    intentos = intentos + 1\n    if numero \u003c secreto:\n        print(\"Más alto\")\n    elif numero \u003e secreto:\n        print(\"Más bajo\")\n    else:\n        adivinado = True\n\nprint(\"¡Lo lograste en\", intentos, \"intentos!\")"},"maestro":{"enunciado":"limita el juego a \u003cb\u003e5 intentos\u003c/b\u003e. Si se acaban, muestra \u003ccode\u003ePerdiste, el número era 12\u003c/code\u003e (con el número secreto). Si se adivina al primer intento, escribe «1 intento» en singular: \u003ccode\u003e¡Lo lograste en 1 intento!\u003c/code\u003e.","inicio":"","pruebas":[{"nombre":"A la primera","entradas":["7"],"azar":[7],"contiene":["Lo lograste en 1 intento"],"no_contiene":["1 intentos"]},{"nombre":"En 3 intentos","entradas":["10","5","7"],"azar":[7],"contiene":["Más bajo","Más alto","Lo lograste en 3 intentos"]},{"nombre":"Se acaban los intentos","entradas":["1","2","3","4","5"],"azar":[12],"contiene":["Más alto","Más alto","Más alto","Más alto","Más alto","Perdiste","12"],"no_contiene":["Lo lograste"]}],"solucion":"import random\n\nsecreto = random.randint(1, 20)\nintentos = 0\nadivinado = False\n\nwhile not adivinado and intentos \u003c 5:\n    numero = int(input(\"Adivina un número del 1 al 20: \"))\n    intentos = intentos + 1\n    if numero \u003c secreto:\n        print(\"Más alto\")\n    elif numero \u003e secreto:\n        print(\"Más bajo\")\n    else:\n cia","html":"\u003ccode\u003ebreak\u003c/code\u003e es como la puerta de emergencia de un bucle: en cuanto se ejecuta, el bucle termina de inmediato, aunque falten vueltas. Se usa dentro de un \u003ccode\u003eif\u003c/code\u003e: «si ya encontré lo que buscaba, salgo»."},{"tipo":"codigo","codigo":"for i in range(1, 100):\n    if i * i \u003e 50:\n        break\n    print(i, \"al cuadrado es\", i * i)\nprint(\"Me detuve en\", i)","nota":"El bucle podría llegar a 99, pero break lo detiene cuando el cuadrado pasa de 50."},{"tipo":"comparacion","titulo":"De Scratch a Python","filas":[{"scratch":"por siempre … detener este programa","python":"while True:\n    ...\n    if listo:\n        break","nota":"break detiene solo el bucle, no todo el programa."},{"scratch":"cambiar \u003ci\u003etotal\u003c/i\u003e por \u003ci\u003eprecio\u003c/i\u003e","python":"total += precio"}]},{"tipo":"titulo","texto":"Validar datos"},{"tipo":"texto","html":"Validar es revisar que un dato tenga sentido y, si no, volver a pedirlo. Patrón: pide el dato, y \u003cb\u003emientras\u003c/b\u003e sea inválido, avisa y pídelo otra vez."},{"tipo":"codigo","codigo":"edad = int(input(\"Edad: \"))\nwhile edad \u003c 0 or edad \u003e 120:\n    print(\"Edad no válida\")\n    edad = int(input(\"Edad: \"))\nprint(\"Edad registrada:\", edad)"}],"fichas":[{"titulo":"Acumulador","codigo":"total = 0\nfor i in range(5):\n    total += i"},{"titulo":"Salir con break","codigo":"while True:\n    r = input(\"¿Salir? \")\n    if r == \"si\":\n        break"},{"titulo":"Validar","codigo":"n = int(input(\"1 a 10: \"))\nwhile n \u003c 1 or n \u003e 10:\n    n = int(input(\"1 a 10: \"))"}],"glosario":[{"en":"accumulator","es":"acumulador","def":"Variable que va sumando valores dentro de un bucle."},{"en":"break","es":"romper, salir","def":"Termina el bucle inmediatamente."},{"en":"validate","es":"validar","def":"Revisar que un dato sea correcto antes de usarlo."},{"en":"+=","es":"sumar y guardar","def":"\u003ccode\u003ex +=  in range(3):\n    palabras.append(input(\"Palabra: \"))\nprint(palabras[2])\nprint(palabras[1])\nprint(palabras[0])"},"puente":[{"pregunta":"¿Qué línea de Python corresponde a este bloque?","bloques":"mochila.append(\"goma\")","altoBloques":110,"codigoOpciones":true,"opciones":["mochila.append(\"goma\")","append(mochila, \"goma\")","mochila = \"goma\"","mochila[\"goma\"]"],"correcta":0,"explicacion":"append es un método de la lista: va después de un punto."},{"pregunta":"En Scratch pedías \u003cb\u003eelemento 1 de colores\u003c/b\u003e. ¿Cómo se escribe en Python?","codigoOpciones":true,"opciones":["colores[0]","colores[1]","colores(1)","elemento(colores, 1)"],"correcta":0,"explicacion":"Scratch cuenta desde 1; Python desde 0."}],"autoevaluacion":[{"pregunta":"Si una lista tiene 6 elementos, ¿cuál es la posición del último?","respuesta":"5, porque las posiciones van de 0 a 5. En general: \u003ccode\u003elen(lista) - 1\u003c/code\u003e."},{"pregunta":"¿Qué hace \u003ccode\u003ecolores[1] = \"negro\"\u003c/code\u003e?","respuesta":"Reemplaza el segundo elemento de la lista por «negro»."},{"pregunta":"¿Cuándo aparece un IndexError?","respuesta":"Cuando pides una posición que no existe en la lista, por ejemplo \u003ccode\u003elista[10]\u003c/code\u003e en una lista de 3."}],"ticket":{"pregunta":"¿Qué número se muestra?","codigo":"l = [10, 20, 30]\nl.append(40)\nprint(l[1] + l[3])","opciones":["60","50","30","Error"],"correcta":0,"explicacion":"l es [10, 20, 30, 40]; l[1] es 20 y l[3] es 40: 20 + 40 = 60."},"plan":{"activacion":"«¿Qué imprime?»: \u003ccode\u003eprint([\"a\", \"b\", \"c\"][1])\u003c/code\u003e. Muchos responden «a».","ejemplo":"Presenta el modo 3: escribe «La mochila de Robi» en el editor frente al grupo usando la barra de símbolos. Abre el panel 🧩 para mostrar los bloques. Usa la animación de posiciones.","practica":"Micro-retos (días, compras, cambio de jugador) en parejas. Insiste en que la posición empieza en 0.","reto":"Inventario de la mochila. Qu 003ccode\u003ein\u003c/code\u003e da True o False: perfecto para un \u003ccode\u003eif\u003c/code\u003e."},{"tipo":"titulo","texto":"Funciones útiles con listas"},{"tipo":"texto","html":"\u003cul\u003e\u003cli\u003e\u003ccode\u003esum(lista)\u003c/code\u003e → la suma de todos los números\u003c/li\u003e\u003cli\u003e\u003ccode\u003emax(lista)\u003c/code\u003e y \u003ccode\u003emin(lista)\u003c/code\u003e → el mayor y el menor\u003c/li\u003e\u003cli\u003e\u003ccode\u003elen(lista)\u003c/code\u003e → cuántos elementos hay\u003c/li\u003e\u003cli\u003e\u003ccode\u003esum(lista) / len(lista)\u003c/code\u003e → el promedio\u003c/li\u003e\u003cli\u003e\u003ccode\u003erandom.choice(lista)\u003c/code\u003e → un elemento al azar (necesita \u003ccode\u003eimport random\u003c/code\u003e)\u003c/li\u003e\u003c/ul\u003e"},{"tipo":"codigo","codigo":"import random\ncalificaciones = [8, 9, 7, 10]\nprint(\"Promedio:\", sum(calificaciones) / len(calificaciones))\nprint(\"Más alta:\", max(calificaciones))\nequipo = [\"Ana\", \"Beto\", \"Caro\"]\nprint(\"Expone:\", random.choice(equipo))"},{"tipo":"comparacion","titulo":"De Scratch a Python","filas":[{"scratch":"¿\u003ci\u003einvitados\u003c/i\u003e contiene \u003ci\u003eLeo\u003c/i\u003e?","python":"\"Leo\" in invitados"},{"scratch":"repetir (longitud de lista) con un contador","python":"for x in lista:","nota":"En Python no hace falta un contador para recorrer."}]}],"fichas":[{"titulo":"Recorrer","codigo":"for nombre in nombres:\n    print(nombre)"},{"titulo":"Buscar","codigo":"if \"Leo\" in invitados:\n    print(\"Sí vino\")"},{"titulo":"Promedio","codigo":"promedio = sum(lista) / len(lista)"},{"titulo":"Al azar","codigo":"import random\nganador = random.choice(lista)"}],"glosario":[{"en":"iterate (traverse)","es":"recorrer","def":"Visitar cada elemento de una lista, uno por uno."},{"en":"in","es":"en, dentro de","def":"Pregunta si un valor está en una lista o texto."},{"en":"sum","es":"suma","def":"Suma todos los números de una lista ámetro","def":"Variable de la función que recibe un valor al llamarla."},{"en":"argument","es":"argumento","def":"Valor que se le da a la función al llamarla."},{"en":"call","es":"llamar","def":"Usar una función escribiendo su nombre con paréntesis."}],"ejemplo":{"titulo":"Bienvenida al club","descripcion":"Una función que saluda a quien le digas.","codigo":"def saludar(nombre):\n    print(\"¡Hola,\", nombre + \"!\")\n    print(\"Bienvenido al club\")\n\nsaludar(\"Ana\")\nsaludar(\"Luis\")","prediccion":{"pregunta":"¿Cuántos renglones se muestran en total?","opciones":["4","2","3","6"],"correcta":0,"explicacion":"La función muestra 2 renglones y se llama 2 veces: 4 renglones."},"investigar":["Con 👣 Paso a paso: ¿en qué momento entra el programa a la función? Observa la tabla «Dentro de la función».","¿Qué pasa si llamas \u003ccode\u003esaludar()\u003c/code\u003e sin nombre?","¿Qué pasa si mueves las llamadas arriba del \u003ccode\u003edef\u003c/code\u003e?"],"modificar":"Agrega un segundo parámetro \u003ccode\u003eclub\u003c/code\u003e para que el mensaje diga a qué club se da la bienvenida."},"microretos":[{"id":"s13-m1","titulo":"Tu primera función","resumen":"Definir y llamar.","enunciado":"Define la función \u003ccode\u003elinea()\u003c/code\u003e que muestre \u003ccode\u003e----------\u003c/code\u003e (10 guiones) y llámala 3 veces.","inicio":"def linea():\n    ___\n\n# Llama la función 3 veces\n","requiere":["def"],"pruebas":[{"exacto":"----------\n----------\n----------"}],"solucion":"def linea():\n    print(\"----------\")\n\nlinea()\nlinea()\nlinea()","pistas":["Dentro de la función va un print con sangría.","Para llamarla se escribe su nombre con paréntesis, sin sangría, debajo de la definición.","Escribe \u003ccode\u003elinea()\u003c/code\u003e tres veces."]},{"id":"s13-m2","titulo":"El cuadrado","resumen":"Un parámetro.","enunciado":"Define \u003ccode\u003ecuadrado(n)\u003c/code\u003e que muestre \u003ccode\u003eEl cuadrado de 3 es 9\u003c/code\u003e. Ll  el borde mide \u003ccode\u003elen(texto) + 4\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003eLuego pide un nombre, llama \u003ccode\u003esaludo(nombre)\u003c/code\u003e y después \u003ccode\u003emarco(\"Bienvenido \" + nombre)\u003c/code\u003e. Para Ana:\u003cbr\u003e\u003ccode\u003e¡Hola, Ana!\u003c/code\u003e\u003cbr\u003e\u003ccode\u003e******************\u003c/code\u003e\u003cbr\u003e\u003ccode\u003e* Bienvenido Ana *\u003c/code\u003e\u003cbr\u003e\u003ccode\u003e******************\u003c/code\u003e","requiere":["def*2"],"pruebas":[{"nombre":"Ana","entradas":["Ana"],"exacto":"¡Hola, Ana!\n******************\n* Bienvenido Ana *\n******************"},{"nombre":"Luis","entradas":["Luis"],"exacto":"¡Hola, Luis!\n*******************\n* Bienvenido Luis *\n*******************"}],"pistas":["Dos \u003ccode\u003edef\u003c/code\u003e con un parámetro cada uno; en \u003ccode\u003emarco\u003c/code\u003e usa \u003ccode\u003e\"*\" * (len(texto) + 4)\u003c/code\u003e.","Orden: las dos definiciones arriba; abajo, pedir el nombre y llamar las dos funciones.","La línea del medio del marco es \u003ccode\u003eprint(\"* \" + texto + \" *\")\u003c/code\u003e."],"niveles":{"explorador":{"descripcion":"Completa las partes marcadas con ___.","inicio":"def saludo(nombre):\n    print(\"¡Hola, \" + nombre + \"!\")\n\ndef marco(texto):\n    borde = \"*\" * (len(___) + 4)\n    print(borde)\n    print(\"* \" + texto + \" *\")\n    print(___)\n\nnombre = input(\"Nombre: \")\nsaludo(___)\nmarco(\"Bienvenido \" + nombre)","solucion":"def saludo(nombre):\n    print(\"¡Hola, \" + nombre + \"!\")\n\ndef marco(texto):\n    borde = \"*\" * (len(texto) + 4)\n    print(borde)\n    print(\"* \" + texto + \" *\")\n    print(borde)\n\nnombre = input(\"Nombre: \")\nsaludo(nombre)\nmarco(\"Bienvenido \" + nombre)"},"programador":{"inicio":"","solucion":"def saludo(nombre):\n    print(\"¡Hola, \" + nombre + \"!\")\n\ndef marco(texto):\n    borde = \"*\" * (len(texto) + 4)\n    print(borde)\n    print(\"* \" + texto + \" *\")\n    print(borde)\n\nnombre = input(\"Nombre: \")\nsaludo(nombre)\nmarco(\"Bienvenido \" + nombre)"},"maestro":{"enunciado":"agrega a \u003ccode\u003emarco\u003c/code\u003e un segundo parámetro \u003ccode\u003esimbolo\u003c/code\u003e para elegir el carácter del borde, y llama \u003ccode\u003emarco(\"Bienvenido \" + nombre, \"#\")\u003c/code\u003e.","inicio":"","pruebas":[{"nombre":"Ana con #","entradas":["Ana"],"exacto":"¡Hola, Ana!\n##################\n# Bienvenido Ana #\n##################"}],"solucion":"def saludo(nombre):\n    print(\"¡Hola, \" + nombre + \"!\")\n\ndef marco(texto, simbolo):\n    borde = simbolo * (len(texto) + 4)\n    print(borde)\n    print(simbolo + \" \" + texto + \" \" + simbolo)\n    print(borde)\n\nnombre = input(\"Nombre: \")\nsaludo(nombre)\nmarco(\"Bienvenido \" + nombre, \"#\")"}}},"extra":{"id":"s13-extra","titulo":"Rectángulos a la medida","historia":"Un taller de dibujo con símbolos.","enunciado":"Define \u003ccode\u003erectangulo(ancho, alto)\u003c/code\u003e que dibuje un rectángulo de asteriscos. Pide el ancho y el alto y llama la función. Para 4 y 2:\u003cbr\u003e\u003ccode\u003e****\u003c/code\u003e\u003cbr\u003e\u003ccode\u003e****\u003c/code\u003e","inicio":"","requiere":["def","for"],"pruebas":[{"nombre":"4 x 2","entradas":["4","2"],"exacto":"****\n****"},{"nombre":"2 x 3","entradas":["2","3"],"exacto":"**\n**\n**"}],"solucion":"def rectangulo(ancho, alto):\n    for i in range(alto):\n        print(\"*\" * ancho)\n\nancho = int(input(\"Ancho: \"))\nalto = int(input(\"Alto: \"))\nrectangulo(ancho, alto)"},"puente":[{"pregunta":"¿Qué línea de Python corresponde al bloque rosa?","bloques":"def saludar(nombre):\n    print(\"Hola\", nombre)","altoBloques":130,"codigoOpciones":true,"opciones":["def saludar(nombre):","def saludar nombre:","function saludar(nombre):","saludar(nombre):"],"correcta":0,"explicacion":"def, el nombre, los parámetros entre paréntesis y dos puntos."},{"pregunta":"En Scratch, «Mis bloques»
