/* =========================================================================
 * 21-generador.js — De bloques a Python.
 * Además del código, produce un mapa línea ↔ bloque (para resaltar el bloque
 * y su línea a la vez) y la posición de los huecos editables del modo 2.
 * ========================================================================= */
'use strict';

PB.gen = (() => {
  const MARCA_S = '⁣S';                 // marca de inicio de bloque de instrucción
  const H1 = '⁣H', H2 = '⁤', H3 = '⁥';  // marcas de hueco
  const reHueco = /⁣H([^⁤]*)⁤([^⁥]*)⁥/g;

  // Precedencias de Python (menor número = se agrupa antes)
  const O = { ATOMO: 0, LLAMADA: 2, POT: 3, UNARIO: 4, MULT: 5, SUMA: 6, REL: 11, NOT: 12, AND: 13, OR: 14, NADA: 99 };
  const PREC_ARIT = { '+': O.SUMA, '-': O.SUMA, '*': O.MULT, '/': O.MULT, '//': O.MULT, '%': O.MULT, '**': O.POT };

  let G = null;

  function crear() {
    const Gen = Blockly.CodeGenerator || Blockly.Generator;
    G = new Gen('Python');
    G.INDENT = '    ';
    G.init = function () { this.isInitialized = true; };
    G.finish = function (codigo) { return codigo; };
    G.scrubNakedValue = function () { return ''; };
    G.scrub_ = function (bloque, codigo, soloEste) {
      if (bloque.outputConnection) return codigo;
      let r = MARCA_S + bloque.id + '\n' + codigo;
      const sig = bloque.nextConnection && bloque.nextConnection.targetBlock();
      if (sig && !soloEste) r += G.blockToCode(sig);
      return r;
    };

    const F = G.forBlock;

    /** Código de una entrada de valor, con paréntesis solo si hacen falta. */
    function val(b, nombre, externo, asociativo = false) {
      const hijo = b.getInputTargetBlock(nombre);
      if (!hijo) return '___';
      const r = G.blockToCode(hijo);
      if (!r || (Array.isArray(r) && r[0] === '')) return '___';
      let [codigo, interno] = Array.isArray(r) ? r : [r, O.NADA];
      const mismo = interno === externo;
      const necesita = interno > externo || (mismo && !asociativo && interno > O.LLAMADA && interno !== O.NADA);
      if (necesita) codigo = '(' + codigo + ')';
      return codigo;
    }
    const opcional = (b, nombre, externo) => (b.getInputTargetBlock(nombre) ? val(b, nombre, externo) : '');

    function cuerpo(b, nombre = 'DO') {
      let c = G.statementToCode(b, nombre) || '';
      const real = c.split('\n').some(l => {
        const t = l.trim();
        return t && !t.startsWith('#') && !t.startsWith(MARCA_S);
      });
      if (!real) c += G.INDENT + 'pass\n';
      return c;
    }
    const argumentos = (b) => {
      const r = [];
      for (let i = 0; i < (b.n_ || 0); i++) r.push(val(b, 'ARG' + i, O.NADA));
      return r.join(', ');
    };
    const nombreVar = (b) => {
      const campo = b.getField('VAR');
      const v = campo && campo.getVariable && campo.getVariable();
      return v ? v.name : (campo ? campo.getText() : 'x');
    };
    /** Escapa las comillas dobles sin tocar las secuencias \n, \t, etc. */
    function comillasDobles(txt) {
      let r = '';
      for (let k = 0; k < txt.length; k++) {
        const ch = txt[k];
        if (ch === '\\') { r += ch + (txt[k + 1] ?? '\\'); k++; continue; }
        r += ch === '"' ? '\\"' : ch;
      }
      return r;
    }
    function precedenciaTexto(txt) {
      const t = txt.trim();
      if (!t) return O.ATOMO;
      if (/^-?\d+(\.\d+)?$/.test(t) || /^[A-Za-z_][\w.]*(\([^()]*\))?(\[[^\[\]]*\])?$/.test(t) || /^f?"[^"]*"$/.test(t) || /^'[^']*'$/.test(t)) return O.ATOMO;
      return O.NADA;
    }

    F.py_print = b => 'print(' + argumentos(b) + ')\n';
    F.py_input = b => ['input(' + opcional(b, 'PROMPT', O.NADA) + ')', O.LLAMADA];
    F.py_convert = b => [b.getFieldValue('TIPO') + '(' + val(b, 'VALOR', O.NADA) + ')', O.LLAMADA];
    F.py_comment = b => {
      const t = b.getFieldValue('TEXTO').trim();
      return '#' + (t ? ' ' + t : '') + '\n';
    };
    F.py_assign = b => nombreVar(b) + ' = ' + val(b, 'VALOR', O.NADA) + '\n';
    F.py_augassign = b => nombreVar(b) + ' ' + b.getFieldValue('OP') + ' ' + val(b, 'VALOR', O.NADA) + '\n';
    F.py_var = b => [nombreVar(b), O.ATOMO];
    F.py_number = b => {
      const t = b.getFieldValue('NUM');
      return [t, t.startsWith('-') ? O.UNARIO : O.ATOMO];
    };
    F.py_arith = b => {
      const op = b.getFieldValue('OP');
      const p = PREC_ARIT[op];
      const derechaAsoc = op === '**';
      const a = val(b, 'A', p, !derechaAsoc);
      const c = val(b, 'B', p, derechaAsoc);
      return [a + ' ' + op + ' ' + c, p];
    };
    F.py_round = b => {
      const n = opcional(b, 'N', O.NADA);
      return ['round(' + val(b, 'X', O.NADA) + (n ? ', ' + n : '') + ')', O.LLAMADA];
    };
    F.py_compare = b => [val(b, 'A', O.REL) + ' ' + b.getFieldValue('OP') + ' ' + val(b, 'B', O.REL), O.REL];
    F.py_in = b => [val(b, 'A', O.REL) + ' ' + b.getFieldValue('OP') + ' ' + val(b, 'B', O.REL), O.REL];
    F.py_logic = b => {
      const op = b.getFieldValue('OP');
      const p = op === 'and' ? O.AND : O.OR;
      return [val(b, 'A', p, true) + ' ' + op + ' ' + val(b, 'B', p, true), p];
    };
    F.py_not = b => ['not ' + val(b, 'A', O.NOT, true), O.NOT];
    F.py_bool = b => [b.getFieldValue('VALOR'), O.ATOMO];
    F.py_string = b => ['"' + comillasDobles(b.getFieldValue('TEXTO')) + '"', O.ATOMO];
    F.py_fstring = b => ['f"' + comillasDobles(b.getFieldValue('TEXTO')) + '"', O.ATOMO];
    F.py_len = b => ['len(' + val(b, 'X', O.NADA) + ')', O.LLAMADA];
    F.py_str_method = b => [val(b, 'X', O.LLAMADA) + '.' + b.getFieldValue('METODO') + '()', O.LLAMADA];
    F.py_if = b => 'if ' + val(b, 'COND', O.NADA) + ':\n' + cuerpo(b);
    F.py_elif = b => 'elif ' + val(b, 'COND', O.NADA) + ':\n' + cuerpo(b);
    F.py_else = b => 'else:\n' + cuerpo(b);
    F.py_while = b => 'while ' + val(b, 'COND', O.NADA) + ':\n' + cuerpo(b);
    F.py_for = b => 'for ' + nombreVar(b) + ' in ' + val(b, 'ITER', O.NADA) + ':\n' + cuerpo(b);
    F.py_range = b => ['range(' + argumentos(b) + ')', O.LLAMADA];
    F.py_break = () => 'break\n';
    F.py_continue = () => 'continue\n';
    F.py_pass = () => 'pass\n';
    F.py_list = b => ['[' + argumentos(b) + ']', O.ATOMO];
    F.py_index = b => [val(b, 'LISTA', O.LLAMADA) + '[' + val(b, 'INDICE', O.NADA) + ']', O.LLAMADA];
    F.py_index_set = b => val(b, 'LISTA', O.LLAMADA) + '[' + val(b, 'INDICE', O.NADA) + '] = ' + val(b, 'VALOR', O.NADA) + '\n';
    F.py_append = b => val(b, 'LISTA', O.LLAMADA) + '.' + b.getFieldValue('METODO') + '(' + val(b, 'X', O.NADA) + ')\n';
    F.py_func1 = b => [b.getFieldValue('FUNC') + '(' + val(b, 'X', O.NADA) + ')', O.LLAMADA];
    F.py_import = b => 'import ' + b.getFieldValue('MODULO') + '\n';
    F.py_randint = b => ['random.randint(' + val(b, 'A', O.NADA) + ', ' + val(b, 'B', O.NADA) + ')', O.LLAMADA];
    F.py_choice = b => ['random.choice(' + val(b, 'X', O.NADA) + ')', O.LLAMADA];
    F.py_def = b => 'def ' + b.getFieldValue('NOMBRE') + '(' + b.getFieldValue('PARAMS') + '):\n' + cuerpo(b);
    F.py_return = b => {
      const v = opcional(b, 'VALOR', O.NADA);
      return 'return' + (v ? ' ' + v : '') + '\n';
    };
    F.py_call = b => [b.getFieldValue('NOMBRE') + '(' + argumentos(b) + ')', O.LLAMADA];
    F.py_call_stmt = b => b.getFieldValue('NOMBRE') + '(' + argumentos(b) + ')\n';
    F.py_method_call = b => [val(b, 'OBJ', O.LLAMADA) + '.' + b.getFieldValue('NOMBRE') + '(' + argumentos(b) + ')', O.LLAMADA];
    F.py_kwarg = b => [b.getFieldValue('NOMBRE') + '=' + val(b, 'VALOR', O.NADA), O.NADA];
    F.py_expr_stmt = b => val(b, 'VALOR', O.NADA) + '\n';
    F.py_raw_stmt = b => (b.getFieldValue('CODIGO').trim() || 'pass') + '\n';
    F.py_raw_expr = b => {
      const t = b.getFieldValue('CODIGO').trim();
      return [t || '___', precedenciaTexto(t)];
    };
    F.py_raw_block = b => b.getFieldValue('CABECERA').trim().replace(/:$/, '') + ':\n' + cuerpo(b);
    F.py_hueco = b => {
      const t = b.getFieldValue('CODIGO').trim();
      return [H1 + b.id + H2 + t + H3, precedenciaTexto(t)];
    };
  }

  /**
   * Genera el Python de un espacio de trabajo.
   * Devuelve { codigo, lineas: [{texto, segmentos, bloque}], bloqueALinea, lineaABloque, huecos }
   */
  function generar(ws) {
    if (!G) crear();
    let crudo = '';
    try { crudo = G.workspaceToCode(ws); } catch (e) { console.error('Error al generar Python', e); }
    const lineas = [];
    let pendiente = null;
    for (const l of crudo.split('\n')) {
      const t = l.trimStart();
      if (t.startsWith(MARCA_S)) { pendiente = t.slice(MARCA_S.length); continue; }
      const segmentos = [];
      let k = 0, m;
      reHueco.lastIndex = 0;
      while ((m = reHueco.exec(l)) !== null) {
        if (m.index > k) segmentos.push({ texto: l.slice(k, m.index) });
        segmentos.push({ hueco: m[1], texto: m[2] });
        k = m.index + m[0].length;
      }
      if (k < l.length) segmentos.push({ texto: l.slice(k) });
      const texto = segmentos.map(s => (s.hueco !== undefined ? (s.texto || '___') : s.texto)).join('');
      lineas.push({ texto: texto.replace(/\s+$/, ''), segmentos, bloque: pendiente });
      pendiente = null;
    }
    // Limpieza de líneas vacías al inicio, al final y repetidas
    const limpias = [];
    for (const l of lineas) {
      if (!l.texto.trim()) {
        if (!limpias.length || !limpias[limpias.length - 1].texto.trim()) continue;
        limpias.push({ texto: '', segmentos: [], bloque: null });
      } else limpias.push(l);
    }
    while (limpias.length && !limpias[limpias.length - 1].texto.trim()) limpias.pop();

    const bloqueALinea = {}, lineaABloque = {}, huecos = [];
    limpias.forEach((l, i) => {
      if (l.bloque) { bloqueALinea[l.bloque] = i + 1; lineaABloque[i + 1] = l.bloque; }
      for (const s of l.segmentos) if (s.hueco !== undefined) huecos.push({ id: s.hueco, linea: i + 1, texto: s.texto });
    });
    const codigo = limpias.map(l => l.texto).join('\n') + (limpias.length ? '\n' : '');
    return { codigo, lineas: limpias, bloqueALinea, lineaABloque, huecos };
  }

  /** La línea de un bloque cualquiera (si es un valor, la de su instrucción). */
  function lineaDeBloque(resultado, bloque) {
    let b = bloque;
    while (b) {
      if (resultado.bloqueALinea[b.id]) return resultado.bloqueALinea[b.id];
      b = b.getParent();
    }
    return null;
  }

  return { generar, lineaDeBloque, O };
})();

;
/* =========================================================================
 * 22-conversor.js — De Python a bloques.
 * Convierte el árbol de PB.py.analizar en el JSON de Blockly. Así el código
 * inicial de cada reto se escribe en Python y la plataforma lo muestra como
 * bloques; también permite ver como bloques lo que el alumno escribe.
 * ========================================================================= */
'use strict';

PB.conv = (() => {
  const ARIT = new Set(['+', '-', '*', '/', '//', '%', '**']);
  const METODOS_TEXTO = new Set(['upper', 'lower', 'title', 'capitalize', 'strip']);
  const FUNC1 = new Set(['max', 'min', 'sum', 'sorted', 'abs']);

  function aBloques(codigo, opciones = {}) {
    const arbol = PB.py.analizar(codigo);           // puede lanzar ErrorPython
    const cont = { libres: 0, bloqueado: !!opciones.bloquear };
    const primero = cadena(arbol, cont);
    const bloques = primero ? [Object.assign(primero, { x: 24, y: 24 })] : [];
    return { json: { blocks: { languageVersion: 0, blocks: bloques } }, libres: cont.libres };
  }

  function cadena(sentencias, cont) {
    let primero = null, ultimo = null;
    for (const s of sentencias) {
      const b = sentencia(s, cont);
      if (!b) continue;
      if (cont.bloqueado) { b.deletable = false; b.movable = false; }
      if (!primero) primero = b;
      else ultimo.next = { block: b };
      ultimo = b;
    }
    return primero;
  }

  const conCuerpo = (b, cuerpo, cont) => {
    const c = cadena(cuerpo, cont);
    if (c) { b.inputs = b.inputs || {}; b.inputs.DO = { block: c }; }
    return b;
  };

  function entrada(expr, cont) {
    if (!expr || expr.t === 'Blank') return undefined;
    if (expr.t === 'Hueco') return { shadow: { type: 'py_hueco', fields: { CODIGO: expr.texto } } };
    const b = expresion(expr, cont);
    return b ? { block: b } : undefined;
  }

  function conEntradas(tipo, entradas, cont, extra = {}) {
    const b = Object.assign({ type: tipo }, extra);
    for (const [nombre, expr] of Object.entries(entradas)) {
      const e = entrada(expr, cont);
      if (e) { b.inputs = b.inputs || {}; b.inputs[nombre] = e; }
    }
    return b;
  }

  function variadico(tipo, args, kwargs, cont, extra = {}) {
    const todos = args.slice();
    for (const kw of kwargs || []) todos.push({ t: 'Kwarg', nombre: kw.nombre, valor: kw.valor });
    const b = Object.assign({ type: tipo, extraState: { n: todos.length } }, extra);
    todos.forEach((a, i) => {
      const e = entrada(a, cont);
      if (e) { b.inputs = b.inputs || {}; b.inputs['ARG' + i] = e; }

/* =========================================================================
 * 40-ejecutor.js — Ejecuta Python en el navegador con Skulpt.
 *   · interactivo: la consola pide los datos de input()
 *   · paso a paso: pausa en cada línea y muestra las variables
 *   · prueba: entradas y números «al azar» fijos, para el verificador
 * ========================================================================= */
'use strict';

PB.ejecutor = (() => {
  const DETENIDO = '__PB_DETENIDO__';
  const SIN_ENTRADAS = '__PB_SIN_ENTRADAS__';
  const MAX_SALIDA = 60000;

  let ocupado = false;
  let detenerSolicitado = false;
  let rechazarEntrada = null;
  let pasoPendiente = null;     // {continuar, rechazar} cuando está en pausa
  let pausado = false;
  let retardoPaso = 600;

  function disponible() {
    return typeof window.Sk !== 'undefined' && Sk.misceval && Sk.importMainWithBody;
  }

  function leerModulo(nombre) {
    const archivos = (window.PB_STDLIB && window.PB_STDLIB.files) || (Sk.builtinFiles && Sk.builtinFiles.files) || {};
    if (archivos[nombre] === undefined) throw "File not found: '" + nombre + "'";
    return archivos[nombre];
  }

  function reprCorto(v) {
    let r;
    try {
      r = Sk.misceval.objectRepr(v);
      if (typeof r !== 'string') r = r && r.v !== undefined ? r.v : String(r);
    } catch (e) { r = '?'; }
    return r.length > 80 ? r.slice(0, 77) + '…' : r;
  }

  function tipoDe(v) {
    try { return (v.tp$name || (v.ob$type && v.ob$type.tp$name) || '').toString(); } catch (e) { return ''; }
  }

  function leerVariables(dic) {
    const r = [];
    if (!dic) return r;
    for (const k of Object.keys(dic)) {
      if (k.startsWith('__') || k.startsWith('$')) continue;
      const v = dic[k];
      if (v === undefined || v === null) continue;
      const t = tipoDe(v);
      if (t === 'module') continue;
      if (t === 'function') { r.push({ nombre: k, tipo: 'función', valor: k + '()' }); continue; }
      r.push({ nombre: k, tipo: t, valor: reprCorto(v) });
    }
    return r;
  }

  function preludioAzar(azar) {
    const cola = JSON.stringify(azar);
    return 'import random as __pb_r; __pb_q = ' + cola +
      '; __pb_r.randint = lambda a, b: __pb_q.pop(0) if __pb_q else a' +
      '; __pb_r.choice = lambda s: __pb_q.pop(0) if __pb_q else s[0]' +
      '; __pb_r.shuffle = lambda s: None; __pb_r.random = lambda: 0.5\n';
  }

  function extraerError(e, desfase) {
    const texto = String(e && e.toString ? e.toString() : e);
    if (texto.includes(DETENIDO) || detenerSolicitado) return { tipo: 'Detenido', mensaje: '', linea: null, original: '' };
    if (texto.includes(SIN_ENTRADAS)) return { tipo: 'EntradasAgotadas', mensaje: '', linea: null, original: '' };
    let tipo = 'Error', mensaje = texto, linea = null;
    try {
      if (window.Sk && e instanceof Sk.builtin.BaseException) {
        tipo = String(e.tp$name || (e.constructor && e.constructor.tp$name) || 'Error');
        if (e.args && e.args.v && e.args.v.length) {
          const a = e.args.v[0];
          mensaje = a && a.v !== undefined ? String(a.v) : String(a);
        } else mensaje = '';
        if (e.traceback && e.traceback.length) {
          const marco = e.traceback.find(t => t.filename && t.filename.indexOf('<stdin>') === 0) || e.traceback[0];
          linea = marco.lineno;
        }
      } else if (e instanceof Error) {
        tipo = 'ErrorInterno';
        mensaje = e.message;
      }
    } catch (x) { /* nos quedamos con el texto */ }
    if (linea !== null && desfase) linea -= desfase;
    if (linea !== null && linea < 1) linea = null;
    if (tipo === 'TimeoutError' || tipo === 'TimeLimitError') tipo = 'TiempoAgotado';
    return { tipo, mensaje, linea, original: tipo === 'TiempoAgotado' ? 'TimeLimitError: ' + mensaje : (tipo + (mensaje ? ': ' + mensaje : '')) };
  }

  /**
   * Ejecuta código Python.
   * opciones:
   *   entradas: [..]       → modo prueba (si se acaban, error EntradasAgotadas)
   *   azar: [..]           → valores fijos para random.randint / random.choice
   *   alSalida(t)          → cada fragmento impreso (interactivo)
   *   alEntrada(prompt)    → Promise<string> (interactivo)
   *   paso: {retardo, alLinea(linea, vars, locales)} → paso a paso
   *   limiteMs             → tiempo máximo de cálculo
   */
  async function ejecutar(codigo, opciones = {}) {
    if (!disponible()) {
      return { ok: false, salida: '', salidaPantalla: '', error: { tipo: 'SinInterprete', mensaje: '', linea: null, original: '' } };
    }
    if (ocupado) return { ok: false, salida: '', salidaPantalla: '', error: { tipo: 'Ocupado', mensaje: '', linea: null, original: '' } };
    ocupado = true;
    detenerSolicitado = false;
    pausado = false;
    pasoPendiente = null;

    const modoPrueba = Array.isArray(opciones.entradas);
    const entradas = modoPrueba ? opciones.entradas.map(String) : [];
    let usadas = 0;
    let salida = '';            // solo lo que imprime el programa con print (lo que revisan las pruebas)
    let pantalla = '';          // como se vería en la terminal (mensajes de input y lo que se escribió)
    let excesiva = false;

    const azar = opciones.azar && opciones.azar.length ? opciones.azar : null;
    const preludio = azar ? preludioAzar(azar) : '';
    const desfase = preludio ? 1 : 0;
    const fuente = preludio + codigo;
    const limite = opciones.limiteMs || (modoPrueba ? 4000 : 20000);
    retardoPaso = opciones.paso ? (opciones.paso.retardo ?? 600) : 0;

    const escribir = (t) => {
      if (excesiva) return;
      salida += t;
      pantalla += t;
      if (salida.length > MAX_SALIDA) {
        excesiva = true;
        Sk.execLimit = 1;
      }
      if (opciones.alSalida) opciones.alSalida(t);
    };

    const entrada = (prompt) => {
      const p = prompt === undefined || prompt === null ? '' : String(prompt);
      if (p) {
        pantalla += p;
        if (opciones.alSalida) opciones.alSalida(p);
      }
      if (modoPrueba) {
        if (usadas >= entradas.length) return Promise.reject(new Error(SIN_ENTRADAS));
        const v = entradas[usadas++];
        pantalla += v + '\n';
        return Promise.resolve(v);
      }
      return new Promise((resolve, reject) => {
        rechazarEntrada = reject;
        Promise.resolve(opciones.alEntrada ? opciones.alEntrada(p) : '').then(v => {
          rechazarEntrada = null;
          const valor = PB.util.quitarComillasTipograficas(String(v ?? ''));
          pantalla += valor + '\n';
          usadas++;
          Sk.execStart = Date.now();   // el tiempo de escribir no cuenta
          resolve(valor);
        }, err => { rechazarEntrada = null; reject(err); });
      });
    };

    Sk.configure({
      output: escribir,
      read: leerModulo,
      __future__: Sk.python3,
      inputfun: entrada,
      inputfunTakesPrompt: true,
      execLimit: limite,
      yieldLimit: 100,
      // En paso a paso, los bucles también pausan en su encabezado en cada vuelta
      killableWhile: !!opciones.paso,
      killableFor: !!opciones.paso,
      debugging: !!opciones.paso,
      breakpoints: () => true
    });
    Sk.execLimit = limite;
    Sk.execStart = Date.now();

    const manejadores = {};
    if (opciones.paso) {
      let ultimaLinea = null;
      const manejar = (susp) => new Promise((resolve, reject) => {
        if (detenerSolicitado) { reject(new Error(DETENIDO)); return; }
        let s = susp, modulo = null, profundo = null;
        while (s instanceof Sk.misceval.Suspension) {
          if (s.$loc && Object.prototype.hasOwnProperty.call(s.$loc, '__name__')) modulo = s;
          if (s.$lineno) profundo = s;
          s = s.child;
        }
        const linea = profundo ? profundo.$lineno - desfase : null;
        const continuar = () => {
          pasoPendiente = null;
          Sk.execStart = Date.now();
          try { resolve(susp.resume()); } catch (e) { reject(e); }
        };
        // Misma línea dos veces seguidas (encabezado de bucle): no pausar de nuevo
        if (linea === ultimaLinea && !pausado) { setTimeout(continuar, 0); return; }
        ultimaLinea = linea;
        const vars = modulo ? leerVariables(modulo.$loc) : [];
        let locales = null;
        if (profundo && profundo !== modulo && profundo.$tmps) {
          locales = leerVariables(Object.fromEntries(Object.entries(profundo.$tmps).filter(([k]) => !k.startsWith('$'))));
        }
        try { opciones.paso.alLinea(linea, vars, locales); } catch (e) { /* la interfaz no debe romper la ejecución */ }
        pasoPendiente = { continuar, rechazar: reject };
        if (!pausado) setTimeout(() => { if (pasoPendiente && pasoPendiente.continuar === continuar && !pausado) continuar(); }, retardoPaso);
      });
      manejadores['Sk.debug'] = manejar;
      manejadores['Sk.delay'] = manejar;
    }

    let error = null;
    try {
      await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, fuente, true), manejadores);
    } catch (e) {
      error = extraerError(e, desfase);
    }
    if (excesiva) error = { tipo: 'SalidaExcesiva', mensaje: '', linea: null, original: '' };
    ocupado = false;
    rechazarEntrada = null;
    pasoPendiente = null;
    const fueDetenido = error && error.tipo === 'Detenido';
    detenerSolicitado = false;
    return { ok: !error, salida, salidaPantalla: pantalla, error, detenido: fueDetenido, entradasUsadas: usadas };
  }

  function detener() {
    if (!ocupado) return;
    detenerSolicitado = true;
    try { Sk.execLimit = 1; } catch (e) { /* nada */ }
    if (rechazarEntrada) rechazarEntrada(new Error(DETENIDO));
    if (pasoPendiente) pasoPendiente.rechazar(new Error(DETENIDO));
  }

  function pausar(valor) {
    pausado = valor;
    if (!valor && pasoPendiente) pasoPendiente.continuar();
  }

  function siguientePaso() {
    if (pasoPendiente) pasoPendiente.continuar();
  }

  function fijarRetardo(ms) { retardoPaso = ms; }

  return {
    ejecutar, detener, pausar, siguientePaso, fijarRetardo, disponible,
    get ocupado() { return ocupado; },
    get pausado() { return pausado; }
  };
})();

/* =========================================================================
 * 41-errores.js — Explica los errores de Python en español.
 * Siempre muestra también el nombre original del error (SyntaxError,
 * NameError…) para que el alumno aprenda a reconocerlos.
 * ========================================================================= */
'use strict';

PB.errores = (() => {
  const CONFUSIONES = {
    Print: 'print', PRINT: 'print', imprimir: 'print', escribir: 'print', mostrar: 'print', prnt: 'print', pritn: 'print', pint: 'print',
    Input: 'input', imput: 'input', entrada: 'input', leer: 'input', inpt: 'input',
    true: 'True', false: 'False', verdadero: 'True', falso: 'False', none: 'None',
    Int: 'int', entero: 'int', Float: 'float', Str: 'str', Len: 'len', lenght: 'len', length: 'len',
    Range: 'range', rango: 'range', si: 'if', mientras: 'while', para: 'for', sino: 'else',
    Random: 'random', aleatorio: 'random'
  };

  function nombresDelCodigo(codigo) {
    const c = PB.py.contar(codigo);
    return Object.keys(c.nombres || {});
  }

  function lineaDeAsignacion(codigo, nombre) {
    try {
      const { toks } = PB.py.tokenizar(codigo);
      for (let k = 0; k < toks.length - 1; k++) {
        const t = toks[k];
        if (t.tipo === 'NAME' && t.valor === nombre) {
          const s = toks[k + 1];
          const ant = toks[k - 1];
          if (s.tipo === 'OP' && (s.valor === '=' || s.valor === '+=')) return t.linea;
          if (ant && ant.tipo === 'NAME' && (ant.valor === 'for' || ant.valor === 'def')) return t.linea;
        }
      }
    } catch (e) { /* nada */ }
    return null;
  }

  function sugerencia(nombre, codigo) {
    if (CONFUSIONES[nombre]) return CONFUSIONES[nombre];
    const candidatos = new Set([...nombresDelCodigo(codigo), ...PB.py.FUNCIONES_INTEGRADAS]);
    candidatos.delete(nombre);
    let mejor = null, dist = 3;
    for (const c of candidatos) {
      const d = PB.util.distancia(nombre.toLowerCase(), c.toLowerCase());
      const tope = Math.max(1, Math.floor(Math.min(nombre.length, c.length) / 3));
      if (d < dist && d <= tope) { mejor = c; dist = d; }
    }
    return mejor;
  }

  /**
   * err: {tipo, mensaje, linea, original} de PB.ejecutor
   * Devuelve {tipo, titulo, texto, linea, original}
   */
  function explicar(err, codigo) {
    if (!err) return null;
    const r = { tipo: err.tipo, linea: err.linea, original: err.original || '', texto: '' };
    const m = err.mensaje || '';
    let x;

    switch (err.tipo) {
      case 'SyntaxError': case 'IndentationError': case 'TabError': {
        const diag = PB.py.revisarSintaxis(codigo);
        if (diag) {
          r.tipo = diag.tipo;
          r.linea = diag.linea;
          r.texto = diag.mensaje;
        } else {
          r.texto = 'Python no entiende cómo está escrita esta línea. Revisa que los paréntesis y las comillas cierren, ' +
            'que no falten comas u operadores y que if, for, while y def terminen con dos puntos «:».';
          if (/indent/i.test(m)) {
            r.tipo = 'IndentationError';
            r.texto = 'Hay un problema de sangría (los espacios al inicio de la línea). Las líneas de un mismo bloque deben empezar en la misma columna.';
          }
        }
        break;
      }
      case 'NameError': {
        x = /name '([^']+)' is not defined/.exec(m);
        const nombre = x ? x[1] : '';
        if (nombre === '___') {
          r.texto = 'Todavía hay un hueco «___» sin completar en esta línea. Pon ahí el bloque o el valor que falta.';
          break;
        }
        if (nombre === 'random') {
          r.texto = 'Usas random, pero falta traer el módulo. Agrega «import random» al inicio del programa.';
          break;
        }
        const sug = sugerencia(nombre, codigo);
        const lineaAsig = lineaDeAsignacion(codigo, nombre);
        if (lineaAsig && err.linea && lineaAsig > err.linea) {
          r.texto = `Usas «${nombre}» antes de darle un valor: se crea hasta la línea ${lineaAsig}. En Python primero se guarda el valor y después se usa.`;
        } else if (sug && sug !== nombre) {
          r.texto = `Python no conoce «${nombre}». ¿Quisiste decir «${sug}»? Python distingue mayúsculas y minúsculas, y el nombre debe escribirse exactamente igual.`;
        } else if (nombre && /^[\p{L}_]+$/u.test(nombre) && !lineaAsig) {
          r.texto = `Python no conoce «${nombre}». Si es una variable, primero guárdale un valor (${nombre} = …). Si es un texto, ponlo entre comillas: "${nombre}".`;
        } else {
          r.texto = `Python no conoce el nombre «${nombre}». Revisa cómo está escrito y que tenga un valor antes de usarlo.`;
        }
        break;
      }
      case 'TypeError': {
        if (/concatenate|can only concatenate|for \+: '(int|float)' and 'str'|for \+: 'str' and '(int|float)'/.test(m)) {
          r.texto = 'Estás uniendo con + un texto y un número. Convierte el número en texto con str(), o separa con comas en print: print("Edad:", edad). Si el número viene de input(), recuerda que input() siempre da texto: conviértelo con int() o float().';
        } else if ((x = /unsupported operand type\(s\) for ([^:]+): '(\w+)' and '(\w+)'/.exec(m))) {
          r.texto = `No se puede usar «${x[1].trim()}» entre un valor ${tipoEs(x[2])} y uno ${tipoEs(x[3])}. ¿Algún dato viene de input()? Conviértelo con int() o float() antes de hacer cuentas.`;
        } else if ((x = /'([<>=!]+)' not supported between instances of '(\w+)' and '(\w+)'/.exec(m))) {
          r.texto = `Estás comparando un valor ${tipoEs(x[2])} con uno ${tipoEs(x[3])}. Si el número viene de input(), conviértelo con int() antes de comparar.`;
        } else if ((x = /(\w+)\(\) takes (\d+) positional arguments? but (\d+) (?:were|was) given/.exec(m))) {
          r.texto = `La función ${x[1]}() recibe ${x[2]} valor(es), pero le diste ${x[3]}. Revisa los paréntesis de la llamada.`;
        } else if ((x = /(\w+)\(\) missing (\d+) required positional argument/.exec(m))) {
          r.texto = `A la función ${x[1]}() le falta(n) ${x[2]} valor(es) entre los paréntesis.`;
        } else if (/object is not callable/.test(m)) {
          r.texto = 'Pusiste paréntesis () después de algo que no es una función. ¿Usaste una variable con el mismo nombre que una función (por ejemplo, una variable llamada print o input)?';
        } else if (/not subscriptable/.test(m)) {
          r.texto = 'Usas corchetes [ ] en algo que no es una lista ni un texto.';
        } else if (/'(int|float)' object is not iterable/.test(m)) {
          r.texto = 'for necesita algo que recorrer. Si quieres repetir n veces, usa range(n) en lugar de n.';
        } else if (/indices must be integers/.test(m)) {
          r.texto = 'La posición dentro de una lista o texto debe ser un número entero (int). Si viene de input(), conviértela con int().';
        } else if (/can't multiply sequence by non-int/.test(m)) {
          r.texto = 'Solo se puede multiplicar un texto o una lista por un número entero. ¿Algún valor es texto que debería ser número? Usa int() o float().';
        } else {
          r.texto = 'Estás usando un valor de un tipo que no sirve para esa operación (por ejemplo, texto donde va un número).';
        }
        break;
      }
      case 'ValueError': {
        if ((x = /invalid literal for int\(\) with base 10: '(.*)'/.exec(m))) {
          r.texto = x[1].trim() === ''
            ? 'int() recibió un texto vacío. Escribe un número antes de presionar Enter.'
            : `int() no puede convertir «${x[1]}» en número entero. Si tiene punto decimal usa float(); si es una palabra, escribe un número.`;
        } else if ((x = /could not convert string to float: '(.*)'/.exec(m))) {
          r.texto = `float() no puede convertir «${x[1]}» en número. Escribe un número; para decimales usa punto (2.5), no coma.`;
        } else if (/remove\(x\): x not in list|not in list/.test(m)) {
          r.texto = 'Intentas quitar de la lista un valor que no está en ella. Puedes revisar antes con: if valor in lista:';
        } else {
          r.texto = 'Un valor no tiene la forma que se esperaba.';
        }
        break;
      }
      case 'ZeroDivisionError':
        r.texto = 'No se puede dividir entre cero. Revisa el valor que va después de / , // o %.';
        break;
      case 'IndexError':
        r.texto = 'Pediste una posición que no existe. Recuerda: la primera posición es 0 y la última es len(lista) - 1.';
        break;
      case 'AttributeError':
        if ((x = /'(\w+)' object has no attribute '(\w+)'/.exec(m))) {
          const extra = x[2] === 'append' ? ' append solo funciona con listas.' : (['upper', 'lower', 'title'].includes(x[2]) ? ` .${x[2]}() solo funciona con texto (str).` : '');
          r.texto = `Los valores ${tipoEs(x[1])} no tienen «.${x[2]}».${extra}`;
        } else r.texto = 'Usas un método que ese valor no tiene.';
        break;
      case 'KeyError':
        r.texto = 'Buscas una clave que no existe.';
        break;
      case 'RecursionError': case 'RangeError':
        r.texto = 'Una función se llama a sí misma sin parar.';
        break;
      case 'ImportError': case 'ModuleNotFoundError':
        r.texto = 'Ese módulo no está disponible en la plataforma. En este curso usamos random.';
        break;
      case 'TiempoAgotado':
        r.tipo = 'TimeLimitError';
        r.texto = 'El programa tardó demasiado. ¿Hay un bucle que nunca termina? Revisa que la condición del while llegue a ser False (por ejemplo, que el contador aumente dentro del bucle).';
        break;
      case 'EntradasAgotadas':
        r.tipo = 'Faltan datos';
        r.texto = 'El programa pidió más datos con input() de los que trae esta prueba. ¿Pides los datos el número de veces correcto? Si es un bucle, ¿se detiene cuando debe?';
        break;
      case 'SalidaExcesiva':
        r.tipo = 'Demasiada salida';

      retos: {}, borradores: {}, respuestas: {}, pruebas: {}, coevaluaciones: [], insignias: {}, pasos: {}, ejecuciones: {}

  };

  }

    const conReto = sesiones.filter(s => s.reto && s.reto.tipo !== 'proyecto');
    let puntos = 0;
    for (const s of conReto) {

    }

    _plegarPista() {
      this.raiz.classList.toggle('pista-plegada');
      setTimeout(() => this._redimensionar(), 260);
    }

    _pista(k, inicial) {
      this.pistaActiva = k;
      for (const b of this.segPista.children) b.classList.toggle('activo', b.dataset.k === k);
      if (this.wsPista) { try { this.wsPista.dispose(); } catch (e) { /* nada */ } this.wsPista = null; }
      vaciar(this.cuerpoPista);
      if (!inicial && this.raiz.classList.contains('pista-plegada')) this._plegarPista();
      if (k === 'mio') this._pintarPistaMio();
      else if (k === 'pista') {
        const div = el('div', { class: 'blockly-div' });
        this.cuerpoPista.appendChild(el('p', { class: 'nota pista-nota' }, 'Así empieza la solución. Las piezas vacías son las que tú debes completar.'), div);
        this.wsPista = PB.blockly.crearLectura(div, 0.7);
        const n = this.reto.niveles && this.reto.niveles.explorador;
        const base = (n && n.inicio) || this.codigoInicial();
        try { PB.conv.cargar(this.wsPista, base); } catch (e) { /* nada */ }
        setTimeout(() => PB.blockly.encuadrar(this.wsPista, 0.75), 60);
      } else if (k === 'borrador') {
        const div = el('div', { class: 'blockly-div' });
        const acciones = el('div', { class: 'pista-acciones' },
          el('button', { class: 'btn btn-chico btn-suave', onclick: () => this._borradorAEditor() }, '⬅ Pasar al editor'),
          el('button', { class: 'btn btn-chico btn-suave', onclick: () => this._editorABorrador() }, 'Traer del editor ➡'));
        this.cuerpoPista.append(acciones, div);
        this.wsPista = PB.blockly.crearEspacio(div, { sesion: this.sesion.numero, modo: 1, permitidos: null, escala: 0.7 });
        const b = PB.progreso.borrador('bb:' + this.claveBase);
        if (b) { try { Blockly.serialization.workspaces.load(b, this.wsPista); } catch (e) { /* nada */ } }
        this.wsPista.addChangeListener(PB.util.debounce((ev) => {
          if (this.destruido || !this.wsPista) return;
          PB.progreso.guardarBorrador('bb:' + this.claveBase, Blockly.serialization.workspaces.save(this.wsPista));
        }, 400));
      }
      setTimeout(() => this._redimensionar(), 60);
    }

    _pintarPistaMio() {
      if (!this.cuerpoPista || this.pistaActiva !== 'mio') return;
      const codigo = this.editor ? this.editor.valor : '';
      if (!this.wsPista) {
        vaciar(this.cuerpoPista);
        this.avisoPista = el('p', { class: 'nota pista-nota' }, 'Tu código, convertido en bloques.');
        const div = el('div', { class: 'blockly-div' });
        this.cuerpoPista.append(this.avisoPista, div);
        this.wsPista = PB.blockly.crearLectura(div, 0.7);
      }
      const diag = PB.py.revisarSintaxis(codigo);
      if (diag) {
        this.avisoPista.textContent = `Corrige la línea ${diag.linea} para ver tus bloques: ${diag.mensaje}`;
        this.avisoPista.classList.add('aviso-error');
        return;
      }
      this.avisoPista.textContent = 'Tu código, convertido en bloques.';
      this.avisoPista.classList.remove('aviso-error');
      try { PB.conv.cargar(this.wsPista, codigo); PB.blockly.encuadrar(this.wsPista, 0.75); } catch (e) { /* nada */ }
    }

    async _borradorAEditor() {
      if (!this.wsPista) return;
      const codigo = PB.gen.generar(this.wsPista).codigo;
      if (!codigo.trim()) { PB.ui.aviso('El borrador está vacío.', 'info'); return; }
      if (this.editor.valor.trim() && !(await PB.ui.confirmar('Se reemplazará lo que tienes en el editor por el código del borrador. ¿Continuar?', 'Pasar al editor', 'Reemplazar'))) return;
      this.editor.valor = codigo;
      PB.progreso.guardarBorrador('t:' + this.claveBase, codigo);
    }

    _editorABorrador() {
      const diag = PB.py.revisarSintaxis(this.editor.valor);
      if (diag) { PB.ui.alerta(`Corrige primero la línea ${diag.linea}: ${diag.mensaje}`); return; }
      try { PB.conv.cargar(this.wsPista, this.editor.valor); PB.blockly.encuadrar(this.wsPista, 0.75); } catch (e) { /* nada */ }
    }

    /* ---------------- Código actual ---------------- */
    codigoActual() {
      if (this.modo <= 2) {
        if (this.ws) this.gen = PB.gen.generar(this.ws);
        return this.gen.codigo;
      }
      return this.editor ? this.editor.valor : '';
    }

    _marcarLinea(n, clase) {
      if (this.modo <= 2) {
        if (this.panel) this.panel.marcar(n, clase);
        if (this.ws) {
          const id = n ? this.gen.lineaABloque[n] : null;
          if (clase === 'actual') this.ws.highlightBlock(id || null);
          if (clase === 'error' && id) {
            const b = this.ws.getBlockById(id);
            if (b) { b.select(); this._centrarSiFuera(b); }
          }
        }
      } else if (this.editor) {
        this.editor.limpiarMarcas(clase);
        if (n) this.editor.marcarLinea(n, clase);
      }
    }
    _limpiarMarcas() {
      if (this.panel) { this.panel.limpiar('actual'); this.panel.limpiar('error'); }
      if (this.ws) this.ws.highlightBlock(null);
      if (this.editor) this.editor.limpiarMarcas();
    }

    /* ---------------- Ejecutar ---------------- */
    _ocupado(si, paso) {
      this.btnEjecutar.hidden = si;
      this.btnPaso.hidden = si;
      this.btnDetener.hidden = !si;
      this.btnComprobar.disabled = si;
      this.controlesPaso.hidden = !(si && paso);
      this.raiz.classList.toggle('paso-activo', !!(si && paso));
      setTimeout(() => this._redimensionar(), 30);
    }

    async ejecutar(paso = false) {
      if (PB.ejecutor.ocupado) return;
      const codigo = this.codigoActual();
      this._limpiarMarcas();
      this.consola.limpiar();
      this._sub('consola');
      if (this.raiz.classList.contains('angosto')) this._vista('inf');
      if (!codigo.trim()) {
        this.consola.mensaje(this.modo <= 2 ? 'Tu programa está vacío: arrastra bloques desde la caja de herramientas.' : 'Tu programa está vacío: escribe código en el editor.', 'info');
        return;
      }
      const diag = PB.py.revisarSintaxis(codigo);
      if (diag) {
        const exp = PB.errores.explicar({ tipo: diag.tipo, mensaje: diag.mensaje, linea: diag.linea, original: diag.tipo }, codigo);
        this.consola.mostrarError(exp);
        this._marcarLinea(exp.linea, 'error');
        return;
      }
      if (paso) {
        this.tablaVars.limpiar();
        PB.ejecutor.pausar(false);
        this.btnPausa.textContent = '⏸ Pausa';
        this.btnSiguiente.disabled = true;
      }
      this._ocupado(true, paso);
      const res = await PB.ejecutor.ejecutar(codigo, {
        alSalida: t => this.consola.escribir(t),
        alEntrada: () => {
          if (this.raiz.classList.contains('angosto')) this._vista('inf');
          return this.consola.pedir();
        },
        paso: paso ? {
          retardo: VELOCIDADES[this.velocidad].ms,
          alLinea: (linea, vars, locales) => {
            this._marcarLinea(linea, 'actual');
            this.tablaVars.mostrar(vars, locales, linea);
          }
        } : null
      });
      this.consola.cancelarPedido();
      this._ocupado(false);
      if (this.ws) this.ws.highlightBlock(null);
      if (this.panel) this.panel.limpiar('actual');
      if (this.editor) this.editor.limpiarMarcas('actual');
      if (res.error) {
        const exp = PB.errores.explicar(res.error, codigo);
        this.consola.mostrarError(exp);
        if (exp.linea) this._marcarLinea(exp.linea, 'error');
      } else {
        this.consola.mensaje('✔ El programa terminó.', 'exito');
      }
      PB.progreso.registrarEjecucion(this.claveBase, codigo, !res.error);
      if (this.esProyecto) this._requisitosEnVivo();
    }

    _pausar() {
      const p = !PB.ejecutor.pausado;
      PB.ejecutor.pausar(p);
      this.btnPausa.textContent = p ? '▶ Seguir' : '⏸ Pausa';
      this.btnSiguiente.disabled = !p;
    }
    _cambiarVelocidad() {
      this.velocidad = (this.velocidad + 1) % VELOCIDADES.length;
      PB.ejecutor.fijarRetardo(VELOCIDADES[this.velocidad].ms);
      this.btnVelocidad.textContent = 'Velocidad: ' + VELOCIDADES[this.velocidad].t;
    }

    /* ---------------- Comprobar ---------------- */
    _requisitosEnVivo() {
      if (!this.esProyecto || !this.listaRequisitos) return;
      const codigo = this.codigoActual();
      const cfg = PB.verificador.configuracion(this.reto, this.nivel);
      const r = PB.verificador.revisarRestricciones(codigo, cfg.requiere, cfg.prohibe);
      r.push({ texto: 'se ejecuta completo sin errores (ejecútalo con ▶)', ok: PB.progreso.ejecucionOk(this.claveBase, codigo) });
      this._pintarRequisitos(r);
      return r;
    }

    async comprobar() {
      if (PB.ejecutor.ocupado) return;
      const codigo = this.codigoActual();
      this._limpiarMarcas();
      this._sub('resultados');
      const caja = vaciar(this.contResultados);
      PB.progreso.sumarIntento(this.reto.id);

      if (this.esProyecto) {
        const r = this._requisitosEnVivo() || [];
        const cumplidos = r.filter(x => x.ok).length;
        PB.progreso.guardarRequisitos(this.reto.id, cumplidos, r.length);
        caja.appendChild(el('h3', {}, `Lista de cotejo: ${cumplidos} de ${r.length}`));
        const ul = el('ul', { class: 'requisitos grande' });
        for (const it of r) ul.appendChild(el('li', { class: it.ok ? 'ok' : 'no' }, it.texto));
        caja.appendChild(ul);
        if (cumplidos === r.length) {
          PB.progreso.marcarReto(this.reto.id, 'programador', this.modo);
          caja.appendChild(el('div', { class: 'resultado-ok' }, '🎉 ¡Tu proyecto cumple todos los requisitos! Descárgalo (⋯ → Descargar .py) y prepárate para presentarlo.'));
          this._celebrar({ proyecto: true });
          if (this.o.alSuperar) this.o.alSuperar({ ok: true });
        } else {
          caja.appendChild(el('p', { class: 'nota' }, 'Sigue trabajando: cuando cumplas todos los puntos, tu proyecto quedará entregado.'));
        }
        return;
      }

      caja.appendChild(el('p', { class: 'nota centro' }, 'Revisando…'));
      this.btnComprobar.disabled = true;
      const res = await PB.verificador.verificar(codigo, this.reto, this.nivel, {
        alProgreso: (i, n) => { caja.firstChild.textContent = `Revisando prueba ${i} de ${n}…`; }
      });
      this.btnComprobar.disabled = false;
      vaciar(caja);
      this._pintarResultados(caja, res, codigo);
      if (res.ok) {
        const nivel = this.nivel || 'programador';
        const r = PB.progreso.marcarReto(this.reto.id, nivel, this.modo);
        const insignias = PB.progreso.revisarInsignias();
        this._celebrar({ nivel: this.nivel, nuevo: r.nuevo, insignias });
        if (this.o.alSuperar) this.o.alSuperar({ ok: true, nivel, nuevo: r.nuevo });
      }
    }

    _pintarResultados(caja, res, codigo) {
      if (res.vacio) { caja.appendChild(el('p', { class: 'resultado-no' }, 'Tu programa está vacío.')); return; }
      if (res.sintaxis) {
        caja.appendChild(el('div', { class: 'resultado-no' }, el('strong', {}, '⚠ ' + res.sintaxis.titulo), el('p', {}, res.sintaxis.texto)));
        this._marcarLinea(res.sintaxis.linea, 'error');
        return;
      }
      const okTotal = res.ok;
      caja.appendChild(el('div', { class: okTotal ? 'resultado-ok' : 'resultado-no' },
        okTotal ? '🎉 ¡Reto superado! Tu programa pasó todas las pruebas.' : 'Todavía no: revisa lo que está en rojo.'));
      if (res.huecos) caja.appendChild(el('div', { class: 'res-item no' }, `✗ Quedan ${res.huecos} hueco(s) «___» sin completar.`));
      for (const rq of res.restricciones) {
        caja.appendChild(el('div', { class: 'res-item ' + (rq.ok ? 'ok' : 'no') }, (rq.ok ? '✓ ' : '✗ ') + 'Debe ' + rq.texto));
      }
      this._pintarRequisitos(res.restricciones);
      res.pruebas.forEach((p, idx) => {
        const det = el('details', { class: 'res-prueba ' + (p.ok ? 'ok' : 'no'), open: !p.ok && res.pruebas.findIndex(x => !x.ok) === idx ? true : null },
          el('summary', {}, (p.ok ? '✓ ' : '✗ ') + p.nombre + ' — ' + p.entradas),
          p.detalle ? el('p', { class: 'res-detalle' }, p.error ? '⚠ ' + p.error.titulo + ': ' + p.detalle : p.detalle) : null,
          el('div', { class: 'res-salida-titulo' }, 'Lo que mostró tu programa:'),
          PB.bloqueCodigo(p.salida || '(nada)', { clase: 'salida' }));
        caja.appendChild(det);
        if (!p.ok && p.error && p.error.linea && idx === res.pruebas.findIndex(x => !x.ok)) this._marcarLinea(p.error.linea, 'error');
      });
    }

    _celebrar({ nivel, nuevo, insignias = [], proyecto }) {
      const estrellas = proyecto ? 3 : (PB.progreso.ESTRELLAS[nivel] || 0);
      const cuerpo = el('div', { class: 'celebracion' },
        estrellas
          ? el('div', { class: 'estrellas-grandes' }, ...[1, 2, 3].map(i => el('span', { class: i <= estrellas ? 'llena' : '' }, '★')))
          : el('div', { class: 'estrellas-grandes' }, el('span', { class: 'llena' }, '🎉')),
        el('p', {}, proyecto ? '¡Proyecto entregado!' : (this.o.tipo === 'micro' ? '¡Micro-reto superado!' : this.o.tipo === 'extra' ? '¡Reto extra superado!' : `¡Reto superado en nivel ${NOMBRE_NIVEL[nivel] || 'Programador'}!`)),
        nivel && nivel !== 'maestro' && this.reto.niveles && this.reto.niveles.maestro ? el('p', { class: 'nota' }, nivel === 'explorador' ? '¿Te animas con el nivel Programador?' : '¿Te animas con el nivel Maestro?') : null);
      for (const u of insignias) {
        cuerpo.appendChild(el('div', { class: 'insignia-nueva' }, PB.vistas.insigniaSVG(u, true), el('div', {}, el('strong', {}, '¡Nueva insignia!'), el('div', {}, u.insignia))));
      }
      const botones = [{ texto: 'Seguir aquí', valor: 'quedarse' }];
      if (this.o.alSiguiente) botones.push({ texto: 'Siguiente →', tipo: 'primario', valor: 'siguiente' });
      else botones[0].tipo = 'primario';
      PB.ui.modal({ titulo: '¡Muy bien!', contenido: cuerpo, botones, clase: 'modal-celebracion' }).then(v => {
        if (v === 'siguiente' && this.o.alSiguiente) this.o.alSiguiente();
      });
    }

    /* ---------------- Menú ⋯ ---------------- */
    _menu(ev) {
      const opciones = [
        ['↺ Empezar de nuevo', () => this.reiniciar()],
        ['⬇ Descargar .py', () => this.descargar()],
        ['📋 Copiar el código', () => PB.archivos.copiar(this.codigoActual(), 'Tu código')]
      ];
      if (this.modo <= 2) {
        opciones.push(['🔍 Acercar bloques', () => this.ws && this.ws.zoomCenter(1)]);
        opciones.push(['🔎 Alejar bloques', () => this.ws && this.ws.zoomCenter(-1)]);
        opciones.push(['🧹 Ordenar bloques', () => this.ws && this.ws.cleanUp()]);
      }
      if (PB.estado.docente && this._solucion()) opciones.push(['🔑 Ver solución (docente)', () => this.verSolucion()]);
      PB.vistas.menuEmergente(ev.currentTarget, opciones.filter(o => o[1]));
    }

    _solucion() {
      const n = this.reto.niveles && this.nivel && this.reto.niveles[this.nivel];
      return (n && n.solucion) || this.reto.solucion || null;
    }

    verSolucion() {
      const sol = this._solucion();
      PB.ui.modal({
        titulo: 'Solución de referencia', ancho: '760px',
        contenido: (c) => {
          c.appendChild(el('p', { class: 'nota' }, 'Hay muchas soluciones correctas: esta es solo una.'));
          c.appendChild(PB.bloqueCodigo(sol, { numeros: true }));
        },
        botones: [{ texto: 'Cerrar', valor: null }, {
          texto: 'Cargar en el taller', tipo: 'primario', accion: () => {
            if (this.modo <= 2) { try { PB.conv.cargar(this.ws, sol); this._regenerar(true); PB.blockly.encuadrar(this.ws); } catch (e) { /* nada */ } }
            else { this.editor.valor = sol; PB.progreso.guardarBorrador('t:' + this.claveBase, sol); }
          }
        }]
      });
    }

    async reiniciar() {
      if (!(await PB.ui.confirmar('Se borrará lo que hiciste en este reto y volverá el código inicial. ¿Continuar?', 'Empezar de nuevo', 'Sí, empezar de nuevo', 'Cancelar', true))) return;
      this._limpiarMarcas();
      if (this.modo <= 2) {
        PB.progreso.guardarBorrador('b:' + this.claveBase, null);
        try { PB.conv.cargar(this.ws, this.codigoInicial()); } catch (e) { this.ws.clear(); }
        this._regenerar(true);
        PB.blockly.encuadrar(this.ws, PB.estado.escalaBloques || 0.85);
      } else {
        PB.progreso.guardarBorrador('t:' + this.claveBase, null);
        this.editor.valor = this._inicialComoTexto();
      }
      this.consola.limpiar();
    }

    descargar() {
      const codigo = this.codigoActual();
      const a = PB.progreso.alumno();
      const cabecera = `# ${this.o.titulo || this.reto.titulo}\n# Sesión ${this.sesion.numero} · ${PB.config.nombreCurso}\n# ${a.nombre ? 'Autor: ' + a.nombre + ' · ' : ''}${PB.util.fechaCorta(PB.util.hoyISO())}\n\n`;
      const nombre = `sesion-${String(this.sesion.numero).padStart(2, '0')}-${PB.util.slug(this.o.titulo || this.reto.titulo)}.py`;
      PB.archivos.descargar(nombre, cabecera + codigo, 'text/x-python');
    }

    /* ---------------- Tamaño ---------------- */
    _observarTamano() {
      const revisar = () => {
        if (this.destruido) return;
        const ancho = this.raiz.clientWidth;
        const angosto = ancho > 0 && ancho < 820;
        if (angosto !== this.raiz.classList.contains('angosto')) {
          this.raiz.classList.toggle('angosto', angosto);
          this._vista(this.vista || 'trabajo');
        }
        this._redimensionar();
      };
      if (window.ResizeObserver) {
        this.observador = new ResizeObserver(PB.util.debounce(revisar, 60));
        this.observador.observe(this.raiz);
      } else {
        this._alRedimensionar = PB.util.debounce(revisar, 100);
        window.addEventListener('resize', this._alRedimensionar);
      }
      setTimeout(revisar, 0);
    }

    _redimensionar() {
      for (const ws of [this.ws, this.wsPista]) {
        if (ws) { try { Blockly.svgResize(ws); } catch (e) { /* nada */ } }
      }
    }

    destruir() {
      this.destruido = true;
      if (PB.ejecutor.ocupado) PB.ejecutor.detener();
      if (this.observador) this.observador.disconnect();
      if (this._alRedimensionar) window.removeEventListener('resize', this._alRedimensionar);
      this._limpiarTrabajo();
      this.raiz.remove();
    }
  }

  return Taller;
})();

/* =========================================================================
 * 63-componentes.js — Componentes reutilizables de las vistas:
 * menú emergente, insignias, visor de ejemplos (Predecir → Ejecutar),
 * preguntas de opción múltiple, bloques de solo lectura y animaciones.
 * ========================================================================= */
'use strict';

PB.comp = (() => {
  const { el, vaciar } = PB.util;

  /* ---------- Menú emergente ---------- */
  function menuEmergente(ancla, opciones) {
    document.querySelectorAll('.menu-emergente').forEach(m => m.remove());
    const menu = el('div', { class: 'menu-emergente', role: 'menu' });
    for (const [texto, accion] of opciones) {
      menu.appendChild(el('button', { class: 'menu-item', role: 'menuitem', onclick: () => { menu.remove(); accion(); } }, texto));
    }
    document.body.appendChild(menu);
    const r = ancla.getBoundingClientRect();
    const ancho = menu.offsetWidth;
    menu.style.top = Math.min(window.innerHeight - menu.offsetHeight - 8, r.bottom + 6) + 'px';
    menu.style.left = Math.max(8, Math.min(window.innerWidth - ancho - 8, r.right - ancho)) + 'px';
    const cerrar = (ev) => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('pointerdown', cerrar, true); } };
    setTimeout(() => document.addEventListener('pointerdown', cerrar, true), 0);
  }

  /* ---------- Insignias ---------- */
  function insigniaSVG(unidad, ganada = true, tam = 64) {
    const color = ganada ? unidad.color : '#C9CED9';
    const caja = el('div', { class: 'insignia' + (ganada ? ' ganada' : ' bloqueada'), title: unidad.insignia + (ganada ? '' : ' (por ganar)') });
    caja.innerHTML = `<svg width="${tam}" height="${tam}" viewBox="0 0 64 64" aria-hidden="true">
      <polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5" fill="${color}" stroke="#ffffff" stroke-width="3"/>
      <polygon points="32,10 51,21 51,43 32,54 13,43 13,21" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="32" y="41" text-anchor="middle" font-size="24">${ganada ? unidad.icono || '★' : '🔒'}</text></svg>`;
    return caja;
  }

  /* ---------- Bloques de solo lectura a partir de Python ---------- */
  function bloquesLectura(contenedor, codigo, { alto = 180, escala = 0.75 } = {}) {
    const div = el('div', { class: 'bloques-lectura', style: { height: alto + 'px' } });
    contenedor.appendChild(div);
    let ws = null;
    const montar = () => {
      if (ws || !document.body.contains(div)) return;
      ws = PB.blockly.crearLectura(div, escala);
      try { PB.conv.cargar(ws, codigo); } catch (e) { div.textContent = 'No se pudo mostrar como bloques.'; }
      setTimeout(() => PB.blockly.encuadrar(ws, escala), 40);
      PB.app.alSalir(() => { try { ws.dispose(); } catch (e) { /* nada */ } });
    };
    setTimeout(montar, 0);
    return { div, get ws() { return ws; } };
  }

  /* ---------- Pregunta de opción múltiple ---------- */
  /**
   * p: {pregunta, codigo?, bloques?, opciones:[...], correcta, explicacion, codigoOpciones?}
   * clave: dónde guardar la respuesta (o null)
   * opciones: {unaVez, alResponder(correcta, indice), mostrarSiempre}
   */
  function pregunta(contenedor, p, clave, { unaVez = false, alResponder = null } = {}) {
    const caja = el('div', { class: 'pregunta' });
    contenedor.appendChild(caja);
    caja.appendChild(el('div', { class: 'pregunta-texto', html: p.pregunta }));
    if (p.codigo) caja.appendChild(PB.bloqueCodigo(p.codigo, { numeros: p.codigo.split('\n').length > 2 }));
    if (p.bloques) bloquesLectura(caja, p.bloques, { alto: p.altoBloques || 150 });
    const lista = el('div', { class: 'opciones' + (p.codigoOpciones ? ' opciones-codigo' : '') });
    caja.appendChild(lista);
    const retro = el('div', { class: 'retro', hidden: true });
    caja.appendChild(retro);
    const previa = clave ? PB.progreso.respuesta(clave) : null;
    const botones = p.opciones.map((op, i) => {
      const b = el('button', { class: 'opcion', type: 'button', onclick: () => elegir(i) });
      b.appendChild(el('span', { class: 'opcion-letra' }, String.fromCharCode(65 + i)));
      if (p.codigoOpciones) b.appendChild(PB.bloqueCodigo(op, { clase: 'en-opcion' }));
      else b.appendChild(el('span', { class: 'opcion-texto', html: op }));
      lista.appendChild(b);
      return b;
    });
    function marcar(i, guardar) {
      const ok = i === p.correcta;
      botones.forEach((b, j) => {
        b.classList.toggle('elegida', j === i);
        b.classList.toggle('correcta', j === p.correcta && (ok || unaVez));
        b.classList.toggle('incorrecta', j === i && !ok);
        if (unaVez && !PB.estado.docente) b.disabled = true;
      });
      retro.hidden = false;
      retro.className = 'retro ' + (ok ? 'retro-ok' : 'retro-no');
      vaciar(retro);
      retro.appendChild(el('strong', {}, ok ? '✓ ¡Correcto! ' : (unaVez ? '✗ No era esa. ' : '✗ Todavía no. ')));
      if (ok || unaVez) { if (p.explicacion) retro.appendChild(el('span', { html: p.explicacion })); }
      else retro.appendChild(el('span', {}, 'Vuelve a leer el código con calma e inténtalo otra vez.'));
      if (guardar && clave) PB.progreso.responder(clave, { respuesta: i, correcta: ok });
      if (alResponder) alResponder(ok, i);
    }
    function elegir(i) {
      if (unaVez && previa && !PB.estado.docente) return;
      marcar(i, true);
    }
    if (previa && typeof previa.respuesta === 'number') marcar(previa.respuesta, false);
    if (PB.estado.docente) caja.appendChild(el('div', { class: 'nota docente-nota' }, '🔑 Respuesta correcta: ' + String.fromCharCode(65 + p.correcta)));
    return caja;
  }

  /* ---------- Visor de ejemplos: Predecir → Ejecutar → Investigar ---------- */
  class Visor {
    constructor(contenedor, { codigo, modo, sesion }) {
      this.codigo = codigo;
      this.modo = modo;
      this.raiz = el('div', { class: 'visor' + (modo <= 2 ? ' visor-bloques' : ' visor-texto') });
      contenedor.appendChild(this.raiz);
      this.velocidad = 700;
      const izq = el('div', { class: 'visor-izq' });
      const der = el('div', { class: 'visor-der' });
      this.raiz.append(izq, der);
      if (modo <= 2) {
        const div = el('div', { class: 'blockly-div' });
        izq.appendChild(div);
        setTimeout(() => {
          if (!document.body.contains(div)) return;
          this.ws = PB.blockly.crearLectura(div, 0.8);
          try { PB.conv.cargar(this.ws, codigo); } catch (e) { /* nada */ }
          this.gen = PB.gen.generar(this.ws);
          this.panel.mostrar(this.gen);
          setTimeout(() => PB.blockly.encuadrar(this.ws, 0.85), 40);
          PB.app.alSalir(() => { try { this.ws.dispose(); } catch (e) { /* nada */ } });
        }, 0);
        der.appendChild(el('div', { class: 'lateral-cabeza' }, '🐍 Python'));
        const cont = el('div', { class: 'panel-python-cont' });
        der.appendChild(cont);
        this.panel = new PB.PanelPython(cont, {});
      } else {
        this.editor = new PB.Editor(izq, { codigo, soloLectura: true });
      }
      const controles = el('div', { class: 'visor-controles' },
        this.btnRun = el('button', { class: 'btn btn-ejecutar', onclick: () => this.ejecutar(false) }, '▶ Ejecutar'),
        this.btnPaso = el('button', { class: 'btn btn-suave', onclick: () => this.ejecutar(true) }, '👣 Paso a paso'),
        this.btnStop = el('button', { class: 'btn btn-detener', hidden: true, onclick: () => PB.ejecutor.detener() }, '⏹ Detener'));
      der.appendChild(controles);
      const abajo = el('div', { class: 'visor-abajo' });
      der.appendChild(abajo);
      this.consola = new PB.Consola(abajo);
      this.vars = new PB.TablaVariables(abajo);
      this.bloqueado = false;
      PB.app.alSalir(() => { if (PB.ejecutor.ocupado) PB.ejecutor.detener(); });
    }

    bloquear(si, mensaje) {
      this.bloqueado = si;
      this.btnRun.disabled = si;
      this.btnPaso.disabled = si;
      this.btnRun.title = si ? mensaje : '';
      this.btnPaso.title = si ? mensaje : '';
    }

    _codigo() { return this.modo <= 2 && this.gen ? this.gen.codigo : this.codigo; }

    _marcar(n) {
      if (this.panel) this.panel.marcar(n, 'actual');
      if (this.ws) this.ws.highlightBlock(n && this.gen ? this.gen.lineaABloque[n] || null : null);
      if (this.editor) { this.editor.limpiarMarcas('actual'); if (n) this.editor.marcarLinea(n, 'actual'); }
    }

    async ejecutar(paso) {
      if (PB.ejecutor.ocupado || this.bloqueado) return;
      this.consola.limpiar();
      this.vars.limpiar();
      this.raiz.classList.toggle('paso-activo', paso);
      this.btnRun.hidden = this.btnPaso.hidden = true;
      this.btnStop.hidden = false;
      const codigo = this._codigo();
      const res = await PB.ejecutor.ejecutar(codigo, {
        alSalida: t => this.consola.escribir(t),
        alEntrada: () => this.consola.pedir(),
        paso: paso ? { retardo: this.velocidad, alLinea: (n, v, l) => { this._marcar(n); this.vars.mostrar(v, l, n); } } : null
      });
      this.consola.cancelarPedido();
      this._marcar(null);
      this.btnRun.hidden = this.btnPaso.hidden = false;
      this.btnStop.hidden = true;
      if (res.error) this.consola.mostrarError(PB.errores.explicar(res.error, codigo));
      else this.consola.mensaje('✔ El programa terminó.', 'exito');
    }
  }

  /* ---------- Bloque de código de teoría que se puede probar ---------- */
  function codigoProbable(contenedor, codigo, nota) {
    const caja = el('div', { class: 'codigo-probable' });
    caja.appendChild(PB.bloqueCodigo(codigo, { numeros: codigo.split('\n').length > 3 }));
    const salida = el('div', { class: 'mini-consola', hidden: true });
    const consola = new PB.Consola(salida);
    const btn = el('button', {
      class: 'btn btn-chico btn-ejecutar', onclick: async () => {
        if (PB.ejecutor.ocupado) return;
        salida.hidden = false;
        consola.limpiar();
        btn.disabled = true;
        const r = await PB.ejecutor.ejecutar(codigo, { alSalida: t => consola.escribir(t), alEntrada: () => consola.pedir() });
        btn.disabled = false;
        if (r.error) consola.mostrarError(PB.errores.explicar(r.error, codigo));
      }
    }, '▶ Probar');
    caja.appendChild(el('div', { class: 'codigo-acciones' }, btn, nota ? el('span', { class: 'nota', html: nota }) : null));
    caja.appendChild(salida);
    contenedor.appendChild(caja);
    return caja;
  }

  /* ---------- Animaciones de la información de apoyo ---------- */
  function animacion(contenedor, tipo) {
    const caja = el('div', { class: 'animacion anim-' + tipo });
    contenedor.appendChild(caja);
    const fn = ANIMACIONES[tipo];
    if (fn) fn(caja); else caja.textContent = '';
    return caja;
  }

  function temporizador(caja, pasos, ms, pintar) {
    let i = 0, t = null;
    const controles = el('div', { class: 'anim-controles' });
    const btn = el('button', { class: 'btn btn-chico btn-suave' }, '▶ Reproducir');
    const paso = el('button', { class: 'btn btn-chico btn-suave' }, 'Paso ▸');
    const reiniciar = el('button', { class: 'btn btn-chico btn-suave' }, '↺');
    controles.append(btn, paso, reiniciar);
    caja.appendChild(controles);
    const detener = () => { clearInterval(t); t = null; btn.textContent = '▶ Reproducir'; };
    const avanzar = () => {
      if (i >= pasos - 1) { detener(); return false; }
      i++; pintar(i); return true;
    };
    btn.onclick = () => {
      if (t) { detener(); return; }
      if (i >= pasos - 1) { i = 0; pintar(0); }
      btn.textContent = '⏸ Pausa';
      t = setInterval(() => { if (!avanzar()) detener(); }, ms);
    };
    paso.onclick = () => { detener(); avanzar(); };
    reiniciar.onclick = () => { detener(); i = 0; pintar(0); };
    PB.app.alSalir(detener);
    pintar(0);
  }

  const ANIMACIONES = {
    // Variables como cajas con etiqueta
    variables(caja) {
      const pasos = [
        { linea: 'puntos = 0', cajas: { puntos: '0' }, nota: 'Se crea una caja llamada «puntos» y se guarda 0 adentro.' },
        { linea: 'puntos = puntos + 10', cajas: { puntos: '10' }, nota: 'Python calcula primero la derecha (0 + 10) y guarda el resultado.' },
        { linea: 'nombre = "Ana"', cajas: { puntos: '10', nombre: '"Ana"' }, nota: 'Otra caja, ahora con texto (str).' },
        { linea: 'puntos = 25', cajas: { puntos: '25', nombre: '"Ana"' }, nota: 'Guardar un valor nuevo reemplaza al anterior.' }
      ];
      const codigo = el('div', { class: 'anim-codigo' });
      const zona = el('div', { class: 'anim-cajas' });
      const nota = el('p', { class: 'anim-nota' });
      caja.append(codigo, zona, nota);
      temporizador(caja, pasos.length, 1800, i => {
        codigo.innerHTML = pasos.map((p, j) => `<div class="${j === i ? 'actual' : j < i ? 'hecho' : ''}">${PB.py.resaltar(p.linea)[0]}</div>`).join('');
        vaciar(zona);
        for (const [k, v] of Object.entries(pasos[i].cajas)) {
          const cambio = i > 0 && pasos[i - 1].cajas[k] !== v;
          zona.appendChild(el('div', { class: 'anim-caja' + (cambio ? ' cambio' : '') }, el('div', { class: 'anim-valor' }, v), el('div', { class: 'anim-etiqueta' }, k)));
        }
        nota.textContent = pasos[i].nota;
      });
    },
    // if / else: el camino que se toma
    decision(caja) {
      const valores = [15, 4, 10];
      const zona = el('div', { class: 'anim-decision' });
      const nota = el('p', { class: 'anim-nota' });
      caja.append(zona, nota);
      temporizador(caja, valores.length, 2200, i => {
        const edad = valores[i];
        const si = edad >= 10;
        zona.innerHTML = `<div class="anim-dato">edad = ${edad}</div>
          <div class="anim-rombo">edad >= 10 ?</div>
          <div class="anim-ramas"><div class="anim-rama ${si ? 'activa' : ''}"><b>True</b><span>print("Puedes subir")</span></div>
          <div class="anim-rama ${si ? '' : 'activa'}"><b>False</b><span>print("Todavía no")</span></div></div>`;
        nota.textContent = `Con edad = ${edad}, la condición es ${si ? 'True' : 'False'}: se ejecuta solo el camino ${si ? 'del if' : 'del else'}.`;
      });
    },
    // Bucle for con contador
    bucle(caja) {
      const n = 4;
      const zona = el('div', { class: 'anim-bucle' });
      const nota = el('p', { class: 'anim-nota' });
      caja.append(el('div', { class: 'anim-codigo' }, PB.bloqueCodigo('for i in range(4):\n    print("Vuelta", i)')), zona, nota);
      temporizador(caja, n + 1, 1300, k => {
        const vueltas = [];
        for (let j = 0; j < n; j++) vueltas.push(`<div class="anim-vuelta ${j < k ? 'hecha' : ''} ${j === k - 1 ? 'actual' : ''}">${j}</div>`);
        zona.innerHTML = `<div class="anim-flecha">↻</div><div class="anim-vueltas">${vueltas.join('')}</div>`;
        nota.textContent = k === 0 ? 'range(4) da los números 0, 1, 2 y 3.' : (k <= n ? `Vuelta con i = ${k - 1}: se imprime «Vuelta ${k - 1}».` : '');
        if (k === n) nota.textContent += ' Se acabaron los números: el bucle termina.';
      });
    },
    // while: repetir mientras se cumpla
    mientras(caja) {
      const zona = el('div', { class: 'anim-bucle' });
      const nota = el('p', { class: 'anim-nota' });
      caja.append(el('div', { class: 'anim-codigo' }, PB.bloqueCodigo('n = 3\nwhile n > 0:\n    print(n)\n    n = n - 1\nprint("¡Despegue!")')), zona, nota);
      const estados = [3, 2, 1, 0];
      temporizador(caja, estados.length, 1500, k => {
        const n = estados[k];
        zona.innerHTML = `<div class="anim-dato">n = ${n}</div><div class="anim-rombo ${n > 0 ? 'si' : 'no'}">n > 0 → ${n > 0 ? 'True' : 'False'}</div>`;
        nota.textContent = n > 0 ? `Como ${n} > 0 es True, se imprime ${n} y n baja a ${n - 1}.` : 'Ahora 0 > 0 es False: el while termina y se imprime «¡Despegue!».';
      });
    },
    // Listas con posiciones desde 0
    lista(caja) {
      const elementos = ['"lápiz"', '"libreta"', '"regla"'];
      const zona = el('div', { class: 'anim-lista' });
      const nota = el('p', { class: 'anim-nota' });
      caja.append(zona, nota);
      const pasos = [
        { items: elementos, marca: -1, texto: 'mochila = ["lápiz", "libreta", "regla"] — tres elementos en orden.' },
        { items: elementos, marca: 0, texto: 'mochila[0] es "lápiz": ¡la primera posición es 0!' },
        { items: elementos, marca: 2, texto: 'mochila[2] es "regla", el último. len(mochila) es 3.' },
        { items: [...elementos, '"goma"'], marca: 3, texto: 'mochila.append("goma") agrega al final, en la posición 3.' }
      ];
      temporizador(caja, pasos.length, 2000, i => {
        const p = pasos[i];
        zona.innerHTML = p.items.map((v, j) => `<div class="anim-celda ${j === p.marca ? 'marca' : ''}"><div class="anim-valor">${PB.util.esc(v)}</div><div class="anim-indice">${j}</div></div>`).join('');
        nota.textContent = p.texto;
      });
    },
    // Funciones como máquinas
    funcion(caja) {
      const zona = el('div', { class: 'anim-funcion' });
      const nota = el('p', { class: 'anim-nota' });
      caja.append(el('div', { class: 'anim-codigo' }, PB.bloqueCodigo('def doble(n):\n    return n * 2\n\nprint(doble(4))')), zona, nota);
      const pasos = ['entra', 'procesa', 'sale'];
      temporizador(caja, pasos.length, 1600, i => {
        zona.innerHTML = `<div class="anim-entrada ${i >= 0 ? 'activa' : ''}">4</div><div class="anim-maquina ${i === 1 ? 'trabajando' : ''}">doble<br><small>n * 2</small></div><div class="anim-salida ${i === 2 ? 'activa' : ''}">${i === 2 ? '8' : '?'}</div>`;
        nota.textContent = ['El valor 4 entra a la función y se guarda en el parámetro n.', 'La función calcula n * 2.', 'return devuelve 8, y print lo muestra.'][i];
      });
    }
  };

  return { menuEmergente, insigniaSVG, bloquesLectura, pregunta, Visor, codigoProbable, animacion };
})();

  /* ================================================================ *
   * SESIÓN
   * ================================================================ */
  V.sesion = function (main, num, paso, sub, sub2) {
    const s = PB.curso.sesiones.find(x => x.numero === num);
    if (!s) { main.appendChild(el('p', {}, 'No existe esa sesión.')); return; }
    const pasos = pasosDe(s);
    // Talleres: ocupan toda la pantalla
    if (sub !== undefined && ['micro', 'reto', 'extra', 'proyecto', 'ejemplo'].includes(paso)) {
      PB.almacen.escribir('pb:ultima:' + PB.config.idCurso, { sesion: num, paso: paso === 'proyecto' ? 'reto' : paso });
      abrirTaller(main, s, paso, sub, sub2, pasos);
      return;
    }
    if (!paso || !pasos.find(p => p.id === paso)) paso = pasos[0].id;
    PB.almacen.escribir('pb:ultima:' + PB.config.idCurso, { sesion: num, paso });

    PB.progreso.marcarPaso(num, paso);
    const u = unidadDe(s);
    const cab = el('section', { class: 'sesion-cabeza', style: { '--color-unidad': u.color } },
      el('a', { class: 'btn-icono volver', href: '#/', title: 'Volver al inicio', 'aria-label': 'Volver al inicio' }, '←'),
      el('div', { class: 'sesion-titulos' },
        el('div', { class: 'sesion-unidad' }, u.numero > 0 && u.numero < 7 ? `Unidad ${u.numero} · ${u.nombre}` : u.nombre),
        el('h1', {}, `Sesión ${s.numero}: ${s.titulo}`),
        el('div', { class: 'sesion-chips' }, chipModo(s.modo), ...(s.python || []).map(c => el('code', { class: 'chip chip-codigo' }, c)))),
      el('div', { class: 'sesion-navegacion' },
        num > 0 ? el('a', { class: 'btn btn-chico btn-suave', href: '#/s/' + (num - 1) }, '‹ Anterior') : null,
        num < PB.curso.sesiones.length - 1 ? el('a', { class: 'btn btn-chico btn-suave', href: '#/s/' + (num + 1) }, 'Siguiente ›') : null));
    main.appendChild(cab);

    const nav = el('nav', { class: 'pasos', 'aria-label': 'Pasos de la sesión' });
    pasos.forEach((p, i) => {
      nav.appendChild(el('a', {
        class: 'paso' + (p.id === paso ? ' activo' : '') + (PB.progreso.pasoVisto(num, p.id) ? ' visto' : ''),
        href: `#/s/${num}/${p.id}`, 'aria-current': p.id === paso ? 'step' : null
      }, el('span', { class: 'paso-num' }, String(i + 1)), el('span', { class: 'paso-icono' }, p.icono), el('span', { class: 'paso-nombre' }, p.nombre)));
    });
    main.appendChild(nav);

    const cont = el('section', { class: 'sesion-contenido paso-' + paso });
    main.appendChild(cont);
    const indice = pasos.findIndex(p => p.id === paso);
    const siguiente = pasos[indice + 1];
    const botonSiguiente = () => siguiente
      ? el('div', { class: 'siguiente-paso' }, el('a', { class: 'btn btn-primario', href: `#/s/${num}/${siguiente.id}` }, `Siguiente: ${siguiente.nombre} →`))
      : null;

    const renderers = { teoria: pasoTeoria, ejemplo: pasoEjemplo, micro: pasoMicro, reto: pasoReto, extra: pasoExtra, coevaluacion: pasoCoevaluacion, prueba: pasoPrueba, cierre: pasoCierre };
    renderers[paso](cont, s, botonSiguiente);
    if (PB.estado.docente && s.plan && paso === 'teoria') pintarPlan(cont, s);
  };

  function abrirTaller(main, s, paso, sub, sub2, pasos) {
    main.classList.add('con-taller');
    const volver = () => ir(`#/s/${s.numero}/${paso === 'proyecto' ? 'reto' : paso}`);
    let opciones = null;
    if (paso === 'micro') {
      const i = parseInt(sub, 10) - 1;
      const m = (s.microretos || [])[i];
      if (!m) { volver(); return; }
      const sig = s.microretos[i + 1];
      opciones = {
        sesion: s, reto: m, tipo: 'micro', etiqueta: `Micro-reto ${i + 1} de ${s.microretos.length}`,
        modo: m.modo, alVolver: volver,
        alSiguiente: () => ir(sig ? `#/s/${s.numero}/micro/${i + 2}` : `#/s/${s.numero}/${pasos.find(p => p.id === 'reto') ? 'reto' : 'cierre'}`)
      };
    } else if (paso === 'reto') {
      const nivel = ['explorador', 'programador', 'maestro'].includes(sub) ? sub : 'programador';
      opciones = {
        sesion: s, reto: s.reto, nivel, tipo: 'reto', alVolver: volver,
        alSiguiente: () => ir(`#/s/${s.numero}/${s.extra ? 'extra' : 'cierre'}`)
      };
    } else if (paso === 'proyecto') {
      const op = (s.reto.opciones || []).find(o => o.id === sub) || (s.reto.opciones || [])[0];
      opciones = {
        sesion: s, reto: s.reto, tipo: 'proyecto', claveExtra: op ? op.id : null, alVolver: volver,
        titulo: op ? op.titulo : s.reto.titulo, enunciado: op ? op.descripcion : null,
        codigoInicial: op ? op.inicio : (s.reto.inicio || ''), modo: s.modo
      };
    } else if (paso === 'extra') {
      opciones = { sesion: s, reto: s.extra, tipo: 'extra', alVolver: volver, alSiguiente: () => ir(`#/s/${s.numero}/cierre`) };
    } else if (paso === 'ejemplo') {
      opciones = {
        sesion: s, reto: { id: 'ejemplo-' + s.numero, titulo: 'Modifica el ejemplo: ' + s.ejemplo.titulo, enunciado: s.ejemplo.modificar || 'Cambia el programa y ejecútalo para ver qué pasa. Aquí no hay pruebas: ¡experimenta!' },
        tipo: 'libre', codigoInicial: s.ejemplo.codigo, alVolver: volver, etiqueta: 'Modificar (PRIMM)'
      };
    }
    const taller = new PB.Taller(main, opciones);
    PB.app.alSalir(() => taller.destruir());
  }

  /* ---------- Paso: teoría ---------- */

          tb.appendChild(el('tr', {}, el('td', { html: f.scratch }), el('td', {}, PB.bloqueCodigo(f.python)), t.filas.some(x => x.nota) ? el('td', { html: f.nota || '' }) : null));

    }

      : 'Son las mismas 10 preguntas de la prueba diagnóstica. Lee cada programa con calma y predice qué hace.' }));
    if (hecha && !PB.estado.docente) {
      mostrarResultadoPrueba(c, tipo, hecha, items);
      c.appendChild(sig());

    }
    let i = 0;
    const respuestas = [];

      vaciar(zona);

  function consolidar(zona, textos) {
    const filas = [];
    const errores = [];
    for (const t of textos) {
      try { filas.push(PB.progreso.leerExterno(t)); } catch (e) { errores.push(e.message); }
    }
    vaciar(zona);
    if (errores.length) zona.appendChild(el('p', { class: 'campo-error' }, `${errores.length} archivo(s) no se pudieron leer.`));
    if (!filas.length) return;
    const sesionesReto = PB.curso.sesiones.filter(s => s.reto && s.reto.tipo !== 'proyecto');
    const cfg = PB.config.evaluacion;
    const encabezado = ['Alumno', 'Grupo', ...sesionesReto.map(s => 'S' + s.numero), 'Retos %', 'Mini-proy. req.', 'Proyecto req.', 'Tickets %', 'Diagnóstica', 'Final', 'Estimado'];
    const datos = filas.map(d => {
      const nivel = (id) => {
        const e = d.retos[id];
        if (!e || !e.niveles) return '';
        return e.niveles.maestro ? 'M' : e.niveles.programador ? 'P' : e.niveles.explorador ? 'E' : '';
      };
      let pts = 0;
      const celdas = sesionesReto.map(s => {
        const n = nivel(s.reto.id);
        pts += n === 'M' || n === 'P' ? 1 : n === 'E' ? cfg.creditoExplorador : 0;
        return n;
      });
      const retos = Math.round(pts / sesionesReto.length * 100);
      const req = (num) => {
        const s = PB.curso.sesiones.find(x => x.numero === num);
        const e = s && s.reto ? d.retos[s.reto.id] : null;
        return e && e.requisitosTotal ? { txt: `${e.requisitosCumplidos}/${e.requisitosTotal}`, pct: e.requisitosCumplidos / e.requisitosTotal * 100 } : { txt: '', pct: 0 };
      };
      const mini = req(cfg.sesionMiniProyecto), fin = req(cfg.sesionProyectoFinal);
      const conTicket = PB.curso.sesiones.filter(s => s.ticket);
      const tickets = Math.round(conTicket.filter(s => (d.respuestas['ticket:' + s.numero] || {}).correcta).length / (conTicket.length || 1) * 100);
      const total = Math.round((retos * cfg.pesos.retos + mini.pct * cfg.pesos.miniProyecto + fin.pct * cfg.pesos.proyectoFinal + tickets * cfg.pesos.tickets) / 100);
      const p = (k) => d.pruebas && d.pruebas[k] ? `${d.pruebas[k].puntaje}/${d.pruebas[k].total}` : '';
      return [d.alumno?.nombre || '(sin nombre)', d.alumno?.grupo || '', ...celdas, retos, mini.txt, fin.txt, tickets, p('diagnostica'), p('final'), total];

    const tabla = el('table', { class: 'tabla-grupo' }, el('thead', {}, el('tr', {}, ...encabezado.map(h => el('th', {}, h)))));
    const tb = el('tbody');
    for (const f of datos) tb.appendChild(el('tr', {}, ...f.map(c => el('td', {}, String(c)))));
    tabla.appendChild(tb);
    // Promedios de pruebas para reportar el avance del grupo
    const prom = (k) => {
      const v = filas.filter(d => d.pruebas && d.pruebas[k]).map(d => d.pruebas[k].puntaje);
